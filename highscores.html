<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Boek der Groten — Oh Mooie Wereld!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & basis ──────────────────────────────────── */
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:100%; height:100%; overflow:hidden;
  font-family:'Baloo 2',cursive,sans-serif; color:#3a2c14; }

body{
  background:#1a2744;
  background-image:url('images/boek-achtergrond.png');
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

/* ── Linkernavigatie: terug-knop bovenaan, daaronder (met wat open
   ruimte ertussen) de 5 tabblad-iconen als verticale rij. Eén vaste
   container zodat alles samen linksboven blijft, ongeacht schermgrootte. */
#linker-navigatie{
  position:fixed; left:14px; top:14px; z-index:100;
  display:flex; flex-direction:column; align-items:flex-start;
}

/* ── Terug-knop (zelfde grootte als in het spel) ───── */
.terug-knop{
  width:clamp(130px, 13vw, 210px);
  cursor:pointer; border:none; background:none; padding:0;
  opacity:0.92; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  transition:opacity .15s, transform .15s;
}
.terug-knop img{ width:100%; display:block; }
.terug-knop:hover{ opacity:1; transform:scale(1.03); }

/* ── Tabbladenstrip (menu): de 5 eigen icoontjes van Arjen, verticaal
   onder de terug-knop. Open ruimte erboven (margin-top) zodat het niet
   tegen de terug-knop aan plakt. */
.tabblad-strip{
  display:flex; flex-direction:column; gap:9px;
  margin-top:clamp(20px, 4vh, 40px);
}
.nav-btn{
  width:clamp(83px, 8vw, 130px); aspect-ratio:1/1;
  border:none; background:none; padding:0; cursor:pointer;
  opacity:0.82; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));
  transition:opacity .15s, transform .15s, filter .15s;
}
.nav-btn img{ width:100%; height:100%; display:block; object-fit:contain; }
.nav-btn:hover{ opacity:1; transform:scale(1.05); }
.nav-btn.actief{
  opacity:1; transform:scale(1.08);
  filter:drop-shadow(0 0 9px rgba(255,215,110,.85)) drop-shadow(0 3px 8px rgba(0,0,0,.4));
}

/* ── Twee-pagina layout (linker- en rechterbladzijde) ─ */
.boek-paginas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(40px, 8.6vw, 170px);      /* ruimte voor de boekrug */
  padding:clamp(64px,14vh,130px) clamp(60px,13.85vw,250px) clamp(56px,10vh,110px);
  width:100%; height:100%;
  overflow:hidden;
}

.pagina{
  overflow-y:auto; overflow-x:hidden;
  padding:8px clamp(6px,1.5vw,16px);
  /* Scrollbar styling */
  scrollbar-width:thin;
  scrollbar-color:rgba(201,168,76,.4) transparent;
}
.pagina::-webkit-scrollbar{ width:5px; }
.pagina::-webkit-scrollbar-thumb{ background:rgba(201,168,76,.4); border-radius:4px; }
.pagina::-webkit-scrollbar-track{ background:transparent; }

/* Pagina-titel (bv. "Landen" bovenaan de linkerpagina) */
.pagina-titel{
  font-size:clamp(1.05rem,2.6vw,1.4rem); font-weight:800;
  color:#5a4420; text-align:center; margin:0 0 10px;
  padding-bottom:5px;
  border-bottom:1.5px solid rgba(201,168,76,.4);
  text-shadow:0 1px 0 rgba(244,232,193,.5);
}

/* ── Subsectie (per level/categorie) ────────────────── */
.subsectie{
  background:rgba(244,232,193,.55);
  border:1.5px solid rgba(201,168,76,.5);
  border-radius:10px;
  margin-bottom:10px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.subsectie-kop{
  background:linear-gradient(90deg,rgba(201,168,76,.7),rgba(168,132,26,.5));
  padding:6px 10px; cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
}
.subsectie-kop h3{
  font-size:clamp(.92rem,2.1vw,1.15rem); font-weight:700;
  color:#3a2c14; margin:0;
}
.subsectie-kop .pijl{
  font-size:.95rem; color:#3a2c14; transition:transform .25s;
}
.subsectie.dicht .subsectie-kop .pijl{ transform:rotate(-90deg); }
.subsectie.dicht .subsectie-inhoud{ display:none; }

.subsectie-inhoud{ padding:6px 7px 7px; }

/* ── Kolom-layout (All-time / Vandaag) ──────────────── */
.kolommen{
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
@media(max-width:700px){
  .kolommen{ grid-template-columns:1fr; }
}
.kolom-titel{
  font-size:.85rem; font-weight:700; color:#6b5a2e;
  text-align:center; padding:3px 0 2px;
  border-bottom:1px solid rgba(201,168,76,.4); margin-bottom:4px;
}

/* ── Scoretabel ─────────────────────────────────────── */
.score-tabel{
  width:100%; border-collapse:collapse; table-layout:fixed;
  font-size:clamp(.8rem,1.7vw,.98rem);
}
.score-tabel th{
  font-weight:700; color:#6b5a2e; text-align:left;
  padding:2px 4px; border-bottom:1px solid #d4c8a0;
  font-size:clamp(.72rem,1.5vw,.85rem);
}
/* Vaste kolombreedtes, gelijk in élke tabel op de pagina - zo staan
   #, Naam, Afstand en Tijd altijd recht onder elkaar, ongeacht hoe lang
   een naam toevallig is. */
.score-tabel th:nth-child(1), .score-tabel td:nth-child(1){ width:13%; text-align:center; }
.score-tabel th:nth-child(2), .score-tabel td:nth-child(2){ width:38%; }
.score-tabel th:nth-child(3), .score-tabel td:nth-child(3){ width:26%; }
.score-tabel th:nth-child(4), .score-tabel td:nth-child(4){ width:23%; }
.score-tabel td{
  padding:2px 4px; border-bottom:1px solid rgba(201,168,76,.2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.score-tabel td:first-child{
  text-align:center; font-weight:700; color:#a8841a;
}
.score-tabel tr:nth-child(even) td{ background:rgba(201,168,76,.06); }

/* Top 3 accenten */
.score-tabel tr.top1 td:first-child{ color:#c9a84c; font-size:.85em; }
.score-tabel tr.top2 td:first-child{ color:#8a8a8a; }
.score-tabel tr.top3 td:first-child{ color:#a0522d; }

/* Naam van de speler die nu actief is (zelfde naam als op het naamscherm) */
.eigen-naam-cel{ font-weight:800; }

/* Scrollbaar deel na top 10 */
.scroll-wrap{
  max-height:0; overflow:hidden;
  transition:max-height .35s ease;
}
.scroll-wrap.open{ max-height:600px; overflow-y:auto; }

.meer-knop{
  display:block; width:100%; text-align:center;
  font-family:'Baloo 2',cursive,sans-serif;
  font-size:.8rem; font-weight:600;
  color:#6b5a2e; background:rgba(201,168,76,.15);
  border:1px solid rgba(201,168,76,.4); border-radius:5px;
  padding:3px 0; margin-top:4px; cursor:pointer;
  transition:background .2s;
}
.meer-knop:hover{ background:rgba(201,168,76,.3); }

.leeg-tekst{
  text-align:center; color:#9a8a60; font-size:.85rem;
  padding:6px 0; font-style:italic;
}

/* ── Medaille-icoontjes bij top 3 ───────────────────── */
.medaille{ font-size:.8em; }

/* ── Geen-scores-bericht per hele sectie ─────────────── */
.sectie-leeg{
  text-align:center; color:#8a7a50; font-size:.95rem;
  padding:20px 8px; opacity:.7; font-style:italic;
}

/* ── Mobiel: kolommen worden 1 kolom, tabbladen naar onderen ────────── */
@media(max-width:600px){
  .boek-paginas{
    grid-template-columns:1fr;
    gap:0;
    padding:clamp(190px,46vw,215px) 16px 76px;
    overflow-y:auto;
  }
  .terug-knop{ width:clamp(90px, 24vw, 130px); }
  .tabblad-strip{
    flex-direction:row; flex-wrap:wrap;
    max-width:58vw; gap:6px;
    margin-top:12px;
  }
  .nav-btn{ width:clamp(44px, 13vw, 60px); }
}
</style>
</head>
<body>

<!-- Linkernavigatie: terug-knop, daaronder (met open ruimte) de 5
     tabblad-iconen van Arjen, verticaal onder elkaar. -->
<div id="linker-navigatie">
  <!-- Terug naar start -->
  <button class="terug-knop" onclick="ganNaarStart()" title="Terug naar start">
    <img src="images/terug-naar-start-knop.png" alt="Terug naar start"
         onerror="this.parentElement.textContent='⬅ Terug'"/>
  </button>

  <!-- Navigatie: tabblad-iconen -->
  <nav class="tabblad-strip" id="nav-knoppen">
    <button class="nav-btn actief" data-sectie="landen"><img src="images/landen-icoon.png" alt="Landen"/></button>
    <button class="nav-btn" data-sectie="hoofdsteden"><img src="images/hoofdsteden-icoon.png" alt="Hoofdsteden"/></button>
    <button class="nav-btn" data-sectie="plekken"><img src="images/iconische-plekken-icoon.png" alt="Iconische plekken"/></button>
    <button class="nav-btn" data-sectie="raadspel"><img src="images/raad-je-plaatje-icoon.png" alt="Raad je plaatje"/></button>
    <button class="nav-btn" data-sectie="landjeschuif"><img src="images/landje-schuif-icoon.png" alt="Landje Schuif"/></button>
  </nav>
</div>

<!-- Twee boekpagina's -->
<div class="boek-paginas">
  <div class="pagina" id="pagina-links"></div>
  <div class="pagina" id="pagina-rechts"></div>
</div>

<script>
  window.wvwFirebaseGereed = new Promise(resolve=>{ window._wvwFirebaseResolve = resolve; });
</script>
<script>
/* ╔═══════════════════════════════════════════════════════╗
   ║  Boek der Groten — high-score-overzicht                ║
   ║  Leest de online scores uit Firestore (Cloud Firestore) ║
   ╚═══════════════════════════════════════════════════════╝ */

// ── Testfilter ────────────────────────────────────────
var TEST_NAMEN = ['test1','test2'];
function isTestNaam(n){ return TEST_NAMEN.includes((n||'').toLowerCase().trim()); }

// Zelfde waarde als AANTAL_VRAGEN_MAX in raadspel.html - gebruikt als
// terugvalwaarde bij "Raad je plaatje"-scores die nog geen totaal-veld
// hebben (zie de toelichting verderop bij het tonen van de score).
var AANTAL_VRAGEN_MAX_FALLBACK = 10;

// ── Actieve speler (zelfde naam-sleutel als index.html/raadspel.html) ──
// Zo kunnen we de naam van de speler die nu op dit apparaat actief is,
// vetgedrukt tonen als die in een scorelijst voorkomt.
var SPELERNAAM_SLEUTEL = 'wonkywings_spelernaam';
function actieveSpelerNaamLC(){
  return (localStorage.getItem(SPELERNAAM_SLEUTEL) || '').trim().toLowerCase();
}

// Zelfde sessionStorage-sleutel als index.html/raadspel.html/paspoort.html
// gebruiken: laat aan index.html weten dat we via een menu-knop terugkomen,
// zodat het verplichte naamscherm daar wordt overgeslagen - de naam is al
// bekend en actief gebruikt. Zonder dit vlaggetje dacht index.html steeds
// dat er een gloednieuwe speler binnenkwam.
var VAN_MENU_NAVIGATIE_SLEUTEL = 'wonkywings_van_menu_navigatie';
function ganNaarStart(){
  sessionStorage.setItem(VAN_MENU_NAVIGATIE_SLEUTEL, '1');
  window.location.href = 'index.html';
}

// ── Helpers ───────────────────────────────────────────
function isVandaag(d){
  if(!d) return false;
  var nu = new Date(), dat = new Date(d);
  return nu.getFullYear()===dat.getFullYear() &&
         nu.getMonth()===dat.getMonth() &&
         nu.getDate()===dat.getDate();
}

function formatTijd(sec){
  if(sec==null) return '-';
  var m=Math.floor(sec/60), s=Math.round(sec%60);
  return m>0 ? m+'m '+s+'s' : s+'s';
}
function formatTijdMs(ms){
  if(ms==null) return '-';
  var sec=Math.round(ms/1000);
  var m=Math.floor(sec/60), s=sec%60;
  return m>0 ? m+'m '+s+'s' : s+'s';
}

// ── Level- en categorie-definities ────────────────────

// Landen (index.html → collectie scores_landen)
var LANDEN_SECTIES = [
  { groep:'Europa', levels:[
    { id:'eu-alles',       naam:'Heel Europa' },
    { id:'eu-west',        naam:'West-Europa' },
    { id:'eu-noord',       naam:'Noord-Europa' },
    { id:'eu-oost',        naam:'Oost-Europa & Balkan' },
    { id:'eu-kleinmaarfijn', naam:'Klein maar fijn' },
  ]},
  { groep:'Wereld', levels:[
    { id:'w-alles',        naam:'Alle landen van de wereld' },
    { id:'w-amerika',      naam:'Noord-Amerika' },
    { id:'w-zuid-amerika', naam:'Zuid-Amerika' },
    { id:'w-afrika',       naam:'Afrika' },
    { id:'w-azie',         naam:'Azië' },
    { id:'w-kleinmaarfijn', naam:'Klein maar fijn (Wereld)' },
  ]},
];

// Hoofdsteden (index.html → collectie scores_hoofdsteden)
var HOOFD_SECTIES = [
  { groep:'Hoofdsteden', levels:[
    { id:'hs-europa',       naam:'Europa' },
    { id:'hs-west-europa',  naam:'West-Europa' },
    { id:'hs-amerika',      naam:'Noord-Amerika' },
    { id:'hs-zuid-amerika', naam:'Zuid-Amerika' },
    { id:'hs-afrika',       naam:'Afrika' },
    { id:'hs-azie',         naam:'Azië' },
  ]},
];

// Iconische plekken (index.html → collectie scores_plekken)
var PLEK_SECTIES = [
  { groep:'Iconische plekken', levels:[
    { id:'pl-wereld', naam:'Alle plekken' },
  ]},
];

// Raad je plaatje (raadspel.html → collectie scores_raadspel)
var RAAD_SECTIES = [
  { groep:'Europa', cats:[
    { id:'eu-noord', naam:'Noord-Europa' },
    { id:'eu-zuid',  naam:'Zuid-Europa' },
    { id:'eu-alles', naam:'Heel Europa' },
  ]},
  { groep:'Wereld', cats:[
    { id:'w-makkelijk',    naam:'Makkelijke landen' },
    { id:'w-amerika',      naam:'Amerika' },
    { id:'w-zuid-amerika', naam:'Zuid-Amerika' },
    { id:'w-azie',         naam:'Azië & Oceanië' },
    { id:'w-afrika',       naam:'Afrika' },
    { id:'w-alles',        naam:'Alle landen' },
    { id:'w-kleinmaarfijn', naam:'Klein maar fijn' },
  ]},
  { groep:'Iconische plekken', cats:[
    { id:'iconische-plekken', naam:'Iconische plekken' },
  ]},
];

// Landje Schuif (raadspel.html → collectie scores_landjeschuif, één
// gezamenlijke lijst - geen categorieën, want elk potje is altijd
// hetzelfde: 9 van de 9 goed, alleen de tijd verschilt).
var LANDJESCHUIF_SECTIES = [
  { groep:'Landje Schuif', levels:[
    { id:'landjeschuif', naam:'Snelste tijden' },
  ]},
];

// ── Online scorebord (Firestore) — ophalen ────────────
// fsTopN(): haalt de beste 'aantal' runs op uit één collectie, gefilterd op
// één gelijkheidsveld (het level/de categorie) en gesorteerd volgens
// 'vergelijker'. Zelfde opzet als in index.html/raadspel.html; hier wordt
// nooit een "nieuweRun" meegegeven, want dit scherm speelt zelf niets.
async function fsTopN(collectieNaam, gelijkVeld, gelijkWaarde, orderVelden, vergelijker, aantal){
  var lijst = [];
  try{
    var fb = await window.wvwFirebaseGereed;
    var orderClauses = orderVelden.map(function(o){ return fb.orderBy(o[0], o[1]); });
    var q = fb.query.apply(null, [fb.collection(fb.db, collectieNaam),
      fb.where(gelijkVeld, '==', gelijkWaarde)].concat(orderClauses, [fb.limit(aantal)]));
    var snap = await fb.getDocs(q);
    snap.forEach(function(doc){ lijst.push(doc.data()); });
  }catch(e){
    console.warn('Kon scores niet online ophalen ('+collectieNaam+'):', e);
  }
  lijst.sort(vergelijker);
  return lijst;
}
function landenScores(id){
  return fsTopN('scores_landen', 'levelId', id, [['km','asc'],['tijd','asc']],
    function(a,b){ return (a.km-b.km) || (a.tijd-b.tijd); }, 100);
}
function hoofdstedenScores(id){
  return fsTopN('scores_hoofdsteden', 'levelId', id, [['goed','desc'],['tijd','asc']],
    function(a,b){ return (b.goed-a.goed) || (a.tijd-b.tijd); }, 100);
}
function plekkenScores(id){
  return fsTopN('scores_plekken', 'levelId', id, [['punten','desc'],['tijd','asc']],
    function(a,b){ return (b.punten-a.punten) || (a.tijd-b.tijd); }, 100);
}
function raadScores(id){
  return fsTopN('scores_raadspel', 'catId', id, [['goed','desc'],['tijdMs','asc']],
    function(a,b){ return (b.goed-a.goed) || (a.tijdMs-b.tijdMs); }, 100);
}
// Landje Schuif heeft maar 1 lijst voor alle scores samen (geen 'id'-
// achtervoegsel per categorie), dus geen where()-filter nodig.
async function landjeschuifScores(){
  var lijst = [];
  try{
    var fb = await window.wvwFirebaseGereed;
    var q = fb.query(fb.collection(fb.db, 'scores_landjeschuif'), fb.orderBy('tijdMs','asc'), fb.limit(100));
    var snap = await fb.getDocs(q);
    snap.forEach(function(doc){ lijst.push(doc.data()); });
  }catch(e){
    console.warn('Kon Landje Schuif-scores niet online ophalen:', e);
  }
  return lijst;
}

// ── Filteren & sorteren ───────────────────────────────
function filterScores(lijst){
  return lijst.filter(function(r){ return !isTestNaam(r.naam); });
}

// ── HTML-bouwers ──────────────────────────────────────

/** Bouw een scoretabel (max 50 rijen, eerste 10 direct zichtbaar) */
function bouwScoreTabel(lijst, type, kolomTitel){
  var gefilterd = filterScores(lijst);
  var container = document.createElement('div');

  var kop = document.createElement('div');
  kop.className = 'kolom-titel';
  kop.textContent = kolomTitel;
  container.appendChild(kop);

  if(gefilterd.length === 0){
    var leeg = document.createElement('div');
    leeg.className = 'leeg-tekst';
    leeg.textContent = 'Nog geen scores';
    container.appendChild(leeg);
    return container;
  }

  var top10 = gefilterd.slice(0,10);
  var rest  = gefilterd.slice(10,50);

  container.appendChild(maakTabel(top10, 0, type));

  if(rest.length > 0){
    var uid = 'sw_'+Math.random().toString(36).slice(2,8);
    var wrap = document.createElement('div');
    wrap.className = 'scroll-wrap';
    wrap.id = uid;
    wrap.appendChild(maakTabel(rest, 10, type));
    container.appendChild(wrap);

    var knop = document.createElement('button');
    knop.className = 'meer-knop';
    knop.textContent = '▾ Toon meer ('+rest.length+')';
    knop.onclick = (function(wrapId, restLen, btn){
      return function(){
        var w = document.getElementById(wrapId);
        if(w.classList.contains('open')){
          w.classList.remove('open');
          btn.textContent = '▾ Toon meer ('+restLen+')';
        } else {
          w.classList.add('open');
          btn.textContent = '▴ Inklappen';
        }
      };
    })(uid, rest.length, knop);
    container.appendChild(knop);
  }

  return container;
}

function maakTabel(rijen, startIndex, type){
  var tabel = document.createElement('table');
  tabel.className = 'score-tabel';

  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  var thNr = document.createElement('th'); thNr.textContent = '#';
  var thNaam = document.createElement('th'); thNaam.textContent = 'Naam';
  var thScore = document.createElement('th');
  thScore.textContent = type==='raad' ? 'Goed'
    : type==='landjeschuif' ? 'Score'
    : type==='hoofdsteden' ? 'Goed'
    : type==='plekken' ? 'Punten'
    : 'Afstand';
  var thTijd = document.createElement('th'); thTijd.textContent = 'Tijd';
  hr.appendChild(thNr); hr.appendChild(thNaam);
  hr.appendChild(thScore); hr.appendChild(thTijd);
  thead.appendChild(hr);
  tabel.appendChild(thead);

  var actieveNaam = actieveSpelerNaamLC();

  var tbody = document.createElement('tbody');
  for(var i=0; i<rijen.length; i++){
    var run = rijen[i];
    var pos = startIndex + i + 1;
    var tr = document.createElement('tr');
    if(pos===1) tr.className='top1';
    else if(pos===2) tr.className='top2';
    else if(pos===3) tr.className='top3';

    var tdPos = document.createElement('td');
    if(pos===1) tdPos.innerHTML='<span class="medaille">🥇</span>';
    else if(pos===2) tdPos.innerHTML='<span class="medaille">🥈</span>';
    else if(pos===3) tdPos.innerHTML='<span class="medaille">🥉</span>';
    else tdPos.textContent = pos;

    var tdNaam = document.createElement('td');
    tdNaam.textContent = run.naam || '?';
    tdNaam.title = run.naam || '?';
    if(actieveNaam && (run.naam||'').trim().toLowerCase() === actieveNaam){
      tdNaam.classList.add('eigen-naam-cel');
    }

    var tdScore = document.createElement('td');
    if(type==='raad'){
      // Oudere scores (van vóór raadspel.html het totaal zelf opsloeg)
      // kennen run.totaal niet - elke categorie telt inmiddels minstens
      // AANTAL_VRAGEN_MAX vragen per ronde, dus die waarde klopt ook voor
      // die oudere scores. Zelfde getal als AANTAL_VRAGEN_MAX in raadspel.html.
      var totaal = run.totaal || AANTAL_VRAGEN_MAX_FALLBACK;
      tdScore.textContent = run.goed + '/' + totaal;
    } else if(type==='landjeschuif'){
      // Elk opgeslagen potje Landje Schuif is per definitie 9 van de 9 goed
      // (zie lsOpslaanScore() in raadspel.html - die wordt alleen bij een
      // voltooid potje aangeroepen), dus dit staat vast.
      tdScore.textContent = '9/9';
    } else if(type==='hoofdsteden'){
      tdScore.textContent = run.goed + '/' + run.totaal;
    } else if(type==='plekken'){
      tdScore.textContent = run.punten;
    } else {
      tdScore.textContent = (run.km != null ? run.km + ' km' : '-');
    }

    var tdTijd = document.createElement('td');
    if(type==='raad' || type==='landjeschuif'){
      tdTijd.textContent = formatTijdMs(run.tijdMs);
    } else {
      tdTijd.textContent = formatTijd(run.tijd);
    }

    tr.appendChild(tdPos); tr.appendChild(tdNaam);
    tr.appendChild(tdScore); tr.appendChild(tdTijd);
    tbody.appendChild(tr);
  }
  tabel.appendChild(tbody);
  return tabel;
}

/** Bouw een subsectie-kaart met All-time en Vandaag kolommen.
 * altijdTonen: als true, wordt de kaart ook zonder scores getoond (de twee
 * kolommen laten dan gewoon elk hun eigen "Nog geen scores" zien - zie
 * bouwScoreTabel), in plaats van de kaart helemaal weg te laten.
 * Haalt de scores online op (Firestore), dus deze functie is async. */
async function bouwSubsectie(naam, sleutel, type, altijdTonen){
  var lijst;
  if(type==='raad') lijst = await raadScores(sleutel);
  else if(type==='landjeschuif') lijst = await landjeschuifScores();
  else if(type==='hoofdsteden') lijst = await hoofdstedenScores(sleutel);
  else if(type==='plekken') lijst = await plekkenScores(sleutel);
  else lijst = await landenScores(sleutel);
  var gefilterd = filterScores(lijst);

  if(gefilterd.length === 0 && !altijdTonen) return null;

  var alltime = gefilterd.slice(0,50);
  var vandaag = gefilterd.filter(function(r){ return isVandaag(r.datum); }).slice(0,50);

  var wrap = document.createElement('div');
  wrap.className = 'subsectie';

  var kop = document.createElement('div');
  kop.className = 'subsectie-kop';
  kop.innerHTML = '<h3>'+naam+'</h3><span class="pijl">▼</span>';
  kop.onclick = function(){ wrap.classList.toggle('dicht'); };
  wrap.appendChild(kop);

  var inhoud = document.createElement('div');
  inhoud.className = 'subsectie-inhoud';

  var kolommen = document.createElement('div');
  kolommen.className = 'kolommen';

  kolommen.appendChild(bouwScoreTabel(alltime, type, '🏆 All-time'));
  kolommen.appendChild(bouwScoreTabel(vandaag, type, '📅 Vandaag'));

  inhoud.appendChild(kolommen);
  wrap.appendChild(inhoud);
  return wrap;
}

// ── Sectie-definities (per tab) ───────────────────────
// 'landen' krijgt een vaste indeling: de Europa-groep staat altijd op de
// linkerpagina, de Wereld-groep altijd op de rechterpagina (in plaats van
// automatisch fifty-fifty verdeeld), en elke categorie is altijd zichtbaar,
// ook zonder scores. De andere tabbladen blijven het oude, dynamische
// gedrag houden (leeg = overgeslagen, verdeeld op basis van aantal).
var SECTIES = {
  landen:       { label:'Landen',            data:LANDEN_SECTIES,       type:'landen',
                  splitPerGroep:true, toonLegeCategorieen:true,
                  titelLinks:'Europa Masters', titelRechts:'Wereld Masters' },
  hoofdsteden:  { label:'Hoofdsteden',       data:HOOFD_SECTIES,        type:'hoofdsteden' },
  plekken:      { label:'Iconische plekken', data:PLEK_SECTIES,         type:'plekken' },
  raadspel:     { label:'Raad je landje',    data:RAAD_SECTIES,         type:'raad' },
  landjeschuif: { label:'Schuif je landje',  data:LANDJESCHUIF_SECTIES, type:'landjeschuif' },
};

/** Bouw alle subsecties voor een sectie, retourneer als array van DOM-nodes.
 * Alle collecties worden gelijktijdig (Promise.all) opgehaald, niet na
 * elkaar - anders zou een tabblad met veel categorieën traag aanvoelen. */
async function bouwSubsecties(sectieId){
  var def = SECTIES[sectieId];
  if(!def) return [];
  var taken = [];
  for(var g=0; g<def.data.length; g++){
    var groep = def.data[g];
    var items = groep.levels || groep.cats;
    for(var j=0; j<items.length; j++){
      taken.push(bouwSubsectie(items[j].naam, items[j].id, def.type, def.toonLegeCategorieen));
    }
  }
  var resultaten = await Promise.all(taken);
  return resultaten.filter(function(n){ return n!==null; });
}

/** Zelfde als bouwSubsecties(), maar per groep apart - voor secties met
 * splitPerGroep, waar groep 0 altijd links en groep 1 altijd rechts hoort. */
async function bouwSubsectiesPerGroep(sectieId){
  var def = SECTIES[sectieId];
  var uitkomst = { links:[], rechts:[] };
  if(!def) return uitkomst;
  var takenLinks = [], takenRechts = [];
  for(var g=0; g<def.data.length; g++){
    var groep = def.data[g];
    var items = groep.levels || groep.cats;
    var takenDoel = (g===0) ? takenLinks : takenRechts;
    for(var j=0; j<items.length; j++){
      takenDoel.push(bouwSubsectie(items[j].naam, items[j].id, def.type, def.toonLegeCategorieen));
    }
  }
  var linksResultaten = await Promise.all(takenLinks);
  var rechtsResultaten = await Promise.all(takenRechts);
  uitkomst.links = linksResultaten.filter(function(n){ return n!==null; });
  uitkomst.rechts = rechtsResultaten.filter(function(n){ return n!==null; });
  return uitkomst;
}

// ── Pagina opbouwen ───────────────────────────────────
var huidigeSectie = 'landen';
// Aanvraag-ID: als iemand snel tussen tabbladen klikt terwijl de vorige
// nog aan het laden was, mag dat trage antwoord het inmiddels alweer
// nieuwer geopende tabblad niet meer overschrijven.
var paginaAanvraagId = 0;

async function bouwPagina(){
  var links = document.getElementById('pagina-links');
  var rechts = document.getElementById('pagina-rechts');
  var aanvraagId = ++paginaAanvraagId;
  links.innerHTML = '<div class="sectie-leeg">Scores laden…</div>';
  rechts.innerHTML = '';

  var def = SECTIES[huidigeSectie];

  // Vaste indeling (nu alleen 'landen'): groep 0 altijd links, groep 1
  // altijd rechts, in de volgorde uit LANDEN_SECTIES, elke categorie
  // altijd zichtbaar - geen automatische fifty-fifty verdeling.
  if(def.splitPerGroep){
    var perGroep = await bouwSubsectiesPerGroep(huidigeSectie);
    if(aanvraagId !== paginaAanvraagId) return; // ondertussen een ander tabblad geopend
    links.innerHTML = '';
    rechts.innerHTML = '';

    var titelL = document.createElement('div');
    titelL.className = 'pagina-titel';
    titelL.textContent = def.titelLinks;
    links.appendChild(titelL);
    for(var li=0; li<perGroep.links.length; li++) links.appendChild(perGroep.links[li]);

    var titelR = document.createElement('div');
    titelR.className = 'pagina-titel';
    titelR.textContent = def.titelRechts;
    rechts.appendChild(titelR);
    for(var ri=0; ri<perGroep.rechts.length; ri++) rechts.appendChild(perGroep.rechts[ri]);

    return;
  }

  var subsecties = await bouwSubsecties(huidigeSectie);
  if(aanvraagId !== paginaAanvraagId) return;
  links.innerHTML = '';
  rechts.innerHTML = '';

  if(subsecties.length === 0){
    // Lege-sectie-melding op de linkerpagina
    var leeg = document.createElement('div');
    leeg.className = 'sectie-leeg';
    leeg.textContent = 'Nog geen scores voor ' + def.label + '.';
    // Titel linkerpagina
    var titelL2 = document.createElement('div');
    titelL2.className = 'pagina-titel';
    titelL2.textContent = def.label;
    links.appendChild(titelL2);
    links.appendChild(leeg);
    return;
  }

  // Verdeel subsecties over linkerpagina en rechterpagina
  var helft = Math.ceil(subsecties.length / 2);

  // Linker pagina
  var titelLinks = document.createElement('div');
  titelLinks.className = 'pagina-titel';
  titelLinks.textContent = def.label;
  links.appendChild(titelLinks);

  for(var i=0; i<helft; i++){
    links.appendChild(subsecties[i]);
  }

  // Rechter pagina
  var titelRechts = document.createElement('div');
  titelRechts.className = 'pagina-titel';
  titelRechts.textContent = def.label + ' (vervolg)';
  rechts.appendChild(titelRechts);

  for(var j=helft; j<subsecties.length; j++){
    rechts.appendChild(subsecties[j]);
  }

  // Als er maar 1 subsectie is, staat alles links — rechts leeglaten
  if(subsecties.length <= 1){
    rechts.innerHTML = '';
  }
}

// ── Tab-navigatie ─────────────────────────────────────
function wisselSectie(naam){
  huidigeSectie = naam;
  document.querySelectorAll('.nav-btn').forEach(function(k){
    k.classList.toggle('actief', k.dataset.sectie === naam);
  });
  bouwPagina();
}

document.getElementById('nav-knoppen').addEventListener('click', function(e){
  var knop = e.target.closest('.nav-btn');
  if(!knop) return;
  wisselSectie(knop.dataset.sectie);
});

// ── Start ─────────────────────────────────────────────
bouwPagina();
</script>
