<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Boek der Groten — Oh Mooie Wereld!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & basis ──────────────────────────────────── */
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:100%; height:100%; overflow:hidden;
  font-family:'Baloo 2',cursive,sans-serif; color:#3a2c14; }

body{
  background:#1a2744;
  background-image:url('images/boek-achtergrond.png');
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

/* ── Terug-knop (zelfde grootte als in het spel) ───── */
.terug-knop{
  position:fixed; left:14px; top:14px; z-index:100;
  width:clamp(130px, 13vw, 210px);
  cursor:pointer; border:none; background:none; padding:0;
  opacity:0.92; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  transition:opacity .15s, transform .15s;
}
.terug-knop img{ width:100%; display:block; }
.terug-knop:hover{ opacity:1; transform:scale(1.03); }

/* ── Tabbladenstrip (menu): rijtje "register"-tabjes bovenaan het boek,
   gecentreerd tussen de twee bladzijdes. Staat in de rand boven het boek,
   dus nooit meer over de kaartjes heen - los van hoeveel scores er staan. */
.tabblad-strip{
  position:fixed; left:50%; top:clamp(8px, 1.6vw, 18px);
  transform:translateX(-50%);
  z-index:100; display:flex; gap:3px;
}
.nav-btn{
  font-family:'Baloo 2',cursive,sans-serif;
  font-size:clamp(.72rem, 1.3vw, .9rem); font-weight:700;
  padding:7px 16px 6px; border:1.5px solid rgba(90,68,32,.55); border-bottom:none;
  border-radius:8px 8px 0 0; cursor:pointer;
  background:linear-gradient(180deg,rgba(201,168,76,.55),rgba(168,132,26,.55));
  color:#4a3818; white-space:nowrap;
  box-shadow:0 -2px 6px rgba(0,0,0,.15);
  transition:background .2s, color .2s, transform .15s, box-shadow .2s;
}
.nav-btn:hover{
  background:linear-gradient(180deg,rgba(201,168,76,.75),rgba(168,132,26,.7));
  color:#2a1f0c;
}
.nav-btn.actief{
  background:linear-gradient(180deg,#f4e8c1,#c9a84c);
  color:#3a2c14; border-color:#8a6a24;
  transform:translateY(-3px);
  box-shadow:0 -4px 10px rgba(0,0,0,.3);
}

/* ── Twee-pagina layout (linker- en rechterbladzijde) ─ */
.boek-paginas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(40px, 8.6vw, 170px);      /* ruimte voor de boekrug */
  padding:clamp(64px,14vh,130px) clamp(60px,13.85vw,250px) clamp(56px,10vh,110px);
  width:100%; height:100%;
  overflow:hidden;
}

.pagina{
  overflow-y:auto; overflow-x:hidden;
  padding:8px clamp(6px,1.5vw,16px);
  /* Scrollbar styling */
  scrollbar-width:thin;
  scrollbar-color:rgba(201,168,76,.4) transparent;
}
.pagina::-webkit-scrollbar{ width:5px; }
.pagina::-webkit-scrollbar-thumb{ background:rgba(201,168,76,.4); border-radius:4px; }
.pagina::-webkit-scrollbar-track{ background:transparent; }

/* Pagina-titel (bv. "Landen" bovenaan de linkerpagina) */
.pagina-titel{
  font-size:clamp(1.05rem,2.6vw,1.4rem); font-weight:800;
  color:#5a4420; text-align:center; margin:0 0 10px;
  padding-bottom:5px;
  border-bottom:1.5px solid rgba(201,168,76,.4);
  text-shadow:0 1px 0 rgba(244,232,193,.5);
}

/* ── Subsectie (per level/categorie) ────────────────── */
.subsectie{
  background:rgba(244,232,193,.55);
  border:1.5px solid rgba(201,168,76,.5);
  border-radius:10px;
  margin-bottom:10px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.subsectie-kop{
  background:linear-gradient(90deg,rgba(201,168,76,.7),rgba(168,132,26,.5));
  padding:6px 10px; cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
}
.subsectie-kop h3{
  font-size:clamp(.92rem,2.1vw,1.15rem); font-weight:700;
  color:#3a2c14; margin:0;
}
.subsectie-kop .pijl{
  font-size:.95rem; color:#3a2c14; transition:transform .25s;
}
.subsectie.dicht .subsectie-kop .pijl{ transform:rotate(-90deg); }
.subsectie.dicht .subsectie-inhoud{ display:none; }

.subsectie-inhoud{ padding:6px 7px 7px; }

/* ── Kolom-layout (All-time / Vandaag) ──────────────── */
.kolommen{
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
@media(max-width:700px){
  .kolommen{ grid-template-columns:1fr; }
}
.kolom-titel{
  font-size:.85rem; font-weight:700; color:#6b5a2e;
  text-align:center; padding:3px 0 2px;
  border-bottom:1px solid rgba(201,168,76,.4); margin-bottom:4px;
}

/* ── Scoretabel ─────────────────────────────────────── */
.score-tabel{
  width:100%; border-collapse:collapse; table-layout:fixed;
  font-size:clamp(.8rem,1.7vw,.98rem);
}
.score-tabel th{
  font-weight:700; color:#6b5a2e; text-align:left;
  padding:2px 4px; border-bottom:1px solid #d4c8a0;
  font-size:clamp(.72rem,1.5vw,.85rem);
}
/* Vaste kolombreedtes, gelijk in élke tabel op de pagina - zo staan
   #, Naam, Afstand en Tijd altijd recht onder elkaar, ongeacht hoe lang
   een naam toevallig is. */
.score-tabel th:nth-child(1), .score-tabel td:nth-child(1){ width:13%; text-align:center; }
.score-tabel th:nth-child(2), .score-tabel td:nth-child(2){ width:38%; }
.score-tabel th:nth-child(3), .score-tabel td:nth-child(3){ width:26%; }
.score-tabel th:nth-child(4), .score-tabel td:nth-child(4){ width:23%; }
.score-tabel td{
  padding:2px 4px; border-bottom:1px solid rgba(201,168,76,.2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.score-tabel td:first-child{
  text-align:center; font-weight:700; color:#a8841a;
}
.score-tabel tr:nth-child(even) td{ background:rgba(201,168,76,.06); }

/* Top 3 accenten */
.score-tabel tr.top1 td:first-child{ color:#c9a84c; font-size:.85em; }
.score-tabel tr.top2 td:first-child{ color:#8a8a8a; }
.score-tabel tr.top3 td:first-child{ color:#a0522d; }

/* Naam van de speler die nu actief is (zelfde naam als op het naamscherm) */
.eigen-naam-cel{ font-weight:800; }

/* Scrollbaar deel na top 10 */
.scroll-wrap{
  max-height:0; overflow:hidden;
  transition:max-height .35s ease;
}
.scroll-wrap.open{ max-height:600px; overflow-y:auto; }

.meer-knop{
  display:block; width:100%; text-align:center;
  font-family:'Baloo 2',cursive,sans-serif;
  font-size:.8rem; font-weight:600;
  color:#6b5a2e; background:rgba(201,168,76,.15);
  border:1px solid rgba(201,168,76,.4); border-radius:5px;
  padding:3px 0; margin-top:4px; cursor:pointer;
  transition:background .2s;
}
.meer-knop:hover{ background:rgba(201,168,76,.3); }

.leeg-tekst{
  text-align:center; color:#9a8a60; font-size:.85rem;
  padding:6px 0; font-style:italic;
}

/* ── Medaille-icoontjes bij top 3 ───────────────────── */
.medaille{ font-size:.8em; }

/* ── Geen-scores-bericht per hele sectie ─────────────── */
.sectie-leeg{
  text-align:center; color:#8a7a50; font-size:.95rem;
  padding:20px 8px; opacity:.7; font-style:italic;
}

/* ── Mobiel: kolommen worden 1 kolom, tabbladen naar onderen ────────── */
@media(max-width:600px){
  .boek-paginas{
    grid-template-columns:1fr;
    gap:0;
    padding:clamp(50px,15vw,100px) 16px 76px;
    overflow-y:auto;
  }
  .tabblad-strip{
    left:50%; top:auto; bottom:10px; transform:translateX(-50%);
    flex-wrap:wrap; justify-content:center; max-width:94vw; gap:4px;
  }
  .nav-btn{
    font-size:.68rem; padding:5px 10px 4px;
    border-radius:7px; border-bottom:1.5px solid rgba(90,68,32,.55);
  }
  .nav-btn.actief{ transform:none; }
}
</style>
</head>
<body>

<!-- Terug naar start -->
<button class="terug-knop" onclick="window.location.href='index.html'" title="Terug naar start">
  <img src="images/terug-naar-start-knop.png" alt="Terug naar start"
       onerror="this.parentElement.textContent='⬅ Terug'"/>
</button>

<!-- Navigatie: tabbladen bovenaan het boek -->
<nav class="tabblad-strip" id="nav-knoppen">
  <button class="nav-btn actief" data-sectie="landen">Landen</button>
  <button class="nav-btn" data-sectie="hoofdsteden">Hoofdsteden</button>
  <button class="nav-btn" data-sectie="plekken">Iconische plekken</button>
  <button class="nav-btn" data-sectie="raadspel">Raad je plaatje</button>
</nav>

<!-- Twee boekpagina's -->
<div class="boek-paginas">
  <div class="pagina" id="pagina-links"></div>
  <div class="pagina" id="pagina-rechts"></div>
</div>

<script>
/* ╔═══════════════════════════════════════════════════════╗
   ║  Boek der Groten — high-score-overzicht               ║
   ║  Leest localStorage van index.html en raadspel.html   ║
   ╚═══════════════════════════════════════════════════════╝ */

// ── Testfilter ────────────────────────────────────────
var TEST_NAMEN = ['test1','test2'];
function isTestNaam(n){ return TEST_NAMEN.includes((n||'').toLowerCase().trim()); }

// ── Actieve speler (zelfde naam-sleutel als index.html/raadspel.html) ──
// Zo kunnen we de naam van de speler die nu op dit apparaat actief is,
// vetgedrukt tonen als die in een scorelijst voorkomt.
var SPELERNAAM_SLEUTEL = 'wonkywings_spelernaam';
function actieveSpelerNaamLC(){
  return (localStorage.getItem(SPELERNAAM_SLEUTEL) || '').trim().toLowerCase();
}

// ── Helpers ───────────────────────────────────────────
function isVandaag(d){
  if(!d) return false;
  var nu = new Date(), dat = new Date(d);
  return nu.getFullYear()===dat.getFullYear() &&
         nu.getMonth()===dat.getMonth() &&
         nu.getDate()===dat.getDate();
}

function formatTijd(sec){
  if(sec==null) return '-';
  var m=Math.floor(sec/60), s=Math.round(sec%60);
  return m>0 ? m+'m '+s+'s' : s+'s';
}
function formatTijdMs(ms){
  if(ms==null) return '-';
  var sec=Math.round(ms/1000);
  var m=Math.floor(sec/60), s=sec%60;
  return m>0 ? m+'m '+s+'s' : s+'s';
}

// ── Level- en categorie-definities ────────────────────

// Landen (index.html → wonkywings_scores_{id})
var LANDEN_SECTIES = [
  { groep:'Europa', levels:[
    { id:'eu-alles',       naam:'Heel Europa' },
    { id:'eu-west',        naam:'West-Europa' },
    { id:'eu-oost',        naam:'Oost-Europa & Balkan' },
    { id:'eu-noord',       naam:'Noord-Europa' },
    { id:'eu-kleinmaarfijn', naam:'Klein maar fijn' },
  ]},
  { groep:'Wereld', levels:[
    { id:'w-alles',        naam:'Alle landen' },
    { id:'w-amerika',      naam:'Noord-Amerika' },
    { id:'w-zuid-amerika', naam:'Zuid-Amerika' },
    { id:'w-afrika',       naam:'Afrika' },
    { id:'w-azie',         naam:'Azië' },
    { id:'w-kleinmaarfijn', naam:'Klein maar fijn (Wereld)' },
  ]},
];

// Hoofdsteden (index.html → wonkywings_scores_{id})
var HOOFD_SECTIES = [
  { groep:'Hoofdsteden', levels:[
    { id:'hs-europa',       naam:'Europa' },
    { id:'hs-west-europa',  naam:'West-Europa' },
    { id:'hs-amerika',      naam:'Noord-Amerika' },
    { id:'hs-zuid-amerika', naam:'Zuid-Amerika' },
    { id:'hs-afrika',       naam:'Afrika' },
    { id:'hs-azie',         naam:'Azië' },
  ]},
];

// Iconische plekken (index.html → wonkywings_scores_{id})
var PLEK_SECTIES = [
  { groep:'Iconische plekken', levels:[
    { id:'pl-wereld', naam:'Alle plekken' },
  ]},
];

// Raad je plaatje (raadspel.html → wonkywings_raadspel_scores_{id})
var RAAD_SECTIES = [
  { groep:'Europa', cats:[
    { id:'eu-noord', naam:'Noord-Europa' },
    { id:'eu-zuid',  naam:'Zuid-Europa' },
    { id:'eu-alles', naam:'Heel Europa' },
  ]},
  { groep:'Wereld', cats:[
    { id:'w-makkelijk',    naam:'Makkelijke landen' },
    { id:'w-amerika',      naam:'Amerika' },
    { id:'w-zuid-amerika', naam:'Zuid-Amerika' },
    { id:'w-azie',         naam:'Azië & Oceanië' },
    { id:'w-afrika',       naam:'Afrika' },
    { id:'w-alles',        naam:'Alle landen' },
    { id:'w-kleinmaarfijn', naam:'Klein maar fijn' },
  ]},
  { groep:'Iconische plekken', cats:[
    { id:'iconische-plekken', naam:'Iconische plekken' },
  ]},
];

// ── Scores laden ──────────────────────────────────────
function laadScores(sleutel){
  try{ return JSON.parse(localStorage.getItem(sleutel)||'[]'); }
  catch(e){ return []; }
}
function topoScores(id){ return laadScores('wonkywings_scores_'+id); }
function raadScores(id){ return laadScores('wonkywings_raadspel_scores_'+id); }

// ── Filteren & sorteren ───────────────────────────────
function filterScores(lijst){
  return lijst.filter(function(r){ return !isTestNaam(r.naam); });
}

// ── HTML-bouwers ──────────────────────────────────────

/** Bouw een scoretabel (max 50 rijen, eerste 10 direct zichtbaar) */
function bouwScoreTabel(lijst, type, kolomTitel){
  var gefilterd = filterScores(lijst);
  var container = document.createElement('div');

  var kop = document.createElement('div');
  kop.className = 'kolom-titel';
  kop.textContent = kolomTitel;
  container.appendChild(kop);

  if(gefilterd.length === 0){
    var leeg = document.createElement('div');
    leeg.className = 'leeg-tekst';
    leeg.textContent = 'Nog geen scores';
    container.appendChild(leeg);
    return container;
  }

  var top10 = gefilterd.slice(0,10);
  var rest  = gefilterd.slice(10,50);

  container.appendChild(maakTabel(top10, 0, type));

  if(rest.length > 0){
    var uid = 'sw_'+Math.random().toString(36).slice(2,8);
    var wrap = document.createElement('div');
    wrap.className = 'scroll-wrap';
    wrap.id = uid;
    wrap.appendChild(maakTabel(rest, 10, type));
    container.appendChild(wrap);

    var knop = document.createElement('button');
    knop.className = 'meer-knop';
    knop.textContent = '▾ Toon meer ('+rest.length+')';
    knop.onclick = (function(wrapId, restLen, btn){
      return function(){
        var w = document.getElementById(wrapId);
        if(w.classList.contains('open')){
          w.classList.remove('open');
          btn.textContent = '▾ Toon meer ('+restLen+')';
        } else {
          w.classList.add('open');
          btn.textContent = '▴ Inklappen';
        }
      };
    })(uid, rest.length, knop);
    container.appendChild(knop);
  }

  return container;
}

function maakTabel(rijen, startIndex, type){
  var tabel = document.createElement('table');
  tabel.className = 'score-tabel';

  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  var thNr = document.createElement('th'); thNr.textContent = '#';
  var thNaam = document.createElement('th'); thNaam.textContent = 'Naam';
  var thScore = document.createElement('th');
  thScore.textContent = type==='raad' ? 'Goed' : 'Afstand';
  var thTijd = document.createElement('th'); thTijd.textContent = 'Tijd';
  hr.appendChild(thNr); hr.appendChild(thNaam);
  hr.appendChild(thScore); hr.appendChild(thTijd);
  thead.appendChild(hr);
  tabel.appendChild(thead);

  var actieveNaam = actieveSpelerNaamLC();

  var tbody = document.createElement('tbody');
  for(var i=0; i<rijen.length; i++){
    var run = rijen[i];
    var pos = startIndex + i + 1;
    var tr = document.createElement('tr');
    if(pos===1) tr.className='top1';
    else if(pos===2) tr.className='top2';
    else if(pos===3) tr.className='top3';

    var tdPos = document.createElement('td');
    if(pos===1) tdPos.innerHTML='<span class="medaille">🥇</span>';
    else if(pos===2) tdPos.innerHTML='<span class="medaille">🥈</span>';
    else if(pos===3) tdPos.innerHTML='<span class="medaille">🥉</span>';
    else tdPos.textContent = pos;

    var tdNaam = document.createElement('td');
    tdNaam.textContent = run.naam || '?';
    tdNaam.title = run.naam || '?';
    if(actieveNaam && (run.naam||'').trim().toLowerCase() === actieveNaam){
      tdNaam.classList.add('eigen-naam-cel');
    }

    var tdScore = document.createElement('td');
    if(type==='raad'){
      var totaal = run.totaal || '?';
      tdScore.textContent = run.goed + '/' + totaal;
    } else {
      tdScore.textContent = (run.km != null ? run.km + ' km' : '-');
    }

    var tdTijd = document.createElement('td');
    if(type==='raad'){
      tdTijd.textContent = formatTijdMs(run.tijdMs);
    } else {
      tdTijd.textContent = formatTijd(run.tijd);
    }

    tr.appendChild(tdPos); tr.appendChild(tdNaam);
    tr.appendChild(tdScore); tr.appendChild(tdTijd);
    tbody.appendChild(tr);
  }
  tabel.appendChild(tbody);
  return tabel;
}

/** Bouw een subsectie-kaart met All-time en Vandaag kolommen */
function bouwSubsectie(naam, sleutel, type){
  var lijst = (type==='raad') ? raadScores(sleutel) : topoScores(sleutel);
  var gefilterd = filterScores(lijst);

  if(gefilterd.length === 0) return null;

  var alltime = gefilterd.slice(0,50);
  var vandaag = gefilterd.filter(function(r){ return isVandaag(r.datum); }).slice(0,50);

  var wrap = document.createElement('div');
  wrap.className = 'subsectie';

  var kop = document.createElement('div');
  kop.className = 'subsectie-kop';
  kop.innerHTML = '<h3>'+naam+'</h3><span class="pijl">▼</span>';
  kop.onclick = function(){ wrap.classList.toggle('dicht'); };
  wrap.appendChild(kop);

  var inhoud = document.createElement('div');
  inhoud.className = 'subsectie-inhoud';

  var kolommen = document.createElement('div');
  kolommen.className = 'kolommen';

  kolommen.appendChild(bouwScoreTabel(alltime, type, '🏆 All-time'));
  kolommen.appendChild(bouwScoreTabel(vandaag, type, '📅 Vandaag'));

  inhoud.appendChild(kolommen);
  wrap.appendChild(inhoud);
  return wrap;
}

// ── Sectie-definities (per tab) ───────────────────────
var SECTIES = {
  landen:      { label:'Landen',            data:LANDEN_SECTIES, type:'topo' },
  hoofdsteden: { label:'Hoofdsteden',       data:HOOFD_SECTIES,  type:'topo' },
  plekken:     { label:'Iconische plekken', data:PLEK_SECTIES,   type:'topo' },
  raadspel:    { label:'Raad je plaatje',   data:RAAD_SECTIES,   type:'raad' },
};

/** Bouw alle subsecties voor een sectie, retourneer als array van DOM-nodes */
function bouwSubsecties(sectieId){
  var def = SECTIES[sectieId];
  if(!def) return [];
  var nodes = [];
  for(var g=0; g<def.data.length; g++){
    var groep = def.data[g];
    var items = groep.levels || groep.cats;
    for(var j=0; j<items.length; j++){
      var sub = bouwSubsectie(items[j].naam, items[j].id, def.type);
      if(sub) nodes.push(sub);
    }
  }
  return nodes;
}

// ── Pagina opbouwen ───────────────────────────────────
var huidigeSectie = 'landen';

function bouwPagina(){
  var links = document.getElementById('pagina-links');
  var rechts = document.getElementById('pagina-rechts');
  links.innerHTML = '';
  rechts.innerHTML = '';

  var def = SECTIES[huidigeSectie];
  var subsecties = bouwSubsecties(huidigeSectie);

  if(subsecties.length === 0){
    // Lege-sectie-melding op de linkerpagina
    var leeg = document.createElement('div');
    leeg.className = 'sectie-leeg';
    leeg.textContent = 'Nog geen scores voor ' + def.label + '.';
    // Titel linkerpagina
    var titelL = document.createElement('div');
    titelL.className = 'pagina-titel';
    titelL.textContent = def.label;
    links.appendChild(titelL);
    links.appendChild(leeg);
    return;
  }

  // Verdeel subsecties over linkerpagina en rechterpagina
  var helft = Math.ceil(subsecties.length / 2);

  // Linker pagina
  var titelLinks = document.createElement('div');
  titelLinks.className = 'pagina-titel';
  titelLinks.textContent = def.label;
  links.appendChild(titelLinks);

  for(var i=0; i<helft; i++){
    links.appendChild(subsecties[i]);
  }

  // Rechter pagina
  var titelRechts = document.createElement('div');
  titelRechts.className = 'pagina-titel';
  titelRechts.textContent = def.label + ' (vervolg)';
  rechts.appendChild(titelRechts);

  for(var j=helft; j<subsecties.length; j++){
    rechts.appendChild(subsecties[j]);
  }

  // Als er maar 1 subsectie is, staat alles links — rechts leeglaten
  if(subsecties.length <= 1){
    rechts.innerHTML = '';
  }
}

// ── Tab-navigatie ─────────────────────────────────────
function wisselSectie(naam){
  huidigeSectie = naam;
  document.querySelectorAll('.nav-btn').forEach(function(k){
    k.classList.toggle('actief', k.dataset.sectie === naam);
  });
  bouwPagina();
}

document.getElementById('nav-knoppen').addEventListener('click', function(e){
  var knop = e.target.closest('.nav-btn');
  if(!knop) return;
  wisselSectie(knop.dataset.sectie);
});

// ── Start ─────────────────────────────────────────────
bouwPagina();
</script>
</body>
