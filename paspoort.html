<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Landenpaspoort — Wereld van Wonderen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100vw; height:100vh; overflow:hidden; background:#020d1a; font-family:"Segoe UI",sans-serif; user-select:none; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #0a2338 0%, #020d1a 75%);
  }

  /* ── Terug-naar-start-knop in de hoek, als illustratie i.p.v. tekstknopje —
     mag opvallender/groter zijn dan het oude tekstknopje. ── */
  #terug-knop {
    position:fixed; left:14px; top:14px; z-index:50;
    width:clamp(150px, 15vw, 260px); border:none; background:none; padding:0;
    cursor:pointer; opacity:0.92; transition:opacity 0.15s, transform 0.15s;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  #terug-knop img { width:100%; display:block; }
  #terug-knop:hover { opacity:1; transform:scale(1.03); }

  /* ── Groep van boek + pagina-label samen, verticaal gecentreerd in het
     beschikbare scherm. Het label hangt hierdoor vlak onder het boek, in
     plaats van los onderaan het scherm te zweven. ── */
  #boek-groep {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    flex:1; min-height:0; width:100%;
  }

  /* ── De rij met: pijl-terug, het boek zelf, pijl-verder ── */
  #boek-rij {
    display:flex; align-items:center; justify-content:center;
    gap:min(2.8vw, 30px);
    width:100%;
    padding:8px 2vw 0;
  }

  .pagina-pijl-knop {
    flex:none; background:none; border:none; cursor:pointer; padding:0;
    width:clamp(60px, 8.5vw, 150px);
    display:flex; align-items:center; justify-content:center;
    opacity:0.9; transition:opacity 0.15s, transform 0.15s;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,0.5));
  }
  .pagina-pijl-knop:hover:not(:disabled) { opacity:1; transform:scale(1.08); }
  .pagina-pijl-knop:disabled { opacity:0.2; cursor:default; }
  .pagina-pijl-knop img { width:100%; display:block; }

  /* ── Het boek: exact dezelfde aanpak als het kader in raadspel.html —
     breedte begrensd door zowel schermbreedte als -hoogte, hoogte volgt
     via aspect-ratio, zodat het boek altijd zo groot mogelijk in beeld
     staat zonder vervorming. ── */
  #kader {
    position:relative; flex:none;
    width:min(74vw, 80vh*1.25);
    aspect-ratio:640/512;
    background:url('images/paspoort-boek-referentie.png') center/contain no-repeat;
    filter:drop-shadow(0 12px 40px rgba(0,0,0,0.6));
  }

  /* ── Stempels: precies over de 9 getekende wereldbolletjes ── */
  .stempel-kaart {
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    cursor:url('images/vergrootglas.png') 32 32, zoom-in;
  }
  .stempel-kaart img.stempel-foto {
    width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    transition:transform 0.12s;
    border-radius:4%;
  }
  .stempel-kaart:hover img.stempel-foto { transform:scale(1.04); }

  /* ── "Weet ik te vinden!"-stempel: legt zich schuin over een hoek van
     iedere landenillustratie, met het grootste deel erbuiten. Positie en
     kanteling verschillen per land (zie berekening in bouwStempels()),
     zodat het niet bij ieder land precies hetzelfde staat. ── */
  .stempel-verificatie {
    position:absolute; left:80%; top:20%;
    width:43%;
    pointer-events:none; opacity:0.82;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,0.4));
  }

  /* ── Landnaampje, direct onder elke stempel ── */
  .stempel-naam {
    position:absolute; text-align:center;
    font-family:'Baloo 2',sans-serif; font-weight:800;
    font-size:clamp(0.64rem, 1.5vw, 0.95rem);
    letter-spacing:0.2px;
    color:#4a2e10; line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none;
  }

  /* ── Nog niet verdiend: illustratie blijft zichtbaar (leuk vooruitzicht),
     maar vaag/vervaagd (licht, weinig contrast) in plaats van donker, en
     zonder verificatiestempel - die stempel bewijst juist dat het land
     verdiend is. Niet meer aanklikbaar (zie ook cursor hieronder): de
     uitvergroting met het weetje erbij mag pas te zien zijn als het écht
     verdiend is. Een slotje-badge maakt dat extra duidelijk, terwijl de
     landnaam gewoon zichtbaar blijft. ── */
  .stempel-kaart.nog-niet-verzameld { cursor:default; }
  .stempel-kaart.nog-niet-verzameld img.stempel-foto {
    filter:grayscale(1) brightness(1.55) contrast(0.45) opacity(0.55);
  }
  .stempel-slotje {
    position:absolute; right:3%; top:3%;
    width:24%; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(0.75rem, 1.8vw, 1.2rem);
    background:rgba(30,20,8,0.5); border-radius:50%;
    box-shadow:0 2px 5px rgba(0,0,0,0.35);
    pointer-events:none;
  }
  .stempel-naam.nog-niet-verzameld {
    color:#a4937a; font-style:italic; font-weight:700;
  }

  /* ── Onzichtbare klikvlakken bovenop de al getekende tabbladen rechts
     in de boek-afbeelding zelf — geen eigen tab-styling nodig, die staat
     al in de illustratie. ── */
  .werelddeel-tab {
    position:absolute; background:none; border:none; cursor:pointer; padding:0;
  }
  #tab-highlight {
    position:absolute; border-radius:14%/18%;
    box-shadow:0 0 0 3px #fff6c8, 0 0 16px 4px rgba(255,246,200,0.85);
    pointer-events:none; transition:top 0.2s ease, height 0.2s ease;
  }

  #pagina-label {
    flex:none; padding:14px 0 0;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.35rem;
    color:rgba(255,255,255,0.7); text-align:center;
  }

  /* ── Uitvergroting: volledige schermhoogte benut, illustratie zo groot
     mogelijk, tekst eronder links uitgelijnd. Zelfde klik-om-te-sluiten-
     patroon als bij het raadspel, met het vergrootglas als cursor. ── */
  #uitvergroot-achtergrond {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.82);
    z-index:500; align-items:center; justify-content:center;
    gap:min(4vw, 46px); padding:4vh min(16vw, 220px);
    cursor:url('images/vergrootglas.png') 32 32, zoom-out;
  }
  #uitvergroot-achtergrond.actief { display:flex; }

  /* ── Grote ronde illustratie, zo groot mogelijk in beeld ── */
  #uitvergroot-cirkel-wrap {
    flex:none; height:min(86vh, 46vw); aspect-ratio:1/1;
    border-radius:50%; overflow:hidden;
    box-shadow:0 0 0 6px rgba(255,246,200,0.92), 0 20px 60px rgba(0,0,0,0.7);
    cursor:url('images/vergrootglas.png') 32 32, zoom-out;
  }
  #uitvergroot-img {
    width:100%; height:100%; object-fit:cover; display:block;
  }

  /* ── Tekstkader ernaast, niet eronder — op een stukje perkament dat
     Arjen zelf aanlevert (images/perkament.png). De binnenkant staat
     ingesprongen zodat de tekst binnen het beschreven vlak blijft, met
     de opgerolde randen en de klauw erbuiten. ── */
  #uitvergroot-tekstblok {
    position:relative; flex:none;
    width:min(30vw, 82vh*(1200/1400));
    aspect-ratio:1200/1400;
    background:url('images/perkament.png') center/contain no-repeat;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.55));
  }
  #uitvergroot-tekstblok-binnen {
    position:absolute; left:22%; right:21%; top:21%; bottom:25%;
    overflow-y:auto; text-align:left;
  }
  #uitvergroot-naam {
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.6rem;
    color:#7a3d10; text-shadow:0 1px 2px rgba(255,255,255,0.4); text-align:left;
  }
  #uitvergroot-feit {
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.05rem; line-height:1.5;
    color:#3a2a12; text-align:left; margin-top:12px;
  }

  /* ── Vorige/volgende, als grote pijlen in de hoeken van het scherm —
     zo kun je binnen de uitvergroting door de landen heen bladeren. ── */
  .uitvergroot-pijl-knop {
    position:fixed; bottom:4vh; z-index:520;
    width:clamp(64px, 10vw, 160px); background:none; border:none; padding:0; cursor:pointer;
    opacity:0.92; transition:opacity 0.15s, transform 0.15s;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.6));
  }
  .uitvergroot-pijl-knop:hover:not(:disabled) { opacity:1; transform:scale(1.06); }
  .uitvergroot-pijl-knop:disabled { opacity:0.15; cursor:default; }
  .uitvergroot-pijl-knop img { width:100%; display:block; }
  #uitvergroot-vorige { left:3vw; }
  #uitvergroot-volgende { right:3vw; }

  ::-webkit-scrollbar { width:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,215,0,0.3); border-radius:6px; }

  /* ── Welkomstmelding bij een leeg paspoort (0 stempels): geen kader,
     gewoon gloeiende gele letters overheen het (verduisterde) boek,
     wegtikbaar. De donkere achtergrond blijft, alleen om het boek zelf te
     dimmen en de tekst goed leesbaar te maken - geen apart tekstkader. ── */
  #leeg-paspoort-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72);
    z-index:400; align-items:center; justify-content:center;
    padding:6vh 10vw; cursor:pointer;
  }
  #leeg-paspoort-overlay.actief { display:flex; }
  @keyframes leegPaspoortGloed {
    0%, 100% {
      text-shadow:
        0 0 10px rgba(255,230,120,0.9),
        0 0 22px rgba(255,208,60,0.75),
        0 0 42px rgba(255,185,20,0.5),
        0 2px 5px rgba(0,0,0,0.7);
    }
    50% {
      text-shadow:
        0 0 16px rgba(255,238,150,1),
        0 0 32px rgba(255,215,80,0.95),
        0 0 60px rgba(255,195,40,0.75),
        0 2px 5px rgba(0,0,0,0.7);
    }
  }
  #leeg-paspoort-tekst {
    max-width:min(660px, 88vw);
    font-family:'Baloo 2',sans-serif; font-weight:800;
    font-size:clamp(1.2rem, 2.9vw, 2rem);
    color:#fff9d6; text-align:center; line-height:1.5;
    animation:leegPaspoortGloed 2.4s ease-in-out infinite;
  }
</style>
</head>
<body>

<button id="terug-knop" onclick="ganNaarStart()">
  <img src="images/terug-naar-start-knop.png" alt="Terug naar start"/>
</button>

<div id="boek-groep">
  <div id="boek-rij">
    <button id="pijl-terug" class="pagina-pijl-knop" onclick="ganNaarPagina(huidigePagina-1)">
      <img src="images/paspoort-terug.png" alt="Vorige pagina"/>
    </button>

    <div id="kader">
      <div id="tab-highlight"></div>
      <div id="tabs-laag"></div>
      <div id="stempel-laag"></div>
    </div>

    <button id="pijl-verder" class="pagina-pijl-knop" onclick="ganNaarPagina(huidigePagina+1)">
      <img src="images/paspoort-verder.png" alt="Volgende pagina"/>
    </button>
  </div>

  <div id="pagina-label">pagina 1 van 1</div>
</div>

<div id="uitvergroot-achtergrond">
  <button id="uitvergroot-vorige" class="uitvergroot-pijl-knop" onclick="naarStempelIndex(huidigeIndex-1)">
    <img src="images/paspoort-terug.png" alt="Vorig land"/>
  </button>
  <div id="uitvergroot-cirkel-wrap"><img id="uitvergroot-img" src="" alt=""/></div>
  <div id="uitvergroot-tekstblok">
    <div id="uitvergroot-tekstblok-binnen">
      <div id="uitvergroot-naam"></div>
      <div id="uitvergroot-feit"></div>
    </div>
  </div>
  <button id="uitvergroot-volgende" class="uitvergroot-pijl-knop" onclick="naarStempelIndex(huidigeIndex+1)">
    <img src="images/paspoort-verder.png" alt="Volgend land"/>
  </button>
</div>

<!-- Welkomstmelding voor een paspoort dat nog helemaal leeg is (0 stempels
     verdiend) - verschijnt bovenop het boek, weg te tikken, en komt terug
     zolang er nog niks verdiend is. -->
<div id="leeg-paspoort-overlay">
  <div id="leeg-paspoort-tekst">Als je het spel speelt en landen goed hebt, kun je hier voor alle landen van de wereld een mooie landenstempel winnen!</div>
</div>

<script>
// ── Databron: alle 204 landen, gesorteerd per werelddeel (eerst de meer
// bekende/grotere landen, dan "klein maar fijn"). Wordt periodiek door
// Arjen bijgewerkt/aangevuld, net als de kalibratietabel in index.html. ──
const PASPOORT_DATA = [{"naam": "Albanië", "bestand": "Albanie", "continent": "EU", "tekst": "Tijdens de Koude Oorlog liet de Albanese dictator Enver Hoxha, uit angst voor een aanval die nooit kwam, meer dan 170.000 kleine betonnen bunkers over het hele land verspreiden — ongeveer één bunker voor elke tien inwoners. Ze staan overal: op stranden, in weilanden, midden in steden, zelfs op besneeuwde bergtoppen, en de meeste zijn nooit voor iets gebruikt. Tegenwoordig zijn de bunkers een soort bezienswaardigheid geworden."}, {"naam": "België", "bestand": "Belgie", "continent": "EU", "tekst": "Onder de velden bij het stadje Ieper liggen nog altijd duizenden granaten uit de Eerste Wereldoorlog verborgen in de aarde. Elk jaar graven boeren er zo'n 200.000 kilo aan oude munitie op tijdens het ploegen — de \"IJzeren Oogst\" genoemd — die dan voorzichtig door het leger wordt opgeruimd. Ieper was het toneel van enkele van de bloedigste veldslagen van die oorlog, en elke avond om acht uur klinkt er nog steeds, al meer dan negentig jaar lang, een herdenkingssignaal onder de Menenpoort, ter nagedachtenis aan de gesneuvelde soldaten."}, {"naam": "Bosnië en Herzegovina", "bestand": "Bosnie-Herzegovina", "continent": "EU", "tekst": "In de stad Mostar staat een prachtige, hoog gebogen stenen brug over de rivier, gebouwd door de Ottomanen meer dan 400 jaar geleden. Tijdens de oorlog in de jaren '90 werd de brug helemaal kapotgeschoten en stortte hij in de rivier. Jaren later werd de brug, met dezelfde bouwtechniek en zoveel mogelijk van dezelfde steensoort, precies zo herbouwd als hij ooit was. Vandaag de dag springen jonge mannen uit de stad, als bewijs van moed, nog steeds van de brug af het koude water in."}, {"naam": "Bulgarije", "bestand": "Bulgarije", "continent": "EU", "tekst": "In Bulgarije doen mensen iets wat overal ter wereld voor verwarring zorgt: als ze \"ja\" bedoelen, schudden ze hun hoofd heen en weer — het gebaar dat wij juist voor \"nee\" gebruiken. En knikken ze met hun hoofd op en neer, zoals wij voor \"ja\" doen, dan bedoelen ze eigenlijk \"nee\". Toeristen die dit niet weten, raken hierdoor soms hopeloos in de war tijdens een gesprek. Niemand weet precies waarom deze omgekeerde gewoonte ooit is ontstaan, maar hij bestaat al eeuwenlang en is nog steeds springlevend."}, {"naam": "Denemarken", "bestand": "Denemarken", "continent": "EU", "tekst": "Tijdens de Tweede Wereldoorlog, toen Denemarken bezet was door Nazi-Duitsland, ontstond het verhaal dat de Deense koning Christian X zelf een gele ster droeg uit solidariteit met de Joodse inwoners van zijn land — al is dat waarschijnlijk een legende, geen bewezen feit. Wat wél waar gebeurde, was minstens zo bijzonder: gewone Denen hielpen in het geheim bijna hun hele Joodse bevolking, zo'n 7000 mensen, met bootjes naar het neutrale Zweden te smokkelen, vlak voordat de bezetter ze wilde oppakken. Daardoor overleefde bijna elke Deense Jood de oorlog — een uniek verhaal in vergelijking met de rest van bezet Europa."}, {"naam": "Duitsland", "bestand": "Duitsland", "continent": "EU", "tekst": "Bijna dertig jaar lang liep dwars door Berlijn een betonnen muur die de stad in een oostelijk en een westelijk deel splitste, compleet met wachttorens en bewakers die vluchtelingen mochten neerschieten. Families en vrienden konden elkaar plotseling niet meer bezoeken, soms zelfs niet meer zien, terwijl ze maar een paar straten van elkaar woonden. In 1989 viel de muur bijna van de ene op de andere dag, nadat duizenden mensen de grens gewoon overstaken terwijl bewakers besloten niet meer in te grijpen. Vandaag de dag herinneren nog maar een paar stukken muur, vol graffiti, aan die gespleten tijd."}, {"naam": "Estland", "bestand": "Estland", "continent": "EU", "tekst": "Estland was het eerste land ter wereld waar mensen via internet mogen stemmen bij verkiezingen, en bijna alle overheidszaken — belastingaangifte, doktersrecept, zelfs een bedrijf oprichten — kunnen er in een paar minuten online geregeld worden. Dat is geen toeval: na het uiteenvallen van de Sovjet-Unie in de jaren '90 had Estland vrijwel niets, en koos de regering ervoor om meteen alles digitaal op te bouwen in plaats van oude systemen te moderniseren. Ook Skype, een van de eerste programma's waarmee je gratis via internet kon bellen, is bedacht door Estse ontwikkelaars. Estland biedt zelfs mensen die er nooit gewoond hebben een soort digitaal \"inwonerschap\" aan, waarmee je online een bedrijf in het land kunt runnen."}, {"naam": "Finland", "bestand": "Finland", "continent": "EU", "tekst": "In Lapland, het noorden van Finland, leven meer rendieren dan mensen, en veel daarvan zijn geen wilde dieren maar eigendom van herders — elk dier krijgt een merkteken in het oor zodat duidelijk is van wie het is. Finland beweert ook de officiële woonplaats van de Kerstman te zijn: in het dorpje Rovaniemi, precies op de poolcirkel, staat een heus Kerstmandorp waar het hele jaar door kinderen uit de hele wereld post naartoe sturen. Elk jaar komen daar letterlijk honderdduizenden brieven binnen, geadresseerd aan \"De Kerstman, Finland\"."}, {"naam": "Frankrijk", "bestand": "Frankrijk", "continent": "EU", "tekst": "De Eiffeltoren is gemaakt van ijzer, en ijzer zet uit als het warm wordt. Op een hete zomerdag kan de toren wel 15 centimeter groter worden dan op een koude winterdag! De zon schijnt meestal harder op één kant van de toren, waardoor die kant iets meer uitzet. Daardoor buigt de top soms een paar centimeter naar de schaduwkant. De toren wordt trouwens om de zeven jaar helemaal opnieuw geverfd, met de hand, door een klein team schilders. Ze gebruiken drie verschillende tinten brons — van donker onderaan tot lichter bovenaan — zodat de toren er overal even mooi uitziet tegen de lucht."}, {"naam": "Griekenland", "bestand": "Griekenland", "continent": "EU", "tekst": "Meer dan 2500 jaar geleden bedachten de oude Grieken de Olympische Spelen, een sportwedstrijd die om de vier jaar gehouden werd ter ere van de goden, op een plek die Olympia heette. Tijdens de Spelen gold er zelfs een speciale, heilige wapenstilstand: oorlogen tussen Griekse steden werden tijdelijk stopgezet. Meer dan duizend jaar later, in 1896, werden de Spelen nieuw leven ingeblazen, en sindsdien doen landen van over de hele wereld mee aan wat ooit een klein Grieks lokaal feest was."}, {"naam": "Hongarije", "bestand": "Hongarije", "continent": "EU", "tekst": "Het Hongaars is zo anders dan bijna alle andere Europese talen, dat zelfs mensen uit buurlanden er geen woord van verstaan. Dat komt doordat de voorouders van de Hongaren, ruim duizend jaar geleden, helemaal vanuit het gebied bij de Oeral-bergen in Rusland naar Europa trokken, met hun eigen taal in de bagage. Hongaars heeft geen mannelijk of vrouwelijk woordgeslacht, maar wel een duizelingwekkend aantal naamvallen — sommige taalkundigen tellen er wel achttien."}, {"naam": "Ierland", "bestand": "Ierland", "continent": "EU", "tekst": "Traditionele Ierse muziek, met instrumenten als de fluit, viool en bodhrán (een handtrommel), wordt tegenwoordig over de hele wereld gespeeld — van pubs in Tokio tot straatmuzikanten in New York. Ierland heeft ook een opvallend record: het land heeft vaker het Eurovisie Songfestival gewonnen dan enig ander land, maar liefst zeven keer. Het beroemde Ierse klavertje, de shamrock, werd volgens de legende door Sint Patricius gebruikt om de heilige drie-eenheid uit te leggen aan de Ieren, met de drie blaadjes als symbool. Vandaag de dag is het klavertje het bekendste symbool van Ierland ter wereld."}, {"naam": "IJsland", "bestand": "IJsland", "continent": "EU", "tekst": "IJsland ligt precies op de grens van twee continentale platen, die langzaam uit elkaar schuiven — je kunt op sommige plekken zelfs letterlijk met één voet in Europa en één voet in Amerika staan. Diezelfde breuklijn zorgt voor tientallen actieve vulkanen, waardoor het land regelmatig uitbarst; in 2010 legde een IJslandse vulkaan met een naam die bijna niemand kan uitspreken (Eyjafjallajökull) het luchtverkeer boven half Europa dagenlang plat. Al die vulkanische hitte gebruiken IJslanders ook slim: bijna alle huizen worden verwarmd met warmte uit de aarde zelf, en overal op het eiland liggen natuurlijke warmwaterbronnen waarin je gewoon kunt zwemmen, zelfs als het buiten vriest."}, {"naam": "Italië", "bestand": "Italie", "continent": "EU", "tekst": "Bijna tweeduizend jaar geleden lag aan de voet van de vulkaan Vesuvius een levendige Romeinse stad, Pompeii. Op een dag in het jaar 79 barstte de vulkaan zo plotseling en heftig uit dat de hele stad binnen een paar uur onder een dikke laag as en gloeiend gesteente verdween. Bij opgravingen ontdekten archeologen dat de as zo snel om de lichamen van de slachtoffers heen verhard was, dat je nu nog steeds de exacte houding kunt zien waarin mensen stierven, als afgietsels in steen."}, {"naam": "Kroatië", "bestand": "Kroatie", "continent": "EU", "tekst": "Op een Kroatisch eiland, genaamd Mljet, ligt iets wat bijna niemand verwacht: een compleet meer, met daarin weer een klein eilandje, waarop een oud kloostertje staat. Het meer is eigenlijk zeewater dat via smalle geultjes in verbinding staat met de open zee. Bezoekers fietsen of wandelen rond het meer, en kunnen met een bootje naar het eilandje varen om het kloostertje te bezoeken."}, {"naam": "Litouwen", "bestand": "Litouwen", "continent": "EU", "tekst": "Bij het stadje Šiauliai ligt een heuvel waar al meer dan honderd jaar mensen kruisen achterlaten — inmiddels staan er meer dan honderdduizend, van piepklein tot torenhoog, dicht op elkaar gepropt. De traditie ontstond als stille vorm van verzet: tijdens de Sovjettijd probeerden de leiders de heuvel meerdere keren met bulldozers plat te maken, maar telkens verschenen er in het geheim weer nieuwe kruisen. Litouwers zien de heuvel als symbool van hun standvastigheid en geloof, ook toen het land bezet was. Vandaag de dag komen bezoekers uit de hele wereld hun eigen kruis toevoegen aan de verzameling."}, {"naam": "Luxemburg", "bestand": "Luxemburg", "continent": "EU", "tekst": "Luxemburg is een van de kleinste landen van Europa, maar heeft wel meer dan honderd kastelen en burchten. Veel daarvan staan op steile rotsen boven diepe dalen, omdat het land vroeger vaak werd aangevallen en mensen zich goed wilden verdedigen. De hoofdstad, ook Luxemburg genoemd, ligt zelf op zo'n rots en heeft onder de grond een heel netwerk van tunnels en gangen, gebouwd om soldaten te verstoppen. Die tunnels zijn zo groot dat je er nu als toerist doorheen kunt lopen."}, {"naam": "Montenegro", "bestand": "Montenegro", "continent": "EU", "tekst": "Eeuwenlang veroverde het machtige Ottomaanse Rijk bijna de hele Balkan — behalve Montenegro. De ruige, bijna ontoegankelijke bergen van het land maakten het voor Ottomaanse legers vrijwel onmogelijk om er met grote troepenmachten doorheen te trekken. Vanuit hun bergvesting, met als hoofdstad het piepkleine stadje Cetinje, bleven de Montenegrijnen eeuw na eeuw verzet plegen. Daardoor kon Montenegro zich, ondanks zijn kleine omvang, al vroeg als vrijwel onafhankelijk staatje handhaven."}, {"naam": "Nederland", "bestand": "Nederland", "continent": "EU", "tekst": "Klompen lijken ouderwets, maar op sommige Nederlandse boerderijen worden ze nog steeds gedragen — niet uit nostalgie, maar omdat ze in de blubberige, natte grond gewoon beter werken dan laarzen. Hout houdt water tegen en isoleert de voeten, en een klomp zakt minder snel weg in modder dan een gewone schoen. Nederland telt ook meer fietsen dan inwoners: er rijden zo'n 23 miljoen fietsen rond voor 18 miljoen mensen. Sommige steden hebben zelfs fietsfiles, met opstoppingen van fietsers in plaats van auto's. En dan is er nog de tulp: in de 17e eeuw werd één zeldzame bloembol soms wel voor de prijs van een grachtenpand verkocht — de beroemde \"tulpenmanie\"."}, {"naam": "Noord-Macedonië", "bestand": "Noord-Macedonie", "continent": "EU", "tekst": "Noord-Macedonië heette tot 2019 gewoon \"Macedonië\" — totdat het buurland Griekenland daar al bijna dertig jaar bezwaar tegen maakte, omdat er in Griekenland zelf ook een regio Macedonië ligt. Na jarenlang onderhandelen kwamen de twee landen tot een compromis: het land voegde het woordje \"Noord\" toe aan zijn naam. Het duurde uiteindelijk bijna drie decennia voordat de knoop werd doorgehakt."}, {"naam": "Noorwegen", "bestand": "Noorwegen", "continent": "EU", "tekst": "In het noorden van Noorwegen, boven de poolcirkel, gaat de zon 's zomers wekenlang helemaal niet onder — daarom heet het land ook wel \"het land van de middernachtzon\". 's Winters gebeurt precies het omgekeerde: dan blijft het op sommige plekken dagenlang donker, en komt de zon niet boven de horizon uit. In diezelfde donkere winters is er wel iets spectaculairs te zien: het noorderlicht, groene en paarse lichtgolven die door de lucht dansen, ontstaan doordat deeltjes van de zon botsen met de dampkring van de aarde. Noren gebruiken die lange, donkere winters juist om massaal te skiën — skiën is hier zelfs uitgevonden, duizenden jaren geleden, als manier om je door de sneeuw te verplaatsen."}, {"naam": "Oekraïne", "bestand": "Oekraine", "continent": "EU", "tekst": "In Oekraïne bestaat een eeuwenoude traditie om paaseieren te versieren met piepkleine, ingewikkelde patronen — de zogeheten pysanky. Met heet bijenwas en verf wordt laagje voor laagje een prachtig patroon op een rauw ei aangebracht, in een techniek die al eeuwen van moeder op dochter wordt doorgegeven. Elk symbool op het ei betekent iets: een zon staat voor geluk, een net voor bescherming."}, {"naam": "Oostenrijk", "bestand": "Oostenrijk", "continent": "EU", "tekst": "Wenen, de hoofdstad van Oostenrijk, was eeuwenlang de plek waar de beroemdste componisten ter wereld woonden en werkten — Mozart, Beethoven en Haydn liepen er letterlijk door dezelfde straten. Mozart schreef als kind al muziek en trad op zesjarige leeftijd al op voor keizers en koningen. Beethoven bleef in Wenen componeren en dirigeren, zelfs toen hij op latere leeftijd bijna helemaal doof werd — hij voelde de trillingen van de muziek soms via de vloer of door zijn tanden op het instrument te bijten. Vandaag de dag klinkt er in Wenen nog steeds bijna elke avond klassieke muziek, in dezelfde concertzalen en operahuizen waar deze componisten ooit zelf stonden."}, {"naam": "Polen", "bestand": "Polen", "continent": "EU", "tekst": "Aan het einde van de Tweede Wereldoorlog lag de oude binnenstad van Warschau bijna helemaal plat, met opzet vernietigd door de bezetter als straf voor een opstand van de bevolking. Toen de oorlog voorbij was, besloten de Polen iets ongelooflijks: ze bouwden de hele oude stad, straat voor straat, precies zo weer op als hij er eeuwen daarvoor had uitgezien. Om te weten hoe elk gebouw er precies uitzag, gebruikten ze onder andere heel gedetailleerde schilderijen van een Italiaanse schilder die Warschau twee eeuwen eerder had vastgelegd, tot in de kleinste versieringen aan toe. Wie nu door de oude binnenstad van Warschau wandelt, loopt dus eigenlijk door een stad die is nagebouwd vanaf schilderijen — en toch voelt alles er eeuwenoud aan."}, {"naam": "Portugal", "bestand": "Portugal", "continent": "EU", "tekst": "Op één ochtend in 1755 werd de Portugese hoofdstad Lissabon getroffen door een van de zwaarste aardbevingen ooit gemeten in Europa — precies op een feestdag, toen duizenden mensen in kerken zaten. Vlak daarna trok de zee zich vreemd terug van de kust, totdat er een enorme vloedgolf terugkwam die een groot deel van de stad wegvaagde. De ramp schokte heel Europa zo erg dat filosofen er eeuwenlang over bleven nadenken, en Lissabon werd daarna helemaal opnieuw opgebouwd met brede, rechte straten."}, {"naam": "Roemenië", "bestand": "Roemenie", "continent": "EU", "tekst": "Hoog in de Roemeense bergen staat een kasteel met torentjes en steile daken, Bran Castle, dat wereldwijd bekend werd als \"het kasteel van Dracula\" — al is dat eigenlijk een beetje misleidend. Schrijver Bram Stoker is nooit in Roemenië geweest en beschreef het kasteel puur op basis van plaatjes en verhalen. Wél bestond er echt een Roemeense vorst waarop het personage Dracula losjes gebaseerd is: Vlad de Spietser, een 15e-eeuwse heerser die berucht was om zijn wrede straffen tegen indringers."}, {"naam": "Rusland", "bestand": "Rusland", "continent": "EU", "tekst": "Rusland is zo groot dat het over elf verschillende tijdzones ligt — als het in het uiterste oosten van het land middernacht is, is het in het westen pas twee uur 's middags! Het land is zo enorm dat je, als je van west naar oost door heel Rusland zou reizen met de trein (de beroemde Transsiberische Spoorweg), meer dan een week onderweg bent, dwars door bossen, bergen en de bevroren wildernis van Siberië. Rusland is zelfs groter dan Pluto: het landoppervlak is groter dan de hele oppervlakte van die dwergplaneet!"}, {"naam": "Servië", "bestand": "Servie", "continent": "EU", "tekst": "In het centrum van de Servische hoofdstad Belgrado staat een gebouw dat er nog precies zo uitziet als op de dag dat het geraakt werd: half ingestort, met kapotte muren en gaten waar ramen zaten. Het is het oude ministerie van Defensie, dat tijdens de NAVO-bombardementen in 1999 werd getroffen — en dat de Serviërs sindsdien bewust niet hebben afgebroken of hersteld. Het staat er middenin de stad, als een soort stille herinnering aan die periode."}, {"naam": "Slovenië", "bestand": "Slovenie", "continent": "EU", "tekst": "Onder de bergen van Slovenië ligt een van de grootste grottenstelsels van Europa, de Postojna-grot, met gangen die je tegenwoordig met een klein treintje kunt bezoeken. In diezelfde donkere, waterrijke grotten leeft een bijzonder beestje, de \"olm\" — een blind, roze watersalamandertje dat wel honderd jaar oud kan worden. Vroeger dachten mensen die het diertje toevallig zagen dat het een baby-draak was, en zo ontstonden eeuwenoude legendes over draken onder de Sloveense bergen."}, {"naam": "Slowakije", "bestand": "Slowakije", "continent": "EU", "tekst": "Onder de Slowaakse bergen ligt een van de grootste verzamelingen ondergrondse grotten van heel Europa, met bevroren ijsgrotten, druipsteenformaties die er soms uitzien als bevroren waterval, en gangen die nog steeds niet allemaal in kaart zijn gebracht. Eén grot, de Demänovská-ijsgrot, blijft het hele jaar door ijskoud, zelfs midden in de zomer, doordat koude lucht er 's winters naar binnen zakt en blijft hangen. Sommige van deze grotten werden pas per toeval ontdekt, soms door jagers die een konijn achternazaten en plotseling in een compleet ondergronds landschap terechtkwamen."}, {"naam": "Spanje", "bestand": "Spanje", "continent": "EU", "tekst": "In Barcelona bouwt men al sinds 1882 aan een enorme kerk, de Sagrada Família, ontworpen door de architect Antoni Gaudí. Gaudí wist al tijdens zijn leven dat hij het einde nooit zou meemaken, en zei dat zijn opdrachtgever geen haast had, want die opdrachtgever was volgens hem God zelf. Toen Gaudí in 1926 overleed, na een ongeluk met een tram, was nog maar een kwart van het gebouw af — en toch ging de bouw door dankzij zijn tekeningen, kleimodellen en het geduld van generaties bouwers na hem. Precies honderd jaar na zijn dood, in juni 2026, werd de kerk eindelijk plechtig ingewijd door de paus — al zijn de bouwers nog jarenlang bezig met de laatste versieringen aan de hoofdingang."}, {"naam": "Tsjechië", "bestand": "Tsjechie", "continent": "EU", "tekst": "Het woord \"robot\" bestond vroeger helemaal niet — het werd zo'n honderd jaar geleden bedacht door een Tsjechische schrijver, Karel Čapek, voor een toneelstuk over kunstmatige mensen die in een fabriek werden gemaakt om te werken. Het Tsjechische woord \"robota\" betekent zoiets als \"verplicht werk\" of \"hard zwoegen\", en Čapek's broer bedacht de kortere versie \"robot\" ervoor. Het toneelstuk werd in korte tijd in tientallen talen vertaald en overal ter wereld opgevoerd, en het woord bleef gewoon hangen — tot op de dag van vandaag gebruikt iedereen ter wereld een Tsjechisch woord zodra het over robots gaat, zonder dat de meeste mensen dat ooit beseffen."}, {"naam": "Verenigd Koninkrijk", "bestand": "Verenigd_Koninkrijk", "continent": "EU", "tekst": "Bij de Tower of London wonen al eeuwenlang een stuk of zes tamme raven, met geknipte vleugels zodat ze niet wegvliegen. Een oude legende zegt dat als de raven ooit verdwijnen, het koninkrijk zal vallen — koning Karel II nam dat blijkbaar zo serieus dat hij een speciale ravenverzorger aanstelde, een functie die nog steeds bestaat. Het kasteel diende door de eeuwen heen als paleis, gevangenis, dierentuin én plek waar de kroonjuwelen worden bewaard. Sommige gevangenen krasten wanhopige boodschappen in de stenen muren, die nog steeds te zien zijn voor bezoekers."}, {"naam": "Wit-Rusland", "bestand": "Wit-Rusland", "continent": "EU", "tekst": "In een enorm oerbos op de grens van Wit-Rusland en Polen, het Białowieża-woud, leven nog altijd wilde Europese bizons rond — dieren die overal elders in Europa allang waren uitgestorven. Na de Eerste Wereldoorlog waren ze zelfs helemaal verdwenen, ook hier, doordat ze werden opgejaagd voor vlees en gestroopt. Alle bizons die nu in het bos rondlopen, stammen af van een handjevol dieren die in dierentuinen hadden overleefd en speciaal werden teruggebracht om de soort te redden. Het bos zelf is een van de laatste stukken van het oeroude oerwoud dat ooit bijna heel Europa bedekte, met bomen die honderden jaren oud zijn."}, {"naam": "Zweden", "bestand": "Zweden", "continent": "EU", "tekst": "Zweden is het land van Ikea, en achter de simpele naam zit een handig trucje: elk meubel wordt plat verpakt, zodat er in één vrachtwagen veel meer meubels passen dan wanneer ze al in elkaar zaten. De naam Ikea is trouwens een afkorting van de naam van de oprichter, Ingvar Kamprad, plus de boerderij en het dorp waar hij opgroeide. Zweden is ook een van de meest beboste landen van Europa: ruim twee derde van het land bestaat uit bos, vol elanden — er lopen er zoveel rond dat auto's speciale hoge bumpers hebben om aanrijdingen met deze enorme dieren te overleven."}, {"naam": "Zwitserland", "bestand": "Zwitserland", "continent": "EU", "tekst": "Onder de Zwitserse Alpen ligt een van de langste treintunnels ter wereld, de Gotthard-basistunnel, die dwars door de bergen heen loopt in plaats van eroverheen. De tunnel is meer dan 57 kilometer lang en het duurde bijna twintig jaar om hem te bouwen — arbeiders moesten door keiharde granietrots boren, soms wel twee kilometer diep onder de bergtoppen. Dankzij de tunnel kunnen treinen nu in een paar minuten reizen waar je vroeger, over de bergpas heen, uren voor nodig had, zeker in de winter als sneeuw de wegen blokkeerde."}, {"naam": "Andorra", "bestand": "Andorra", "continent": "EU", "tekst": "Andorra ligt zo hoog in de bergen dat het complete land vol steile hellingen zit, en in de winter is het er een van de populairste skibestemmingen van heel Europa. Sommige inwoners kunnen letterlijk vanaf hun voordeur de skilift oplopen. Doordat het land zo hoog en afgelegen ligt, betalen inwoners van Andorra al eeuwenlang nauwelijks belasting, wat het behalve een skiparadijs ook een populaire plek maakt om spullen belastingvrij te kopen."}, {"naam": "Cyprus", "bestand": "Cyprus", "continent": "EU", "tekst": "Cyprus is het enige land in Europa dat letterlijk in twee delen is opgesplitst door een grens dwars door de hoofdstad heen, Nicosia — de laatste nog gedeelde hoofdstad ter wereld. Sinds een conflict in 1974 loopt er een bewaakte bufferzone, de \"Groene Lijn\", helemaal door het midden van de stad en het eiland. In dat verlaten gebied staan gebouwen en zelfs winkels er nog precies zo bij als vlak voor het conflict begon."}, {"naam": "Faeröer", "bestand": "Faroer", "continent": "EU", "tekst": "Om de verspreide Faeröer-eilanden met elkaar te verbinden, hebben ingenieurs een tunnel gebouwd die dwars onder de zeebodem door loopt — met daarin, diep onder het water, een verlichte rotonde versierd met een groot kunstwerk. Auto's rijden er zomaar rondjes, tientallen meters onder de golven, terwijl boven hen vissersboten over het wateroppervlak varen."}, {"naam": "Gibraltar", "bestand": "Gibraltar", "continent": "EU", "tekst": "Gibraltar is een piepklein stukje Groot-Brittannië, verstopt op de zuidpunt van Spanje, met maar één enkele, kolossale rots in het midden: de Rots van Gibraltar. Op die rots wonen wilde apen, de beroemde Berberapen — de enige wilde apen van heel Europa! Er gaat een oud verhaal dat zolang de apen op de rots blijven, Gibraltar Brits zal blijven. Vanaf de top kun je op een heldere dag zelfs Afrika zien liggen: de zeestraat ertussen is maar zo'n 14 kilometer breed, een van de smalste plekken tussen twee continenten ter wereld."}, {"naam": "Kosovo", "bestand": "Kosovo", "continent": "EU", "tekst": "Kosovo is een van de jongste landen ter wereld — het riep in 2008 pas zijn onafhankelijkheid uit, wat betekent dat er kinderen zijn die ouder zijn dan het land zelf! Niet elk land ter wereld erkent Kosovo trouwens als eigen land, wat het een van de meest bijzondere en soms verwarrende plekken op de wereldkaart maakt. In de hoofdstad Pristina staat een groot standbeeld van Bill Clinton, de Amerikaanse oud-president, omdat de Verenigde Staten hielpen bij het einde van een zware oorlog in de jaren '90 — best gek, een Amerikaanse president vereeuwigd midden in een Europese stad!"}, {"naam": "Letland", "bestand": "Letland", "continent": "EU", "tekst": "In 1989 vormden zo'n twee miljoen mensen uit Letland, Estland en Litouwen een menselijke ketting van bijna 700 kilometer lang, hand in hand door alle drie de landen heen, als vreedzaam protest tegen de Sovjet-bezetting. Deze actie, de \"Baltische Weg\" genoemd, hielp mee om internationale aandacht te trekken vlak voordat de drie landen hun onafhankelijkheid heroverden. Letland staat ook bekend om zijn traditie van massale volksliederenfeesten, waarbij tienduizenden mensen tegelijk zingen — een gewoonte die zo belangrijk was voor de nationale identiteit dat de onafhankelijkheidsbeweging wel de \"Zingende Revolutie\" werd genoemd."}, {"naam": "Liechtenstein", "bestand": "Liechtenstein", "continent": "EU", "tekst": "Liechtenstein is zo klein en overzichtelijk dat het complete land — inclusief bergen, dorpjes en het kasteel van de vorst — weleens door groepen is afgehuurd voor een groot privéfeest, compleet met een eigen \"koning voor één nacht\". Het land ligt half verstopt tussen Zwitserland en Oostenrijk, hoog in de Alpen, en heeft zoveel bergen dat er nauwelijks ruimte over is om te wonen. Ondanks zijn kleine formaat heeft Liechtenstein een eigen nationaal skiteam dat meedoet aan de Olympische Spelen, en het land won zelfs een handvol medailles."}, {"naam": "Malta", "bestand": "Malta", "continent": "EU", "tekst": "Tijdens de Tweede Wereldoorlog werd het kleine Malta zo zwaar gebombardeerd door vijandelijke vliegtuigen, dat het waarschijnlijk het meest gebombardeerde stukje grond ter wereld werd. De bevolking schuilde wekenlang in oude, ondergrondse tunnels en grotten die eeuwen eerder waren uitgehakt in de zachte kalksteen. Omdat de Maltezers ondanks alles bleven volhouden, kreeg het complete eiland na de oorlog een bijzondere onderscheiding: een heldenmedaille van de Britse koning, iets wat normaal alleen aan individuele mensen wordt toegekend. Die medaille staat vandaag de dag nog steeds afgebeeld op de Maltese vlag."}, {"naam": "Moldavië", "bestand": "Moldavie", "continent": "EU", "tekst": "Aan de oostkant van Moldavië ligt een smalle strook grond die zichzelf een apart land noemt, Transnistrië, compleet met eigen grens, eigen geld en eigen leger — al erkent bijna geen enkel ander land ter wereld het als een echt land. Transnistrië gebruikt nog steeds de vlag en symbolen van de oude Sovjet-Unie, met hamer en sikkel erop. Reizigers die er komen, zeggen vaak dat het voelt alsof ze terugstappen in de tijd."}, {"naam": "Monaco", "bestand": "Monaco", "continent": "EU", "tekst": "Elk jaar wordt in Monaco een van de beroemdste autoraces ter wereld gehouden, de Grand Prix van Monaco, dwars door de gewone straten van het stadje — inclusief scherpe bochten langs huizen, een tunnel en de haven. De coureurs rijden er met meer dan 250 kilometer per uur rakelings langs vangrails. Omdat Monaco zo klein is, moeten de organisatoren de complete race-inrichting elk jaar weer opbouwen en na afloop weer afbreken."}, {"naam": "San Marino", "bestand": "San_Marino", "continent": "EU", "tekst": "San Marino heeft een nationaal voetbalteam dat, ondanks een bevolking van maar 34.000 mensen, meedoet aan officiële internationale wedstrijden tegen landen die honderden keren groter zijn. Het team verloor decennialang bijna elke wedstrijd met enorme cijfers, maar schreef toch voetbalgeschiedenis: in 1993 scoorde een Sammarinese speler na precies 8,3 seconden een doelpunt tegen Engeland — nog steeds het snelste doelpunt ooit gemaakt in een WK-kwalificatiewedstrijd."}, {"naam": "Vaticaanstad", "bestand": "Vaticaanstad", "continent": "EU", "tekst": "Vaticaanstad is zo klein dat je het complete land, van de ene grens naar de andere, in nog geen tien minuten kunt doorwandelen. Het is het enige land ter wereld dat helemaal binnen een andere stad ligt, midden in Rome, en heeft zelfs geen eigen vliegveld, spoorlijn van betekenis of leger van normale grootte. Toch is Vaticaanstad razend belangrijk: het is het bestuurscentrum van de katholieke kerk, met aan het hoofd de paus."}, {"naam": "Algerije", "bestand": "Algerije", "continent": "AF", "tekst": "Algerije is het grootste land van heel Afrika, groter dan heel West-Europa bij elkaar — en toch woont bijna iedereen langs een smalle strook aan de kust. Meer dan vier vijfde van het land bestaat namelijk uit de kurkdroge Sahara, met eindeloze zandvlaktes en rotswoestijnen waar bijna niemand woont. Diep in die woestijn liggen wel duizenden jaren oude rotstekeningen, gemaakt toen de Sahara nog een groen, vruchtbaar gebied was vol rivieren en dieren zoals giraffen en nijlpaarden."}, {"naam": "Angola", "bestand": "Angola", "continent": "AF", "tekst": "Aan de grens van Angola liggen de Calandula-watervallen, die breder zijn dan de beroemde Victoria Falls verderop in Afrika, al zijn ze veel minder bekend bij de rest van de wereld. Het water valt er met een enorme kracht meer dan 100 meter naar beneden, en de nevel die daarbij ontstaat, is soms al van kilometers afstand te zien. Doordat het gebied jarenlang moeilijk bereikbaar was, weten nog maar weinig reizigers van het bestaan van deze indrukwekkende watervallen af."}, {"naam": "Benin", "bestand": "Benin", "continent": "AF", "tekst": "Voor de kust van Benin ligt Ganvié, een dorp dat helemaal op palen boven een meer is gebouwd — huizen, een kerk, scholen en zelfs winkels, allemaal bereikbaar met bootjes in plaats van straten. Het dorp ontstond eeuwen geleden toen een groep mensen op de vlucht was voor slavenjagers, die volgens hun geloof het water niet in mochten — dus bouwde de gevluchte gemeenschap hun huizen midden op het meer, waar ze veilig waren. Vandaag de dag wonen er nog steeds duizenden mensen, die vissen, boodschappen doen en naar school gaan, allemaal varend."}, {"naam": "Botswana", "bestand": "Botswana", "continent": "AF", "tekst": "Botswana ontdekte kort na zijn onafhankelijkheid grote diamantvoorraden, en koos er, in tegenstelling tot veel andere landen met waardevolle grondstoffen, voor om de opbrengsten grotendeels in het hele land te investeren — in scholen, wegen en ziekenhuizen. Daardoor groeide Botswana uit tot een van de meest welvarende en stabiele landen van heel Afrika, terwijl grote delen van het land tegelijk zorgvuldig beschermd natuurgebied bleven, vol olifanten en ander wild."}, {"naam": "Burkina Faso", "bestand": "Burkina_Faso", "continent": "AF", "tekst": "De naam Burkina Faso betekent zoiets als \"het land van de eerlijke mensen\", een naam die het land zichzelf gaf nadat het zich, bijna 40 jaar geleden, losmaakte van zijn koloniale verleden en een nieuwe naam koos die uit twee verschillende lokale talen is samengesteld. Het land heeft geen kust en ligt helemaal midden in West-Afrika, met savannes waar tijdens het droge seizoen alles verkleurt tot goudbruin, en tijdens het regenseizoen juist felgroen wordt."}, {"naam": "Centraal-Afrikaanse Republiek", "bestand": "Centraal-Afrikaanse_Republiek", "continent": "AF", "tekst": "De Centraal-Afrikaanse Republiek ligt, zoals de naam al zegt, precies in het hart van Afrika, zonder eigen kust — het dichtstbijzijnde stuk zee ligt honderden kilometers verderop. Het land bestaat voor een groot deel uit dichte regenwouden en uitgestrekte savannes, waar olifanten, luipaarden en zeldzame bosgorilla's rondlopen. Omdat er maar weinig wegen zijn en grote delen van het land moeilijk bereikbaar zijn, blijft veel van die natuur nog vrij ongerept."}, {"naam": "Congo-Brazzaville", "bestand": "Congo-Brazzaville", "continent": "AF", "tekst": "In de dichte regenwouden van het noorden van de Republiek Congo werden pas relatief laat, zo'n dertig jaar geleden, grote groepen laagland-gorilla's ontdekt op plekken waar wetenschappers ze niet hadden verwacht — in een gebied dat zo afgelegen en drassig is dat het nauwelijks door mensen bezocht werd. Onderzoekers die er kwamen, merkten dat sommige gorilla's zich amper druk maakten om mensen, omdat ze nog nooit eerder gejaagd waren en dus geen angst voor mensen hadden geleerd."}, {"naam": "Congo-Kinshasa", "bestand": "Congo-Kinshasa", "continent": "AF", "tekst": "Door de Democratische Republiek Congo stroomt de rivier de Congo, de op één na langste rivier van Afrika, maar wel de diepste rivier ter wereld — op sommige plekken meer dan 200 meter diep, dieper dan bijna elk gebouw hoog is. Die enorme diepte, gecombineerd met sterke stromingen, zorgt ervoor dat er in de rivier vissoorten leven die zich in de loop van miljoenen jaren volledig hebben aangepast aan het duistere, drukke water op de bodem, en die nergens anders ter wereld voorkomen."}, {"naam": "Egypte", "bestand": "Egypte", "continent": "AF", "tekst": "De piramides van Gizeh zijn meer dan 4500 jaar geleden gebouwd, zonder kranen of machines, en toch bestaan ze uit miljoenen enorme steenblokken die soms wel meerdere tonnen wegen. Hoe de oude Egyptenaren die blokken precies zo hoog en zo precies op elkaar kregen, weten wetenschappers nog steeds niet helemaal zeker — er zijn wel tientallen theorieën, over hellingbanen, sleden en zelfs water, maar geen enkele is bewezen. De grootste piramide was, tot zo'n 130 jaar geleden, het hoogste bouwwerk ter wereld — langer dan 3800 jaar lang het record vasthouden, wat geen enkel ander bouwwerk ooit heeft geëvenaard."}, {"naam": "Ethiopië", "bestand": "Ethiopie", "continent": "AF", "tekst": "Volgens een oude legende ontdekte een Ethiopische geitenhoeder duizenden jaren geleden dat zijn geiten wild begonnen te dansen nadat ze bepaalde rode bessen hadden gegeten — en zo zou de koffieplant zijn ontdekt. Waar of niet, Ethiopië geldt wel echt als het land waar koffie voor het eerst groeide, en er groeien er nog steeds wilde koffiestruiken in de bergbossen. Koffiedrinken is er niet zomaar een drankje, maar een heel ritueel: bonen worden vers geroosterd, gemalen en in drie rondes geschonken tijdens een ceremonie die wel een uur kan duren."}, {"naam": "Gabon", "bestand": "Gabon", "continent": "AF", "tekst": "In tegenstelling tot veel andere landen koos Gabon er relatief vroeg voor om grote stukken regenwoud te beschermen in plaats van te kappen, waardoor het land nu een van de laatste grote, aaneengesloten regenwouden van Afrika herbergt. Gabon is ook een van de weinige plekken ter wereld waar bosolifanten zomaar uit het regenwoud tevoorschijn komen en over het strand lopen, soms zelfs de golven in. Wetenschappers vinden er nog regelmatig diersoorten die nergens anders ter wereld voorkomen. Het land verdient bovendien relatief veel geld met olie, waardoor de druk om het woud te kappen voor landbouw minder groot was dan elders."}, {"naam": "Ghana", "bestand": "Ghana", "continent": "AF", "tekst": "In Ghana worden sommige mensen begraven in een kist die niet op een gewone kist lijkt, maar op iets wat bij hun leven of beroep past — een reusachtige vis voor een visser, een vliegtuig voor iemand die graag reisde, of zelfs een enorme cacaoboon of Coca-Colafles. Deze bijzondere \"fantasiekisten\" worden speciaal met de hand gemaakt door timmerlieden die er wereldwijd inmiddels bekend om staan. Een Ghanese begrafenis is dan ook vaak minder somber dan je zou verwachten, met muziek, dans en felle kleuren, als viering van iemands leven."}, {"naam": "Guinee", "bestand": "Guinee", "continent": "AF", "tekst": "In Guinee ligt de grootste voorraad bauxiet ter wereld, het erts waaruit aluminium wordt gemaakt — bijna alles wat je aan aluminium om je heen ziet, van blikjes tot vliegtuigonderdelen, is ooit ergens begonnen als rode aarde uit de grond van Guinee. Grote delen van het land hebben daardoor een opvallend roodbruine grond en wegen, gekleurd door al dat ijzerrijke gesteente."}, {"naam": "Ivoorkust", "bestand": "Ivoorkust", "continent": "AF", "tekst": "Ivoorkust is het land dat de meeste cacao ter wereld produceert — meer dan een derde van alle chocolade die wereldwijd gegeten wordt, begint als een cacaoboon van hier. De cacaovruchten groeien niet aan de takken maar direct uit de stam van de boom, en moeten met de hand geplukt en geopend worden. Toch hebben veel boeren die de bonen verbouwen zelf nog nooit een reep chocolade geproefd, omdat die pas ver van hier, in andere fabrieken, wordt gemaakt."}, {"naam": "Kameroen", "bestand": "Kameroen", "continent": "AF", "tekst": "Kameroen wordt weleens \"Afrika in miniatuur\" genoemd, omdat het land bijna elk landschapstype van het continent binnen zijn grenzen heeft: regenwouden in het zuiden, savannes in het noorden, bergen, stranden en zelfs een woestijnachtig gebied helemaal bovenaan. Die diversiteit zie je ook terug in de mensen: er worden in Kameroen meer dan 250 verschillende talen gesproken, wat het een van de taalrijkste landen ter wereld maakt."}, {"naam": "Kenia", "bestand": "Kenia", "continent": "AF", "tekst": "Uit een klein gebied in het westen van Kenia, rond de stad Iten hoog in de bergen, komen verrassend veel van 's werelds beste langeafstandslopers — Kenia wint al decennialang opvallend veel medailles op de marathon en andere hardloopnummers. Wetenschappers denken dat de combinatie van het leven op grote hoogte, waar de lucht ijler is, en het dagelijks kilometers hardlopen naar school als kind, kinderen hier van jongs af aan een unieke conditie meegeeft. Tegenwoordig komen lopers uit de hele wereld naar Iten om er, tussen de lokale toplopers, zelf te trainen."}, {"naam": "Liberia", "bestand": "Liberia", "continent": "AF", "tekst": "Liberia werd bijna 200 jaar geleden gesticht door bevrijde tot slaaf gemaakte mensen uit Amerika, die met schepen terugkeerden naar Afrika om er een nieuw, vrij land op te bouwen. Daardoor lijkt de vlag van Liberia sterk op die van de Verenigde Staten, met rode en witte strepen en een ster, en heet de hoofdstad Monrovia, vernoemd naar een Amerikaanse president. Het is daarmee een van de weinige Afrikaanse landen die nooit door een Europese macht gekoloniseerd is geweest."}, {"naam": "Libië", "bestand": "Libie", "continent": "AF", "tekst": "Diep in de Libische woestijn ligt een plek die geldt als een van de droogste en meest verlaten plekken op aarde — soms vallen er jarenlang helemaal geen druppel regen. Toch woonden er duizenden jaren geleden mensen, in een tijd dat het gebied nog groen en vruchtbaar was. Zij lieten honderden rotsschilderingen achter op de bergwanden van het Acacus-gebergte, met zwemmende mensen, giraffen en olifanten erop — een stil bewijs dat de kurkdroge Sahara er ooit heel anders uitzag."}, {"naam": "Madagaskar", "bestand": "Madagaskar", "continent": "AF", "tekst": "Madagaskar brak zo'n 88 miljoen jaar geleden los van het vasteland van Afrika en dreef sindsdien helemaal op zichzelf in de Indische Oceaan. Daardoor ontwikkelden planten en dieren zich hier compleet anders dan waar ook ter wereld: meer dan negentig procent van alle diersoorten op het eiland, zoals de bekende maki's (een soort lemuren), komt nergens anders voor. Wetenschappers noemen Madagaskar daarom weleens het \"achtste continent\"."}, {"naam": "Malawi", "bestand": "Malawi", "continent": "AF", "tekst": "Het Malawimeer beslaat bijna een kwart van de totale oppervlakte van Malawi en wordt ook wel het \"Meer van de Sterren\" genoemd, omdat vissers 's nachts met bootjes vol brandende lampen uitvaren, die vanaf de kust net sterretjes op het water lijken. In het meer zwemmen meer verschillende soorten vissen dan in bijna elk ander meer ter wereld — honderden soorten kleurrijke cichliden, waarvan de meeste nergens anders voorkomen. Voor veel dorpen langs de oever is het meer nog steeds de belangrijkste bron van voedsel en vervoer."}, {"naam": "Mali", "bestand": "Mali", "continent": "AF", "tekst": "Timboektoe, een stad in Mali, was eeuwenlang omgeven door legendes in Europa als een mysterieuze \"stad van goud\", vol schatten die niemand van buitenaf ooit met eigen ogen had gezien. In werkelijkheid was de stad vooral rijk door goud- en zouthandel, en gold ze als een van de belangrijkste centra van kennis in heel Afrika, met bibliotheken vol duizenden oude handschriften over sterrenkunde, wiskunde en geneeskunde. Veel van die eeuwenoude boeken worden er nog steeds bewaard, sommige verstopt in kisten om ze tegen oorlog en plundering te beschermen."}, {"naam": "Marokko", "bestand": "Marokko", "continent": "AF", "tekst": "Aan de rand van Marokko begint de Sahara, de grootste hete woestijn ter wereld, met duinen die wel 150 meter hoog kunnen worden. Bij zonsopgang en zonsondergang verandert het zand van kleur, van goud naar oranje naar diep rood, en daarom trekken elk jaar duizenden reizigers erheen om er te overnachten in een tent tussen de duinen. 's Nachts wordt het er soms verrassend koud, ook al is het overdag snikheet — sommige nachten kan het zelfs vriezen. Kamelen worden er al eeuwenlang gebruikt om mensen en spullen door het zand te vervoeren, en ze kunnen dagenlang zonder water."}, {"naam": "Mauritanië", "bestand": "Mauritanie", "continent": "AF", "tekst": "Door Mauritanië rijdt een van de langste treinen ter wereld, soms wel meer dan 2 kilometer lang, die dwars door de Sahara ertsklonten vervoert van een mijn naar de kust. Sommige lokale reizigers klimmen, bij gebrek aan ander vervoer, gewoon boven op de open wagons vol ijzererts en reizen zo urenlang mee door de kale woestijn, blootgesteld aan hitte overdag en snijdende kou 's nachts."}, {"naam": "Mozambique", "bestand": "Mozambique", "continent": "AF", "tekst": "Voor de kust van Mozambique liggen uitgestrekte koraalriffen, waaronder plekken waar in 1938 een vis werd gevangen die wetenschappers allang uitgestorven waanden: de coelacanth, een levend fossiel dat al miljoenen jaren nauwelijks veranderd is. De vondst zorgde wereldwijd voor grote opschudding, omdat het was alsof er zomaar een dinosaurus uit zee omhoog kwam zwemmen. Nog steeds duiken onderzoekers in de diepe onderzeese kloven voor de kust, op zoek naar meer van deze zeldzame vissen."}, {"naam": "Namibië", "bestand": "Namibie", "continent": "AF", "tekst": "In de Namibwoestijn, een van de oudste woestijnen ter wereld, liggen enkele van de hoogste zandduinen op aarde — sommige torenen wel 300 meter boven de vlakte uit, met een diep oranjerode kleur door het ijzer in het zand. Op een plek genaamd Deadvlei staat een kleivlakte vol kromme, kolzwarte boomstammen die al honderden jaren dood zijn, maar door de extreme droogte niet verrotten — ze staan er nog precies zo bij als toen de laatste druppel water er eeuwen geleden verdween."}, {"naam": "Niger", "bestand": "Niger", "continent": "AF", "tekst": "Meer dan driekwart van Niger bestaat uit de Sahara, met eindeloze zandvlaktes en duinen die honderden kilometers doorlopen. Toch wonen er, verspreid over die enorme woestijn, al eeuwenlang Toearegs, ook wel \"de blauwe mensen van de woestijn\" genoemd vanwege hun blauw geverfde kleding, die met kamelenkaravanen door het zand trekken. Zij kennen de woestijn zo goed dat ze zich, zonder kaart of kompas, oriënteren op de sterren en de vorm van de duinen."}, {"naam": "Nigeria", "bestand": "Nigeria", "continent": "AF", "tekst": "Lagos, de grootste stad van Nigeria, telt meer dan twintig miljoen inwoners en groeit nog steeds razendsnel — daarmee is het een van de grootste steden van heel Afrika. De stad ligt deels op eilanden en lagunes, en drukke, kleurrijke watertaxi's varen er dwars door het verkeer heen, terwijl op straat duizenden kleine gele busjes, de \"danfo's\", zich al toeterend een weg banen door files die tot ver buiten de stad kunnen duren. Nigeria is vernoemd naar de rivier de Niger, die dwars door het land stroomt en zich vlak voor de zee splitst in honderden kleinere geulen — een van de grootste rivierdelta's ter wereld, vol mangrovebossen en moerassen. In dat drassige gebied wordt ook veel olie gewonnen, wat een paar mensen rijk maakt, maar de delta zelf, met zijn ingewikkelde doolhof van waterwegen, blijft voor buitenstaanders bijna ondoordringbaar zonder plaatselijke gids."}, {"naam": "Oeganda", "bestand": "Oeganda", "continent": "AF", "tekst": "In het zuidwesten van Oeganda ligt een dicht, eeuwenoud regenwoud, het Bwindi-woud, dat zo ontoegankelijk en begroeid is dat het \"Ondoordringbaar Woud\" wordt genoemd. Hier leven berggorilla's, een van de zeldzaamste diersoorten ter wereld, hoog in de met mist bedekte bergen. Om ze te zien, moeten bezoekers soms uren door dicht struikgewas klimmen, begeleid door gidsen die de gorillafamilies op hun geluiden en sporen weten te vinden."}, {"naam": "Senegal", "bestand": "Senegal", "continent": "AF", "tekst": "Voor de kust van Dakar ligt een klein eiland, Gorée, met een gebouw dat bekendstaat als het \"Huis van de Slaven\" — een van de plekken vanwaar eeuwenlang tot slaaf gemaakte mensen gedwongen werden overgezet naar schepen richting Amerika. Een deur in het gebouw, uitkijkend over de oceaan, wordt de \"Deur zonder terugkeer\" genoemd. Tegenwoordig komen staatshoofden en bezoekers van over de hele wereld naar het eiland om er stil te staan bij dat verleden."}, {"naam": "Sierra Leone", "bestand": "Sierra_Leone", "continent": "AF", "tekst": "De hoofdstad Freetown werd zo'n 230 jaar geleden gesticht als vrijhaven voor bevrijde tot slaaf gemaakte mensen, die na hun vrijlating een nieuw thuis kregen aan de West-Afrikaanse kust — vandaar ook de naam, die letterlijk \"Vrije Stad\" betekent. Freetown is daardoor een van de oudste steden van Afrika die speciaal met dat doel werd gebouwd. Vlak bij de stad liggen nu nog steeds prachtige, weinig bezochte witte stranden met kokospalmen."}, {"naam": "Soedan", "bestand": "Soedan", "continent": "AF", "tekst": "De meeste mensen denken bij piramides meteen aan Egypte, maar Soedan heeft er eigenlijk meer — meer dan 200 stuks, gebouwd door de oude koningen en koninginnen van het rijk Kush. Ze zijn kleiner en spitser dan de Egyptische piramides, met steilere hellingen, en liggen verspreid in de woestijn bij de plek Meroë, ooit een machtige hoofdstad. Eeuwenlang lagen ze er bijna vergeten en onbezocht bij, terwijl toeristen massaal naar Egypte trokken voor dezelfde soort bouwwerken."}, {"naam": "Somalië", "bestand": "Somalie", "continent": "AF", "tekst": "In het noorden van Somalië groeien bomen die een bijzondere, geurige hars afscheiden zodra je een sneetje in de schors maakt — wierook en mirre, stoffen die al duizenden jaren over de hele wereld verhandeld worden. In de oudheid waren deze harsen soms wel net zoveel waard als goud, en werden ze gebruikt bij religieuze plechtigheden tot ver in Egypte en het Midden-Oosten. Verzamelaars klimmen nog steeds, net als hun voorouders eeuwen geleden, met blote handen tegen de rotsachtige hellingen op om de bomen te bereiken."}, {"naam": "Tanzania", "bestand": "Tanzania", "continent": "AF", "tekst": "De Kilimanjaro, de hoogste berg van Afrika, staat helemaal alleen midden in de vlakte van Tanzania, zonder ander gebergte eromheen — daardoor lijkt hij vanaf een afstand nog indrukwekkender dan zijn hoogte al is. Onderweg naar de top loop je door wel vier verschillende klimaatzones: van tropisch regenwoud onderaan, via savanne en een kale, maanachtige woestijnzone, tot sneeuw en ijs helemaal bovenop — ondanks dat de berg vlak bij de evenaar ligt. Beklimmers hebben geen speciale klim-uitrusting nodig, alleen een goede conditie en tijd om aan de hoogte te wennen."}, {"naam": "Tsjaad", "bestand": "Tsjaad", "continent": "AF", "tekst": "Het Tsjaadmeer was ooit een van de grootste meren van Afrika, zo groot dat het vanuit de ruimte goed te zien was. Door droogte en te veel water dat eruit gehaald werd voor landbouw, is het meer de afgelopen decennia tot een klein fractie van zijn oorspronkelijke grootte geslonken. Miljoenen mensen uit de landen eromheen zijn afhankelijk van het overgebleven water, om te vissen, te drinken en hun vee te laten grazen, waardoor het krimpende meer een grote zorg is voor de hele regio."}, {"naam": "Tunesië", "bestand": "Tunesie", "continent": "AF", "tekst": "In het zuiden van Tunesië, aan de rand van de Sahara, staan vreemde, ronde woningen die half onder de grond zijn uitgegraven om de brandende hitte buiten te houden — hele dorpen liggen er verstopt in de rotsen. Filmmakers vonden het landschap zo buitenaards dat ze het gebruikten als filmset voor een beroemde ruimtefilmserie, en de decorstukken staan er nog steeds, half vergaan in het zand. Toeristen uit de hele wereld reizen er speciaal naartoe om tussen de originele filmsets te lopen."}, {"naam": "Zambia", "bestand": "Zambia", "continent": "AF", "tekst": "In delen van Zambia lopen olifanten al eeuwenlang dezelfde oude trekroutes, die vaak dwars door gebieden lopen waar inmiddels mensen wonen. Sommige dorpen hebben daardoor geleerd om met de dieren samen te leven: 's nachts blijven mensen binnen als de olifanten voorbijtrekken, en sommige boeren gebruiken bijenkorven als een soort natuurlijk hek, omdat olifanten bang zijn voor het geluid van bijen en zo hun akkers met rust laten."}, {"naam": "Zimbabwe", "bestand": "Zimbabwe", "continent": "AF", "tekst": "In het binnenland van Zimbabwe liggen de indrukwekkende ruïnes van Great Zimbabwe, een enorme stad van gestapelde stenen muren, gebouwd zonder cement, die meer dan 700 jaar geleden het centrum was van een machtig Afrikaans koninkrijk. Toen Europese ontdekkingsreizigers de ruïnes eeuwen later vonden, weigerden sommigen lange tijd te geloven dat Afrikanen dit zelf gebouwd hadden — pas na jarenlang onderzoek werd definitief bevestigd dat de stad volledig het werk was van lokale bouwers. Het land dankt er zelfs zijn naam aan."}, {"naam": "Zuid-Afrika", "bestand": "Zuid-Afrika", "continent": "AF", "tekst": "Zuid-Afrika is een van de weinige landen ter wereld met niet één, maar drie hoofdsteden, elk met een eigen taak: Pretoria voor de regering, Kaapstad voor het parlement, en Bloemfontein voor de rechtspraak. Die verdeling ontstond ruim honderd jaar geleden als compromis tussen verschillende regio's die geen van allen de andere stad de volledige eer wilden gunnen. Het land heeft ook nog eens elf officiële talen, meer dan bijna elk ander land ter wereld."}, {"naam": "Burundi", "bestand": "Burundi", "continent": "AF", "tekst": "In Burundi bestaat een eeuwenoude traditie van trommelen die vroeger alleen voor koninklijke gelegenheden was voorbehouden: groepen mannen dragen zware, met de hand gemaakte trommels op hun hoofd terwijl ze tegelijk dansen, springen en drummen, helemaal synchroon met elkaar. De trommels zelf worden gezien als heilige voorwerpen. Tegenwoordig treden deze trommelgroepen ook op bij internationale festivals, waar hun ritme en energie wereldwijd bewondering oogsten."}, {"naam": "Comoren", "bestand": "Comoren", "continent": "AF", "tekst": "Op het eiland Grande Comore, het grootste van de Comoren, ligt een van de meest actieve vulkanen ter wereld, de Karthala, die met enige regelmaat uitbarst. Rond de rand van de krater, hoog boven de eilanden, groeit een bijzonder soort mistbos, vochtig en begroeid met mos, compleet anders dan de tropische kust een stuk lager. Ondanks het gevaar wonen er nog steeds mensen op de hellingen van de vulkaan, omdat de grond er, dankzij de as, uitzonderlijk vruchtbaar is."}, {"naam": "Djibouti", "bestand": "Djibouti", "continent": "AF", "tekst": "Djibouti ligt op een plek waar drie stukken van de aardkorst langzaam uit elkaar trekken, waardoor er over miljoenen jaren een compleet nieuwe oceaan zou kunnen ontstaan. Je kunt de gevolgen daarvan nu al zien: diepe scheuren in de grond, borrelende modderpoelen en gloeiend hete bronnen, verspreid over een kaal, bijna maanachtig landschap. Wetenschappers komen er speciaal naartoe om te bestuderen hoe een oceaan in zijn allereerste, prille begin ontstaat."}, {"naam": "Equatoriaal-Guinea", "bestand": "Equatoriaal-Guinee", "continent": "AF", "tekst": "Equatoriaal-Guinea bestaat uit een stuk vasteland en een eiland, Bioko, die honderden kilometers uit elkaar liggen in de Golf van Guinee — de hoofdstad Malabo ligt zelfs op het eiland, niet op het vasteland. Op Bioko ligt een uitgedoofde vulkaan, en het regenwoud op het eiland behoort tot de regenrijkste plekken van heel Afrika, met zoveel neerslag per jaar dat sommige delen van het bos bijna permanent nat en dampend zijn."}, {"naam": "Eritrea", "bestand": "Eritrea", "continent": "AF", "tekst": "Voor de kust van Eritrea, in de Rode Zee, liggen honderden koraaleilandjes die nauwelijks door toeristen bezocht worden. Bij een van de havens liggen ook de roestige wrakken van oude schepen, half onder water, herinneringen aan gevechten uit een ver verleden. Onder water is het gebied juist rijk aan leven: felgekleurde vissen en koraalriffen die nog grotendeels ongerept zijn, omdat er zo weinig duikers komen."}, {"naam": "Eswatini", "bestand": "Eswatini", "continent": "AF", "tekst": "Eswatini heette tot 2018 Swaziland, tot de koning besloot de naam te veranderen naar de eigen taal — Eswatini betekent zoiets als \"land van de Swazi's\". Het land wordt nog steeds bestuurd door een koning die vrijwel alle macht in handen heeft, een van de laatste landen ter wereld waar dat nog zo is. Elk jaar wordt er een groot traditioneel rietdansfestival gehouden, waarbij duizenden ongehuwde vrouwen in kleurrijke kleding voor de koning dansen met bossen riet, die daarna gebruikt worden om de omheining van de koninklijke residentie te herstellen."}, {"naam": "Gambia", "bestand": "Gambia", "continent": "AF", "tekst": "Gambia is het kleinste land van het Afrikaanse vasteland en heeft een heel bijzondere vorm: een lange, smalle strook grond die aan beide kanten de rivier de Gambia volgt, helemaal omringd door het veel grotere buurland Senegal. De grens werd ooit, zo gaat het verhaal, min of meer bepaald door hoe ver het schot van een kanonneerboot op de rivier reikte. Daardoor is Gambia op de kaart bijna net zo lang als de rivier zelf, maar nergens meer dan enkele tientallen kilometers breed."}, {"naam": "Guinee-Bissau", "bestand": "Guinee-Bissau", "continent": "AF", "tekst": "Voor de kust van Guinee-Bissau ligt een groep van meer dan tachtig eilanden, de Bijagos-archipel, waarvan er maar een klein aantal permanent bewoond zijn. Op sommige eilanden gelden nog eeuwenoude tradities: jonge mannen moeten er zwemmend met een nijlpaard overweg kunnen leren als onderdeel van hun overgang naar volwassenheid. De eilanden zijn zo afgelegen en onaangetast gebleven dat zeekoeien, zeeschildpadden en tientallen vogelsoorten er nog volop voorkomen."}, {"naam": "Kaapverdië", "bestand": "Kaapverdie", "continent": "AF", "tekst": "Kaapverdië werd vernoemd naar Kaap Verde (Groenkaap) op het Afrikaanse vasteland, de dichtstbijzijnde kust — maar de eilanden zelf zijn juist opvallend droog en kaal, met weinig van het groen waar de naam eigenlijk naar verwijst. De vulkanische eilanden bestaan uit dor, rotsachtig landschap, afgewisseld met een paar groene valleien waar water uit de bergen samenkomt. Doordat de eilanden onbewoond waren tot Portugese ontdekkingsreizigers er aankwamen, zijn alle huidige bewoners nazaten van latere kolonisten en tot slaaf gemaakte mensen die er naartoe werden gebracht."}, {"naam": "Lesotho", "bestand": "Lesotho", "continent": "AF", "tekst": "Lesotho is een van de weinige landen ter wereld die volledig omringd zijn door precies één ander land — het ligt compleet binnen de grenzen van Zuid-Afrika, als een soort eiland van bergen middenin. Doordat het hele land in de bergen ligt, op grote hoogte, valt er 's winters regelmatig sneeuw, en heeft Lesotho zelfs een eigen skigebied — een van de weinige in heel Afrika."}, {"naam": "Mauritius", "bestand": "Mauritius", "continent": "AF", "tekst": "Op Mauritius leefde ooit de dodo, een grote, logge vogel die niet kon vliegen en nergens anders ter wereld voorkwam. Doordat het eiland eeuwenlang onbewoond was, had de dodo nooit geleerd bang te zijn voor mensen of de dieren die zij meebrachten, zoals ratten en varkens — met als gevolg dat de vogel binnen zo'n honderd jaar na de eerste menselijke bewoners volledig uitstierf. Tegenwoordig is de dodo overal op Mauritius terug te zien, op munten, standbeelden en souvenirs, als symbool van het eiland — al bestaat het dier zelf allang niet meer."}, {"naam": "Rwanda", "bestand": "Rwanda", "continent": "AF", "tekst": "Rwanda wordt ook wel \"het land van de duizend heuvels\" genoemd, omdat het hele land bestaat uit groene, glooiende heuvels waar dorpjes en akkers tegenaan geplakt lijken te zitten. Na een verschrikkelijke periode van geweld, ruim dertig jaar geleden, koos het land ervoor om zich extreem grondig te vernieuwen: de hoofdstad Kigali geldt inmiddels als een van de schoonste en veiligste steden van heel Afrika, met onder meer een maandelijkse verplichte opruimdag waar bijna alle inwoners aan meedoen."}, {"naam": "São Tomé en Príncipe", "bestand": "Sao_Tome_en_Principe", "continent": "AF", "tekst": "Vlak bij São Tomé ligt een klein rotseilandje, Ilhéu das Rolas, waar de evenaar dwars doorheen loopt — je kunt er met één voet op het noordelijk halfrond staan en met de andere op het zuidelijk halfrond. De twee eilanden van het land liggen algemeen bekend als een van de best bewaarde geheimen van Afrika: dicht tropisch regenwoud, zwarte vulkanische stranden en cacaoplantages die door de eeuwen heen amper zijn veranderd."}, {"naam": "Seychellen", "bestand": "Seychellen", "continent": "AF", "tekst": "Op een paar eilanden van de Seychellen groeit een unieke palmboom met de grootste zaden van de hele plantenwereld — de kokosnoot ervan kan wel twintig kilo wegen en heeft een vorm die opvallend lijkt op een vrouwelijk bekken. Eeuwenlang spoelden deze reusachtige noten soms aan op verre stranden, ver van de Seychellen vandaan, zonder dat iemand wist waar ze vandaan kwamen — mensen dachten dat ze van een boom op de bodem van de zee kwamen. Pas veel later ontdekten ontdekkingsreizigers de boom in het echt, verstopt op een paar afgelegen eilanden."}, {"naam": "Togo", "bestand": "Togo", "continent": "AF", "tekst": "Togo is een lange, smalle reep land, van de kust tot ver het binnenland in, en op dat kleine oppervlak wonen wel veertig verschillende bevolkingsgroepen, elk met hun eigen taal en tradities. In het noorden bouwen sommige gemeenschappen nog steeds ronde, met stro bedekte hutten die aan elkaar vast zitten als een soort mini-fort, ooit gebouwd om zich tegen indringers te kunnen verdedigen."}, {"naam": "Westelijke Sahara", "bestand": "Westelijke_Sahara", "continent": "AF", "tekst": "Westelijke Sahara is een van de minst bevolkte gebieden ter wereld — een enorme, hete woestijnvlakte aan de kust van de Atlantische Oceaan, waar bijna niemand woont. Het bijzondere aan dit gebied is dat er al sinds de jaren '70 ruzie over is: Marokko bestuurt het grootste deel, maar het Sahrawi-volk, met hun eigen bevrijdingsbeweging, vindt dat het hun eigen, onafhankelijke land moet zijn. Daardoor staat Westelijke Sahara bekend als \"Afrika's laatste kolonie\" en is het een van de weinige plekken ter wereld waarvan de Verenigde Naties nog steeds niet hebben besloten bij wie het precies hoort."}, {"naam": "Zuid-Soedan", "bestand": "Zuid-Soedan", "continent": "AF", "tekst": "Zuid-Soedan bestaat nog niet zo lang: pas in 2011 werd het een eigen, zelfstandig land, na een volksstemming waarbij bijna iedereen voor onafhankelijkheid van Sudan stemde. Daarmee is het op dit moment het jongste erkende land ter wereld. Het land moest daarna vanaf bijna nul beginnen met alles wat een land nodig heeft — een eigen vlag, een eigen munt, en zelfs een eigen volkslied, geschreven door een groep studenten die er speciaal een wedstrijd voor hadden gewonnen."}, {"naam": "Afghanistan", "bestand": "Afghanistan", "continent": "AS", "tekst": "Afghanistan is al duizenden jaren een van de belangrijkste plekken ter wereld voor lapis lazuli, een prachtige diepblauwe edelsteen die nergens anders zo veel voorkomt. Deze steen werd al door oude Egyptische farao's gebruikt in sieraden en zelfs in het beroemde gouden masker van Toetanchamon. Mijnwerkers moesten de steen vroeger met de hand uit steile, afgelegen bergen halen, zonder machines. Kunstenaars malen de steen soms fijn tot pigment, om er felblauwe verf mee te maken die eeuwenlang zijn kleur behoudt. Zelfs beroemde schilders uit de renaissance gebruikten ooit verf gemaakt van Afghaanse lapis lazuli."}, {"naam": "Armenië", "bestand": "Armenie", "continent": "AS", "tekst": "Vanuit bijna de hele Armeense hoofdstad Jerevan zie je op heldere dagen de besneeuwde top van de Ararat opdoemen aan de horizon — een enorme, symbolische berg die voor Armeniërs ontzettend belangrijk is, ook al ligt de berg zelf tegenwoordig net over de grens in Turkije. Volgens een oud verhaal zou de berg de plek zijn waar de Ark van Noach ooit tot stilstand kwam na een grote overstroming. De berg staat zelfs afgebeeld op het nationale wapen van Armenië, ook al staat hij buiten de landsgrenzen. 's Ochtends vroeg, als de lucht helder is, kleurt de besneeuwde top soms roze door de opkomende zon. Voor veel Armeniërs is de berg een van de belangrijkste symbolen van hun cultuur."}, {"naam": "Azerbeidzjan", "bestand": "Azerbeidzjan", "continent": "AS", "tekst": "Azerbeidzjan betekent in sommige uitleggingen zelfs \"land van het vuur\", en dat is niet voor niets: op verschillende plekken in het land komt er van nature gas uit de grond, dat spontaan blijft branden — soms al honderden jaren onafgebroken! Op een berghelling genaamd Yanar Dag (\"brandende berg\") lekt er al decennialang gas uit de rotsen, waardoor er een muur van vlammen brandt, dag en nacht, zonder ooit uit te gaan. Vroeger dachten reizigers die dit zagen soms dat het een magische of heilige plek moest zijn. 's Nachts is de gloed van kilometers ver te zien in het donker. Het is een van de weinige plekken ter wereld waar de aarde zelf letterlijk lijkt te branden."}, {"naam": "Bangladesh", "bestand": "Bangladesh", "continent": "AS", "tekst": "In het zuiden van Bangladesh ligt de Sundarbans, het grootste mangrovebos ter wereld, waar de bomen half in zout water staan. Hier leven de beroemde Bengaalse tijgers, die in dit gebied zelfs uitstekend kunnen zwemmen tussen de eilandjes door — iets wat je van de meeste tijgers niet zou verwachten! Vissers en boswerkers dragen soms speciale maskers met een gezicht op hun achterhoofd, omdat tijgers hier vaak van achteren aanvallen en zo'n masker ze in verwarring zou kunnen brengen. Het bos verandert twee keer per dag mee met eb en vloed. Het is een van de laatste plekken ter wereld waar tijgers zich zo hebben aangepast aan water."}, {"naam": "Cambodja", "bestand": "Cambodja", "continent": "AS", "tekst": "In Cambodja ligt Angkor Wat, een van de grootste tempelcomplexen ter wereld, gebouwd zo'n 900 jaar geleden en groter dan sommige hele steden. Vlakbij ligt een andere tempel, Ta Prohm, waar de jungle in de loop der eeuwen letterlijk over de muren is heen gegroeid: enorme boomwortels, dikker dan een mens, kronkelen dwars door de stenen gangen en daken, alsof de natuur het gebouw langzaam opslokt. Filmmakers hebben deze tempel zelfs gebruikt als decor voor avonturenfilms. Restaurateurs laten sommige van die wortels expres staan, omdat ze inmiddels bij de tempel horen. Het oogt bijna alsof je een verloren stad in een sprookje binnenloopt."}, {"naam": "China", "bestand": "China", "continent": "AS", "tekst": "De Chinese Muur is zo lang, dat als je hem helemaal zou uitrollen, hij dwars over de aarde zou reiken — meer dan 21.000 kilometer aan muren, stukken en zijtakken bij elkaar! Hij werd niet in één keer gebouwd, maar door allerlei verschillende heersers, over wel tweeduizend jaar verspreid, steeds een stukje erbij. Sommige delen liggen zo hoog in de bergen dat het bouwmateriaal er met de hand omhoog gedragen moest worden. Toch is een populair fabeltje niet waar: je kunt de muur niet zomaar met het blote oog vanuit de ruimte zien. Astronauten moeten er echt goed voor turen! Het blijft wel een van de grootste bouwwerken die mensen ooit hebben gemaakt."}, {"naam": "Filipijnen", "bestand": "Filipijnen", "continent": "AS", "tekst": "De Filipijnen bestaan uit meer dan 7000 eilanden, en op bijna elk bewoond eiland vind je hetzelfde: karaoke! Zingen is er zó populair, dat veel gezinnen thuis een eigen karaokemachine hebben staan en het bijna een nationale sport is. Er bestaat zelfs een speciaal apparaat met een supergevoelige score-teller, die precies beoordeelt hoe goed je zong! Feestjes, verjaardagen en buurtbijeenkomsten draaien er vaak voor een groot deel om. Sommige Filipijnse zangers die
