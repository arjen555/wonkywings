begonnen met karaoke zijn later wereldberoemd geworden. Voor veel Filipijnen is een avond zonder microfoon bijna geen avond."}, {"naam": "Georgië", "bestand": "Georgie", "continent": "AS", "tekst": "In de bergen van Georgië, in een streek genaamd Svaneti, staan eeuwenoude stenen torens naast bijna elk huis, sommige wel duizend jaar oud en tientallen meters hoog. Vroeger dienden deze torens als schuilplaats bij gevaar of ruzies tussen families, en hele gezinnen konden zich er met hun bezittingen in verstoppen. Sommige dorpen liggen zo hoog en afgelegen in de bergen, dat ze 's winters soms wekenlang van de buitenwereld afgesloten zijn door de sneeuw. De torens steken opvallend boven de rest van het dorp uit, bijna als een klein kasteel. Het is een van de weinige plekken in Europa waar deze middeleeuwse torens nog in zulke aantallen bewaard zijn gebleven."}, {"naam": "India", "bestand": "India", "continent": "AS", "tekst": "De Taj Mahal, een van de beroemdste gebouwen ter wereld, werd gebouwd door een keizer die zoveel van zijn overleden vrouw hield, dat hij er meer dan twintig jaar aan liet bouwen als eerbetoon. Het gebouw is helemaal van wit marmer, en het bijzondere is dat het er 's ochtends roze uitziet, overdag stralend wit en 's avonds bij zonsondergang goudkleurig. Er werkten destijds meer dan 20.000 arbeiders en kunstenaars aan mee. Duizenden edelstenen zijn met de hand in de muren ingelegd. Het staat inmiddels bekend als een van de mooiste liefdesverhalen in steen ter wereld."}, {"naam": "Indonesië", "bestand": "Indonesie", "continent": "AS", "tekst": "Op een klein groepje Indonesische eilanden leeft de komodovaraan, de grootste hagedis ter wereld: hij kan wel drie meter lang worden, ongeveer zo lang als een kleine auto! Deze reuzenhagedis heeft een giftige beet, en jaagt vaak door gewoon geduldig te wachten tot een prooi dichtbij genoeg komt. Hij kan bovendien enorme stukken vlees in één keer doorslikken en dagenlang niets eten daarna. Vroeger dachten mensen dat het net een soort draak was, vandaar dat het eiland waar ze vooral leven \"Komodo\" heet. Er wonen nog maar een paar duizend van deze bijzondere dieren in het wild."}, {"naam": "Irak", "bestand": "Irak", "continent": "AS", "tekst": "In Irak, in het oude gebied dat vroeger Mesopotamië heette, bedachten mensen zo'n 5000 jaar geleden een van de allereerste schriftsystemen ter wereld: het spijkerschrift. Ze drukten met een puntig rietstokje kleine wigvormige tekentjes in natte kleitabletten, die daarna in de zon of oven hardbakten. Zo'n tablet kon dan duizenden jaren bewaard blijven — er zijn er nog steeds die archeologen tegenwoordig kunnen uitlezen! Vroeger gebruikten mensen dit schrift onder andere om handel, wetten en zelfs verhalen op te schrijven. Het is hierdoor een van de plekken waar de allereerste \"boeken\" ter wereld ontstonden."}, {"naam": "Iran", "bestand": "Iran", "continent": "AS", "tekst": "In het droge, hete Iran bedachten mensen al meer dan 2000 jaar geleden een geniale manier om ijs te maken en te bewaren, zonder elektriciteit: enorme, torenhoge kleikoepels genaamd \"yakhchāl\", die van buiten op piramides leken. Door slimme bouwtechnieken bleef het binnenin zelfs in de brandende woestijnzon onder het vriespunt, zodat er water tot ijs kon bevriezen en maandenlang bewaard bleef. Sommige van deze oude ijskoepels staan er nog steeds, duizenden jaren later. Vroeger reden karavanen soms dagenlang om ijs bij zo'n toren te halen. Het was een van de eerste \"koelkasten\" ter wereld, lang voordat er elektriciteit bestond."}, {"naam": "Japan", "bestand": "Japan", "continent": "AS", "tekst": "Japan ligt op een van de drukste plekken voor aardbevingen ter wereld — er gebeuren er duizenden per jaar, al voel je de meeste niet eens! Daarom hebben Japanse bouwers iets geniaals bedacht: wolkenkrabbers die expres een beetje mee mogen wiebelen bij een beving, in plaats van stijf blijven staan. Sommige gebouwen hangen zelfs op enorme rubberen kussens, zodat de grond onder je kan schudden terwijl het gebouw bijna stilstaat. Het is net alsof je torenflat op een grote trampoline balanceert! Ingenieurs testen dat met schudmachines die een complete aardbeving nadoen. Zo blijft iedereen veilig, zelfs als de aarde flink beeft."}, {"naam": "Jemen", "bestand": "Jemen", "continent": "AS", "tekst": "Voor de kust van Jemen ligt het eiland Socotra, zo geïsoleerd dat er planten en dieren leven die nergens anders ter wereld voorkomen. Het bekendste voorbeeld is de drakenbloedboom, die eruitziet als een omgekeerde paraplu en een rode, bloedkleurige hars afscheidt als je hem beschadigt — vandaar de naam! Doordat het eiland al miljoenen jaren van het vasteland gescheiden is, ontwikkelden planten en dieren zich er helemaal op hun eigen manier, waardoor het landschap er bijna buitenaards uitziet. Meer dan een derde van alle plantensoorten op het eiland groeit nergens anders op aarde. Sommige bomen zijn honderden jaren oud."}, {"naam": "Jordanië", "bestand": "Jordanie", "continent": "AS", "tekst": "Aan de rand van Jordanië ligt de Dode Zee, een van de zoutste wateren ter wereld — zo zout, dat je er vanzelf op blijft drijven, zelfs als je niet kunt zwemmen! Het water bevat zoveel zout en mineralen, dat er bijna geen vis of plant in kan leven, vandaar de naam. Mensen smeren er graag de zwarte modder van de bodem op hun huid, omdat die goed zou zijn voor je huid. De Dode Zee ligt bovendien op het laagste punt op het droge land van de hele aarde, ver onder zeeniveau. Drijven op je rug met een krant in je handen is er een populair kiekje voor toeristen."}, {"naam": "Kazachstan", "bestand": "Kazachstan", "continent": "AS", "tekst": "Diep in de lege vlaktes van Kazachstan ligt Baikonoer, 's werelds eerste en nog steeds een van de grootste ruimtehavens. Vanaf hier werd de allereerste mens ooit de ruimte in gelanceerd, en nog steeds vertrekken er raketten met astronauten naartoe het internationale ruimtestation. Bij een lancering schudt de grond kilometers in de omtrek, en het gebied eromheen wordt speciaal afgesloten voor veiligheid. Sommige afgedankte raketonderdelen komen na een lancering terug naar beneden in de verlaten steppe. Voor de lokale herders is het bijna een vertrouwd tafereel: een raket die met een enorme donder de lucht in schiet, boven de kale vlaktes waar normaal alleen kudden lopen."}, {"naam": "Laos", "bestand": "Laos", "continent": "AS", "tekst": "In een afgelegen deel van Laos ligt een gebied met duizenden enorme stenen kruiken verspreid over de heuvels, sommige zo groot als een compleet vat, gemaakt meer dan 2000 jaar geleden. Niemand weet precies waarom ze daar staan of wat ze vroeger precies gebruikt werden, al vermoeden onderzoekers dat ze te maken hadden met oude begrafenisrituelen. Het gebied heet daarom simpelweg de \"Vlakte der Kruiken\". Sommige kruiken wegen wel duizenden kilo's, en niemand weet zeker hoe mensen ze daar toen naartoe hebben gekregen zonder machines. Bezoekers mogen alleen over vaste, veilige paadjes lopen, omdat er in de grond nog steeds onontplofte bommen liggen uit een oorlog van lang geleden. Het is een van de grootste mysteries van Zuidoost-Azië."}, {"naam": "Maleisië", "bestand": "Maleisie", "continent": "AS", "tekst": "Maleisië is een van de weinige landen die in twee delen uit elkaar ligt, met honderden kilometers zee ertussen: een deel op het vasteland van Azië, en een deel op het eiland Borneo. Op het Borneo-deel liggen enorme, oeroude regenwouden die al miljoenen jaren bestaan — ouder dan het Amazonewoud! Daar leven ook orang-oetans in het wild, apen die bijna hun hele leven hoog in de bomen doorbrengen en zelfs slaapnestjes van bladeren bouwen. Er zijn speciale opvangcentra waar verdwaalde baby-orang-oetans weer leren klimmen voordat ze terug de jungle in mogen. Voor de rest van de wereld is dit een van de laatste plekken waar deze bijzondere apen nog vrij leven."}, {"naam": "Mongolië", "bestand": "Mongolie", "continent": "AS", "tekst": "In Mongolië zijn er bijna evenveel paarden als mensen, en veel kinderen leren al paardrijden voordat ze goed kunnen lopen! Een groot deel van de Mongolen woont niet in gewone huizen, maar in ronde, verplaatsbare tenten genaamd ger's, die je in een paar uur kunt op- en afbreken. Zo kunnen families makkelijk verhuizen met hun kuddes vee, op zoek naar goed gras. Elke zomer is er een groot feest met paardenraces, worstelwedstrijden en boogschieten, waar hele families samen op af komen. Sommige paardenraces gaan over tientallen kilometers, gereden door kinderen van maar een jaar of zeven!"}, {"naam": "Myanmar", "bestand": "Myanmar", "continent": "AS", "tekst": "Op het Inlemeer in Myanmar wonen vissers die op een heel bijzondere manier varen: ze roeien niet met hun armen, maar staan rechtop in hun bootje en peddelen met één been om hun handen vrij te houden voor het vissen! Ze balanceren daarbij op het puntje van de boot, wat er bijna uit ziet als een soort dansje. Rondom het meer bouwen mensen hun huizen op palen boven het water, en er drijven zelfs hele moestuinen op het meer. Kinderen leren dit bijzondere roeien al van jongs af aan. Het is een techniek die je nergens anders ter wereld ziet."}, {"naam": "Nepal", "bestand": "Nepal", "continent": "AS", "tekst": "In Nepal ligt de Mount Everest, de hoogste berg ter wereld — zo hoog dat vliegtuigen er vroeger soms bijna overheen moesten scheren! Boven op de top is er zo weinig zuurstof, dat de meeste klimmers extra zuurstofflessen meenemen om te kunnen ademen. De lokale Sherpa-bevolking kent de berg als geen ander en begeleidt al generaties lang klimmers naar de top; sommige Sherpa's hebben de Everest al tientallen keren beklommen. Onderweg naar boven kom je langs kleurrijke gebedsvlaggetjes die in de wind wapperen. Het duurt normaal gesproken wel twee maanden om helemaal naar de top en weer terug te komen."}, {"naam": "Noord-Korea", "bestand": "Noord-Korea", "continent": "AS", "tekst": "In Noord-Korea zie je op bijna elke straathoek dezelfde paar gezichten: die van de huidige leider Kim Jong-un en zijn vader en grootvader, die er vroeger de baas waren. Elk huis is zelfs verplicht om portretten van hen aan de muur te hangen, netjes en schoongehouden, want daar wordt streng op gecontroleerd. Op school leren kinderen al jong liedjes en verhalen waarin deze leiders worden voorgesteld als bijna bovenmenselijke helden. Er staan door het hele land enorme standbeelden van hen, sommige wel twintig meter hoog, waar mensen bij belangrijke gelegenheden bloemen neerleggen. Zelfs in metrostations en op pleinen kom je hun beeltenis tegen. Zo groeit iedereen op met het gevoel dat deze leiders overal bij horen."}, {"naam": "Oezbekistan", "bestand": "Oezbekistan", "continent": "AS", "tekst": "Oezbekistan grenst aan wat ooit het Aralmeer was, één van de grootste meren ter wereld — totdat het bijna helemaal verdween. Rivieren die het meer voedden, werden decennialang gebruikt om enorme katoenvelden te bevloeien, waardoor het water steeds verder terugtrok. Op de plek waar ooit water stond, liggen nu kilometers verlaten woestijn, met roestige scheepswrakken die eenzaam midden in het zand liggen — schepen die ooit voeren, maar nu ver van enig water vastzitten. Het is een van de grootste milieurampen ooit door mensen veroorzaakt. Sommige mensen komen speciaal kijken naar deze vreemde, spookachtige scheepskerkhoven."}, {"naam": "Oman", "bestand": "Oman", "continent": "AS", "tekst": "In de bergen van Oman ligt een enorme, droge kloof genaamd Wadi Ghul, ook wel de \"Grand Canyon van Arabië\" genoemd, met steile rotswanden die honderden meters diep uitgehouwen zijn door water dat er ooit doorheen stroomde. Tegenwoordig staat er bijna nooit meer water in, behalve na hevige regenbuien, wanneer het plots verandert in een kolkende rivier. Rondom de kloof liggen kleine bergdorpjes die al eeuwen op de rand van de afgrond gebouwd zijn. Wandelaars lopen er over smalle bergpaadjes met duizelingwekkend uitzicht naar beneden. Het is een van de meest indrukwekkende natuurlijke landschappen van het Arabisch Schiereiland."}, {"naam": "Pakistan", "bestand": "Pakistan", "continent": "AS", "tekst": "Tussen Pakistan en China loopt de Karakoram Highway, een van de hoogste verharde wegen ter wereld, die dwars door enorme besneeuwde bergen kronkelt op soms wel 4700 meter hoogte. Onderweg passeer je een aantal van de hoogste bergen ter wereld, waaronder de op één na hoogste berg van de aarde, de K2. De weg werd met man en macht gebouwd, deels met de hand, dwars door steile rotswanden en over ravijnen. Op sommige plekken is de weg zo smal, dat vrachtwagens elkaar nauwelijks kunnen passeren. Voor veel reizigers is het een van de meest adembenemende, maar ook spannendste routes ter wereld."}, {"naam": "Saoedi-Arabië", "bestand": "Saoedi-Arabie", "continent": "AS", "tekst": "In Saoedi-Arabië ligt de Rub al-Khali, ook wel \"het Lege Kwartier\" genoemd, de grootste aaneengesloten zandwoestijn ter wereld — zo groot als heel Frankrijk! Sommige zandduinen zijn er meer dan 250 meter hoog, hoger dan de meeste wolkenkrabbers. Het is er overdag bloedheet, maar 's nachts kan het verrassend koud worden, omdat zand warmte niet goed vasthoudt. Bedoeïenen, mensen die er al eeuwen wonen, weten precies hoe ze in dit barre gebied kunnen overleven, met kamelen als belangrijkste vervoermiddel. Delen van deze enorme woestijn zijn nog steeds nooit door mensen doorkruist."}, {"naam": "Sri Lanka", "bestand": "Sri_Lanka", "continent": "AS", "tekst": "Op de groene heuvels van Sri Lanka groeit een groot deel van de thee die in de hele wereld gedronken wordt, op steile hellingen die eruitzien als groene trappen. Plukkers lopen er de hele dag rond met grote manden op hun rug, vastgemaakt met een band om hun voorhoofd, om alleen de allerbovenste blaadjes te plukken — want daar zit de beste smaak in. Er rijdt ook een beroemd treintje dwars door deze theevelden, over smalle bruggen en langs enorme afgronden, met een van de mooiste uitzichten ter wereld als bonus. Toeristen hangen soms letterlijk uit de deuropening om foto's te maken. Sommige theevelden liggen zo hoog dat het er 's ochtends flink kan mistten!"}, {"naam": "Syrië", "bestand": "Syrie", "continent": "AS", "tekst": "Diep onder de grond in Syrië liggen complete, eeuwenoude ondergrondse steden, met tientallen kilometers aan gangen, kamers en zelfs kerken, allemaal uitgehouwen in zachte rots. Mensen bouwden ze duizenden jaren geleden als schuilplaats, waar hele gemeenschappen zich soms wekenlang konden verstoppen met voedsel en water, compleet met ventilatieschachten voor frisse lucht. Sommige van deze ondergrondse steden konden wel duizenden mensen tegelijk herbergen. De gangen zijn zo ingewikkeld aangelegd, dat je er zonder gids makkelijk zou verdwalen. Archeologen ontdekken nog steeds nieuwe delen van deze verborgen wereld onder de grond."}, {"naam": "Taiwan", "bestand": "Taiwan", "continent": "AS", "tekst": "Bijna elk apparaat met een chip erin — telefoons, laptops, spelcomputers — heeft waarschijnlijk een onderdeeltje uit Taiwan, want daar staat 's werelds belangrijkste fabriek voor computerchips. Deze chips zijn zó klein en precies gemaakt, dat de fabrieken stofvrijer moeten zijn dan een ziekenhuis: werknemers dragen speciale pakken om zelfs de kleinste stofdeeltjes buiten te houden. Eén chip kan wel duizenden dunne laagjes bevatten, dunner dan een haartje! Zonder Taiwan zouden veel gadgets over de hele wereld gewoon niet gemaakt kunnen worden. Het is een van de best bewaarde technologie-geheimen ter wereld."}, {"naam": "Thailand", "bestand": "Thailand", "continent": "AS", "tekst": "Thailand wordt vaak \"het land van de glimlach\" genoemd, omdat vriendelijkheid en beleefdheid er ontzettend belangrijk zijn. In plaats van een handdruk begroet men elkaar met de \"wai\": een kleine buiging met de handen tegen elkaar, bijna als bidden, waarbij hoe hoger de handen, hoe meer respect je toont. Zelfs koningen en monniken krijgen een speciale, diepere wai. Op straat en in winkels zie je bijna overal mensen glimlachen, ook als het druk of chaotisch is. Voor Thai is een glimlach een manier om verlegenheid, dankbaarheid én zelfs excuses te tonen — allemaal met hetzelfde gebaar!"}, {"naam": "Turkije", "bestand": "Turkije", "continent": "AS", "tekst": "In het Turkse gebied Cappadocië staan vreemde, kegelvormige rotsformaties, die eeuwenlang door mensen zijn uitgehold tot complete woningen, kerken en zelfs hele ondergrondse steden. Sommige van deze ondergrondse steden gaan wel acht verdiepingen diep de grond in, met tunnels waar duizenden mensen zich vroeger konden verstoppen bij gevaar. Vandaag de dag varen er elke ochtend tientallen kleurrijke luchtballonnen over dit bizarre landschap, wat het een van de meest fotogenieke plekken ter wereld maakt. Sommige mensen wonen zelfs nu nog in comfortabel ingerichte grotwoningen. Het landschap ziet er bijna uit als een decor van een andere planeet."}, {"naam": "Turkmenistan", "bestand": "Turkmenistan", "continent": "AS", "tekst": "In de woestijn van Turkmenistan brandt al meer dan vijftig jaar een enorme krater vol vuur, bijgenaamd \"De Poort naar de Hel\". Hij ontstond toen onderzoekers per ongeluk een gasveld lieten instorten en besloten het gas aan te steken om te voorkomen dat het zich zou verspreiden — maar het vuur is sindsdien nooit meer uitgegaan! 's Nachts is de gloed van kilometers ver te zien in de donkere woestijn, alsof er een stukje van de aarde constant blijft smeulen. Toeristen kamperen soms vlakbij om het spektakel te bekijken. Niemand weet zeker wanneer het vuur ooit vanzelf zal doven."}, {"naam": "Verenigde Arabische Emiraten", "bestand": "Verenigde_Arabische_Emiraten", "continent": "AS", "tekst": "Nog geen honderd jaar geleden was Dubai, nu een van de VAE's beroemdste steden, vooral een klein vissersdorp in de woestijn, waar mensen leefden van parelvissen en handel. Tegenwoordig staat er de hoogste toren ter wereld, zo hoog dat je vanaf de bovenste verdieping soms de zonsondergang wel twee keer kunt zien — omdat de zon eerst beneden ondergaat, en dan nog even zichtbaar blijft als je snel genoeg omhoog gaat! Binnen enkele decennia veranderde de stad van zandvlakte naar futuristische skyline vol glazen torens. Er liggen zelfs kunstmatige eilanden in zee, gevormd als palmbomen, die je vanuit de lucht duidelijk kunt herkennen. Weinig plekken ter wereld zijn ooit zo snel veranderd."}, {"naam": "Vietnam", "bestand": "Vietnam", "continent": "AS", "tekst": "In Vietnamese steden zoals Hanoi en Ho Chi Minhstad zie je overal bromfietsen — miljoenen tegelijk, in drukke, kriskras rijdende zwermen die door elkaar heen gaan zonder al te veel duidelijke regels. Hele gezinnen passen soms met z'n vieren op één brommertje, en er wordt van alles vervoerd: kratten vol kippen, bergen groente, zelfs meubels! Om over te steken als voetganger moet je vaak gewoon rustig doorlopen, zodat de bromfietsen om je heen kunnen zwenken. Het lijkt chaotisch, maar het werkt eigenlijk verrassend soepel. Voor bezoekers is oversteken in Vietnam een hele ervaring op zich!"}, {"naam": "Zuid-Korea", "bestand": "Zuid-Korea", "continent": "AS", "tekst": "In Zuid-Korea kun je 's nachts hele wijken vinden die stampvol zitten met studieruimtes die 24 uur per dag open zijn! Veel leerlingen gaan daar na school nog uren extra leren, soms tot diep in de nacht, omdat een goede score op hun grote eindexamen enorm belangrijk wordt gevonden. Op de examendag zelf is het land bijna in rep en roer: vliegtuigen mogen even niet opstijgen tijdens het luisterexamen, en de politie brengt leerlingen die te laat dreigen te zijn met sirene aan naar school! Winkels en bedrijven openen zelfs later, zodat het extra stil is. Zoveel drukte om één ochtend examen!"}, {"naam": "Bahrein", "bestand": "Bahrein", "continent": "AS", "tekst": "Midden in de kale woestijn van Bahrein staat een eenzame boom die al honderden jaren overleeft, zonder dat iemand precies weet waar hij zijn water vandaan haalt — er is in de wijde omtrek geen rivier of bron te bekennen! De boom staat bekend als \"de Boom van het Leven\" en is uitgegroeid tot een van de grootste mysteries en toeristische trekpleisters van het land. Sommige mensen denken dat de wortels heel diep onder de grond een verborgen waterbron hebben gevonden. Anderen vertellen er verhalen over dat het de plek zou zijn geweest van de bijbelse Hof van Eden. Bezoekers rijden er speciaal doorheen de woestijn naartoe om de boom met eigen ogen te zien."}, {"naam": "Bhutan", "bestand": "Bhutan", "continent": "AS", "tekst": "Bhutan is het enige land ter wereld dat officieel \"Bruto Nationaal Geluk\" meet in plaats van alleen hoeveel geld het land verdient. De regering kijkt dus net zo goed naar hoe blij en gezond de mensen zijn als naar economische cijfers! Het land ligt hoog weggestopt in de Himalaya, tussen enorme besneeuwde bergtoppen, wat het extra bijzonder maakt. Ook opvallend: Bhutan is een van de weinige landen die meer bos plant dan het kapt, en in de wet staat zelfs dat minstens 60% van het land bebost moet blijven. Toeristen mogen niet zomaar overal komen; er geldt een speciale dagelijkse toeristenbijdrage om het land te beschermen tegen te veel bezoekers. Bhutan probeert zo bewust anders te zijn dan de meeste landen."}, {"naam": "Brunei", "bestand": "Brunei", "continent": "AS", "tekst": "In Brunei woont de sultan in een van de grootste woonpaleizen ter wereld, met bijna 1800 kamers en gouden koepels die in de zon schitteren. Het land is rijk geworden dankzij enorme voorraden olie en aardgas onder de grond, wat betekent dat de meeste Bruneiers geen belasting hoeven te betalen en gratis onderwijs en zorg krijgen. Eén keer per jaar, tijdens een groot islamitisch feest, mag iedereen die dat wil het paleis bezoeken en de sultan persoonlijk de hand schudden — soms staan er dan rijen van duizenden mensen! Het paleis heeft zelfs een eigen binnenmoskee met plek voor duizenden gelovigen. Het is een van de weinige plekken ter wereld waar een sultan nog echt in zo'n weelde regeert."}, {"naam": "Kirgistan", "bestand": "Kirgistan", "continent": "AS", "tekst": "In Kirgistan wordt al eeuwenlang gejaagd met getrainde steenarenden, enorme roofvogels die op het gebied van hun baasje leren jagen op vossen en hazen. Jagers dragen de arenden op hun arm, beschermd door een dikke leren handschoen, want zo'n vogel kan wel zes kilo wegen! De vogels worden vaak als jong uit het nest gehaald en jarenlang getraind, en groeien bijna uit tot familielid. Er wordt zelfs een groot jaarlijks festival gehouden waar jagers met hun arenden pronken en wedstrijden houden. Voor veel Kirgizische families gaat deze traditie al honderden jaren over van vader op zoon."}, {"naam": "Koeweit", "bestand": "Koeweit", "continent": "AS", "tekst": "Omdat er in Koeweit bijna geen rivieren of natuurlijke drinkwaterbronnen zijn, haalt het land het meeste drinkwater uit de zee: enorme fabrieken halen er dag en nacht het zout uit, zodat er water overblijft dat je gewoon kunt drinken. Koeweit was zelfs een van de eerste landen ter wereld die op zo'n grote schaal zeewater ging ontzilten. Zonder deze fabrieken zou er in het land bijna geen drinkbaar water beschikbaar zijn. Het kost ontzettend veel energie om al dat zoute water om te zetten in zoet water. Voor de inwoners van Koeweit is een glas kraanwater dus eigenlijk een klein technisch wonder."}, {"naam": "Libanon", "bestand": "Libanon", "continent": "AS", "tekst": "In het Libanese Baalbek staan enkele van de grootste, best bewaarde Romeinse tempelzuilen ter wereld, sommige wel 20 meter hoog. Nog bijzonderder: er liggen daar drie van de grootste bewerkte stenen blokken die mensen ooit hebben verplaatst, elk wel duizenden tonnen zwaar — zwaarder dan een compleet passagiersvliegtuig! Niemand weet precies hoe mensen duizenden jaren geleden, zonder machines, zulke enorme stenen blokken hebben kunnen verslepen en optillen. Archeologen buigen zich er nog steeds over. Het maakt Baalbek een van de grootste bouwmysteries uit de oudheid."}, {"naam": "Maldiven", "bestand": "Maldiven", "continent": "AS", "tekst": "De Malediven bestaan uit meer dan duizend piepkleine koraaleilandjes, en het hoogste punt van het hele land ligt maar zo'n twee en een halve meter boven zeeniveau — daarmee is het het laagst gelegen land ter wereld! Doordat de zeespiegel langzaam stijgt, is de regering bang dat een deel van het land over honderd jaar helemaal onder water kan verdwijnen. Er wordt daarom al geëxperimenteerd met drijvende eilanden en gebouwen die met het water mee omhoog kunnen bewegen. Sommige regeringsvergaderingen zijn zelfs ooit onder water gehouden, met duikpakken aan, om de wereld te laten zien hoe serieus het probleem is. Voor de Malediven is de zee dus niet alleen prachtig, maar ook een beetje eng."}, {"naam": "Oost-Timor", "bestand": "Oost-Timor", "continent": "AS", "tekst": "Volgens een oud verhaal uit Oost-Timor is het hele eiland ooit ontstaan uit een enorme krokodil, die uitgroeide tot het land waar mensen op gingen wonen — vandaar dat het eiland op de kaart een beetje krokodilvormig lijkt! Krokodillen worden er daarom nog steeds gezien als heilige, beschermde dieren in plaats van gevaarlijke roofdieren. In sommige dorpen geloven mensen zelfs dat het doden van een krokodil ongeluk brengt. Het land zelf ligt vol met steile, groene bergen en verstopte watervallen. Voor veel Oost-Timorezen is dit verhaal nog steeds een belangrijk deel van hun cultuur."}, {"naam": "Palestina", "bestand": "Palestina", "continent": "AS", "tekst": "In Jericho, een stad op de Westelijke Jordaanoever, wonen al zo'n 11.000 jaar onafgebroken mensen — daarmee geldt het als een van de oudste, misschien wel dé oudste, nog steeds bewoonde stad ter wereld! Archeologen vonden er resten van muren en torens die duizenden jaren ouder zijn dan de piramides van Egypte. De stad ligt bovendien extreem laag, zo'n 250 meter onder zeeniveau, wat het een van de laagst gelegen steden op aarde maakt. Door al die eeuwen heen bouwden mensen er steeds weer bovenop de resten van eerdere bewoners. Onder de grond liggen daardoor als het ware laagjes geschiedenis op elkaar gestapeld."}, {"naam": "Qatar", "bestand": "Qatar", "continent": "AS", "tekst": "Qatar is een van de kleinste landen van Azië, maar tegelijk een van de rijkste landen ter wereld per inwoner, dankzij enorme voorraden aardgas onder de grond en zee. Onder de bodem van Qatar en de zee eromheen ligt een van de grootste aardgasvelden ter wereld, gedeeld met het buurland Iran. Met dat geld bouwde het land in razend tempo indrukwekkende wolkenkrabbers, musea en zelfs complete kunstmatige eilanden. Voor de bouw van een groot wereldkampioenschap voetbal werden er zelfs compleet nieuwe steden en stadions uit de grond gestampt. Het is een van de snelst veranderde landen van de afgelopen decennia."}, {"naam": "Singapore", "bestand": "Singapore", "continent": "AS", "tekst": "Singapore is berucht om zijn strenge regels — kauwgom verkopen is er zelfs verboden! — maar minstens zo bijzonder is hoe de stad omgaat met regen: overal staan enorme, kunstmatige \"superbomen\", tientallen meters hoog, die regenwater opvangen en helpen bij het afkoelen van de stad. Ze lichten 's avonds op in felle kleuren en vormen samen een compleet park hoog in de lucht, met loopbruggen ertussen. Ondanks dat het een van de dichtstbevolkte landen ter wereld is, is meer dan de helft van de stad bedekt met groen — parken, daktuinen en verticale planten tegen gebouwen. Singapore wil zo een \"stad in een tuin\" zijn in plaats van andersom."}, {"naam": "Tadzjikistan", "bestand": "Tadzjikistan", "continent": "AS", "tekst": "Tadzjikistan is een van de meest bergachtige landen ter wereld: meer dan 90% van het land bestaat uit bergen, met imposante bergketens die \"het dak van de wereld\" worden genoemd. Een van de gletsjers daar, de Fedtsjenkogletsjer, is een van de langste gletsjers buiten de poolgebieden — hij is wel 77 kilometer lang, langer dan de afstand tussen sommige hele steden! Op sommige plekken liggen dorpen zo hoog en afgelegen in de bergen, dat je er alleen te voet of te paard kunt komen. 's Winters raken sommige bergdorpen soms wekenlang afgesloten door de sneeuw. Toch wonen er al eeuwenlang mensen tussen deze reusachtige toppen."}, {"naam": "Canada", "bestand": "Canada", "continent": "NA", "tekst": "Canada is het op één na grootste land ter wereld — maar er wonen minder mensen dan in Nederland en België samen! Het land staat bekend om zijn eindeloze bossen, meren en de esdoornblad-vlag. Canadezen zijn dol op ijshockey, dat is er zo ongeveer de nationale sport. Overal kun je beren, elanden en zelfs ijsberen tegenkomen. En in de herfst kleuren de esdoornbossen prachtig rood en oranje — daar komt die ahornsiroop trouwens ook vandaan!"}, {"naam": "Costa Rica", "bestand": "Costa_Rica", "continent": "NA", "tekst": "Costa Rica heeft geen leger — dat schafte het land in 1948 helemaal af, als een van de weinige landen ter wereld! Al het geld dat andere landen aan tanks en wapens uitgeven, stopt Costa Rica liever in natuur, scholen en ziekenhuizen. Misschien komt het daardoor dat Costa Rica nu een van de groenste landen ter wereld is: meer dan een kwart van het land is beschermd natuurgebied, vol brulapen, luiaards en felgekleurde kikkers. Het is ook een van de gelukkigste landen ter wereld volgens onderzoeken — Costa Ricanen hebben er zelfs een woord voor: \"pura vida\", ofwel \"puur leven\"."}, {"naam": "Cuba", "bestand": "Cuba", "continent": "NA", "tekst": "Op straat in Cuba zie je iets wat je bijna nergens anders meer ziet: glimmende auto's uit de jaren '50, in felle kleuren zoals roze, turquoise en geel, die nog steeds gewoon rondrijden! Dat komt doordat Cuba decennialang bijna geen nieuwe auto's uit Amerika mocht importeren, dus Cubanen hielden hun oude Amerikaanse auto's jarenlang zelf aan de praat — met zelfgemaakte onderdelen en heel veel vindingrijkheid. Voor Cubanen zijn het gewoon auto's, maar toeristen komen van over de hele wereld om foto's te maken van deze rijdende tijdcapsules."}, {"naam": "Dominicaanse Republiek", "bestand": "Dominicaanse_Republiek", "continent": "NA", "tekst": "In de Dominicaanse Republiek werd ooit het beroemdste dinosaurus-boek-én-filmmateriaal ter wereld geïnspireerd: barnsteen! In de mijnen van het land vinden mensen al eeuwenlang stukjes gefossiliseerde boomhars waarin insecten, en soms zelfs kleine hagedisjes, miljoenen jaren geleden gevangen zijn geraakt en perfect bewaard bleven. Dat idee — een insect gevangen in barnsteen met daarin oud DNA — was de inspiratie voor het verhaal van Jurassic Park! Dominicaanse barnsteen is ook nog eens bijzonder omdat het soms een blauwe gloed heeft, iets wat bijna nergens anders ter wereld voorkomt."}, {"naam": "Groenland", "bestand": "Groenland", "continent": "NA", "tekst": "Groenland is het grootste eiland ter wereld, maar er wonen minder mensen op dan in een gemiddelde Nederlandse stad — nog geen 60.000! Bijna het hele eiland, wel 80 procent, ligt onder een enorme ijskap die op sommige plekken meer dan 3 kilometer dik is. Als deze ijskap ooit helemaal zou smelten, zou de zeespiegel wereldwijd wel 7 meter stijgen — genoeg om hele kuststeden onder water te zetten. Verrassend genoeg is Groenland ook helemaal niet zo groen als de naam doet vermoeden: een Vikingontdekker gaf het die naam ooit expres, in de hoop dat het meer mensen zou lokken om er te komen wonen!"}, {"naam": "Guatemala", "bestand": "Guatemala", "continent": "NA", "tekst": "Diep in het regenwoud van Guatemala ligt Tikal, een oude Maya-stad met torenhoge stenen piramides die eeuwenlang verborgen lagen onder de jungle. Toen ontdekkingsreizigers de piramides eindelijk vonden, waren ze zo overwoekerd door bomen en planten dat het wel enorme groene heuvels leken — niemand had door dat er gebouwen onder zaten! Vanaf de top van de hoogste piramide, wel 65 meter hoog, kijk je uit over een zee van jungle zo ver als je kunt kijken. In de film Star Wars is Tikal zelfs te zien als de rebellenbasis op de maan Yavin 4!"}, {"naam": "Haïti", "bestand": "Haiti", "continent": "NA", "tekst": "Haïti was het eerste land ter wereld waar tot slaaf gemaakte mensen zich met succes bevrijdden en een eigen onafhankelijk land oprichtten — in 1804, na een lange en zware opstand tegen de Franse kolonisten. Het is de eerste zwarte republiek ter wereld en het tweede onafhankelijke land van heel Amerika, vlak na de Verenigde Staten. De vrijheidsstrijders die dit voor elkaar kregen, worden in Haïti nog steeds gevierd als helden, en hun verhaal wordt op scholen verteld als een van de dapperste opstanden uit de geschiedenis."}, {"naam": "Honduras", "bestand": "Honduras", "continent": "NA", "tekst": "Voor de kust van Honduras, bij de Bay Islands, kun je zwemmen met de grootste vis ter wereld: de walvishaai. Ondanks zijn enorme naam en lengte tot wel 12 meter is dit reuzenbeest hartstikke ongevaarlijk voor mensen — hij eet alleen piepklein plankton, dat hij met zijn enorme bek uit het water zeeft. Duikers uit de hele wereld komen naar Honduras in de hoop deze gigantische, gespikkelde vis van dichtbij te zien zwemmen. Het is net of je naast een gevlekte onderzeeër zwemt!"}, {"naam": "Mexico", "bestand": "Mexico", "continent": "NA", "tekst": "Diep in het Mexicaanse regenwoud, bij de oude Maya-piramide van Chichén Itzá, gebeurt er iets bijzonders — maar alleen twee keer per jaar. Op de eerste lentedag en de eerste herfstdag valt het zonlicht precies zo op de trappen van de piramide, dat er een schaduw ontstaat die eruitziet als een kronkelende slang die naar beneden kruipt! De Maya's bouwden dit meer dan duizend jaar geleden al zo, zonder computers of meetapparatuur — puur door de zon en de sterren heel goed te bestuderen. Elk jaar komen er duizenden mensen speciaal hiervoor naar Mexico om het te zien gebeuren."}, {"naam": "Nicaragua", "bestand": "Nicaragua", "continent": "NA", "tekst": "In het grootste meer van Nicaragua, het Nicaraguameer, zwemt een dier dat je normaal alleen in de oceaan verwacht: haaien! De Nicaragua-haai wist zich eeuwen geleden aan te passen aan zoet water in plaats van zout, iets wat bijna geen enkele andere haaiensoort ter wereld kan. Lange tijd dachten wetenschappers dat het een aparte soort was, tot bleek dat het gewoon stierhaaien zijn die stroomopwaarts een rivier op zwommen en zich in het meer settelden. Vissers en zwemmers in het meer weten het inmiddels goed: dit is een van de weinige plekken ter wereld waar je tussen haaien kunt zwemmen, ver van de zee!"}, {"naam": "Panama", "bestand": "Panama", "continent": "NA", "tekst": "Bij het Panamakanaal gebeurt iets wat nergens anders ter wereld kan: een schip vaart aan de ene kant de Atlantische Oceaan in en komt er een paar uur later aan de andere kant weer uit in de Grote Oceaan! Het kanaal werkt met enorme sluizen, badkuipen zo groot als voetbalvelden, die het schip stukje bij beetje omhoog en weer omlaag tillen over de heuvels van Panama heen. Er werkten meer dan 75.000 mensen aan de bouw, en het kostte zoveel moeite dat het wel \"een van de grootste technische huzarenstukjes ooit\" wordt genoemd. Het was ook zwaar en gevaarlijk werk: door ziektes zoals malaria en gele koorts, en door ongelukken, kwamen er in totaal naar schatting zo'n 25.000 arbeiders om het leven tijdens de bouw. Nog steeds varen er elke dag zo'n 35 schepen door het kanaal, sommige zo groot dat ze maar net tussen de wanden passen!"}, {"naam": "Verenigde Staten", "bestand": "Verenigde_Staten", "continent": "NA", "tekst": "De Verenigde Staten bestaat uit 50 staten, van het zonnige Californië tot het besneeuwde Alaska. Het land heeft beroemde plekken zoals het Vrijheidsbeeld, de Grand Canyon en Hollywood. Amerikanen vieren op 4 juli hun onafhankelijkheidsdag met vuurwerk en barbecues. De VS heeft ook Hawaï, een groep tropische eilanden midden in de Grote Oceaan, ver van het vasteland. Er wonen meer dan 330 miljoen mensen — bijna 20 keer zoveel als in Nederland! En het land bracht ons dingen als de hamburger, jazzmuziek en de eerste mens op de maan."}, {"naam": "Antigua en Barbuda", "bestand": "Antigua_en_Barbuda", "continent": "NA", "tekst": "Antigua heeft een strand voor elke dag van het jaar — letterlijk 365 stuks, één voor elke dag! Dat komt door de grillige, ingedeukte kustlijn van het eiland, vol kleine baaien en inhammen, elk met hun eigen stukje wit zand. Sommige stranden zijn zo verstopt dat je er alleen per boot kunt komen, en nergens hoef je twee keer hetzelfde strand te bezoeken als je er een heel jaar zou blijven!"}, {"naam": "Bahama's", "bestand": "Bahamas", "continent": "NA", "tekst": "Bij de Bahama's ligt een strand dat er niet wit, maar knalroze uitziet: Pink Sands Beach op het eiland Harbour Island. Het roze komt van piepkleine, verpulverde schelpjes van een organisme genaamd foraminifera, dat een rode kleurstof afgeeft — vermengd met het witte zand kleurt het hele strand daardoor zachtroze, vooral bij vloed. Toeristen komen van over de hele wereld om met hun eigen ogen te zien of het echt zo roze is als op de foto's — en dat is het!"}, {"naam": "Barbados", "bestand": "Barbados", "continent": "NA", "tekst": "Barbados is het geboorteland van de wereldberoemde zangeres Rihanna — en de trots daarover is zo groot dat ze er officieel is uitgeroepen tot nationale heldin van het land, met een speciale plechtigheid en een eigen titel! Op het eiland zie je haar naam en gezicht overal terug, van muurschilderingen tot souvenirwinkels. Barbados is ook het enige land ter wereld dat ooit alleen door Engeland is gekoloniseerd (nooit door een ander land geregeerd), waardoor je er cricket speelt zoals in Engeland, maar met een tropische twist."}, {"naam": "Belize", "bestand": "Belize", "continent": "NA", "tekst": "Voor de kust van Belize ligt een gat in de zee dat je met geen mogelijkheid kunt missen: het Great Blue Hole, een bijna perfect ronde, diepblauwe cirkel midden in helderturquoise water, wel 300 meter breed en 124 meter diep. Het is eigenlijk een ingestorte grot uit de tijd dat er nog geen zee was — de grot vulde zich met water toen de zeespiegel steeg. Vanuit de lucht lijkt het net een enorm blauw oog dat naar de hemel staart. De bekende duiker Jacques Cousteau noemde het ooit een van de beste duikplekken ter wereld, en duikers zwemmen er nu tussen haaien en oeroude druipsteenformaties diep onder water."}, {"naam": "Dominica", "bestand": "Dominica", "continent": "NA", "tekst": "Dominica noemt zichzelf trots het \"Natuureiland van het Caribisch gebied\" — en met reden: het eiland heeft bijna 365 rivieren, letterlijk één voor elke dag van het jaar! Het is bergachtig, groen en vulkanisch, met kokende modderpoelen en een meer dat letterlijk Boiling Lake heet: een meer met water dat constant zachtjes kookt door de vulkanische hitte eronder, het op één na grootste kokende meer ter wereld."}, {"naam": "El Salvador", "bestand": "El_Salvador", "continent": "NA", "tekst": "El Salvador is het kleinste land van Midden-Amerika, maar het heeft wel meer dan 20 vulkanen binnen zijn grenzen! Een van die vulkanen, de Izalco, spuwde honderden jaren lang zó vaak vuur en gloeiende lava dat zeilschepen op zee 's nachts het licht ervan gebruikten om hun weg te vinden — daarom kreeg hij de bijnaam \"Vuurtoren van de Grote Oceaan\". Tegenwoordig is de vulkaan rustig, en je kunt zelfs naar de top wandelen om in de oude krater te kijken."}, {"naam": "Grenada", "bestand": "Grenada", "continent": "NA", "tekst": "Voor de kust van Grenada ligt een bijzonder onderwatermuseum: een verzameling levensgrote standbeelden van mensen, diep onder water op de zeebodem geplaatst. De beelden zijn met opzet zo gemaakt dat koraal en zeewier erop kunnen groeien, waardoor ze langzaam veranderen in levende, kleurrijke kunstwerken vol vissen die er tussendoor zwemmen. Duikers zwemmen tussen de stille, begroeide standbeelden door, wat een unieke, een beetje spooky ervaring is diep onder de golven."}, {"naam": "Jamaica", "bestand": "Jamaica", "continent": "NA", "tekst": "Op Jamaica werd de snelste mens ooit geboren: Usain Bolt, die de 100 meter rende in slechts 9,58 seconden — sneller dan wie dan ook ooit heeft gedaan. Maar Bolt is niet toevallig zo snel: Jamaica, een eilandje met maar zo'n 3 miljoen inwoners, heeft verrassend veel van de snelste sprinters ter wereld voortgebracht. Op straat en op school rennen kinderen er al vanaf jonge leeftijd hard, en sprinten is er zowat een nationale sport, gevierd met evenveel enthousiasme als voetbal in andere landen."}, {"naam": "Saint Kitts en Nevis", "bestand": "Saint_Kitts_en_Nevis", "continent": "NA", "tekst": "Saint Kitts en Nevis is het kleinste land van heel Amerika, zowel in oppervlakte als in aantal inwoners — je zou het hele land makkelijk in een paar uur kunnen rondrijden! Op het eiland Saint Kitts rijdt nog een oude smalspoor-suikerrietttrein, gebouwd om vroeger suikerriet naar de haven te vervoeren, die tegenwoordig toeristen meeneemt op een tochtje rond het hele eiland, langs de kust en door de heuvels."}, {"naam": "Saint Lucia", "bestand": "Saint_Lucia", "continent": "NA", "tekst": "Saint Lucia is vernoemd naar een vrouwelijke heilige, Sint-Lucia, en is daarmee het enige land ter wereld dat naar een vrouw is vernoemd! Het eiland wisselde vroeger liefst veertien keer van eigenaar tussen Frankrijk en Engeland — een record voor het Caribisch gebied — waardoor je er nu zowel Franse als Engelse invloeden terugziet, in de taal, de gebouwen en het eten. Ondanks de kleine omvang heeft het eiland ook twee Nobelprijswinnaars voortgebracht, meer per hoofd van de bevolking dan bijna elk ander land ter wereld!"}, {"naam": "Saint Vincent en de Grenadines", "bestand": "Saint_Vincent_en_de_Grenadines", "continent": "NA", "tekst": "Saint Vincent en de Grenadines bestaat niet uit één eiland, maar uit maar liefst 32 eilanden en eilandjes, waarvan er maar een paar bewoond zijn — de rest is helemaal onbewoond en wild! Een van die kleine eilandjes, Bequia, is beroemd om zijn walvisvaarders die nog steeds op de traditionele manier, met handharpoenen vanuit kleine roeibootjes, op walvissen jagen — een van de laatste plekken ter wereld waar dat nog mag, vanwege een oude culturele uitzondering. Het land is ook een van de favoriete verstopplekken van filmsterren en miljardairs, die met hun jachten tussen de afgelegen eilandjes rondvaren, ver weg van de drukte."}, {"naam": "Trinidad en Tobago", "bestand": "Trinidad_en_Tobago", "continent": "NA", "tekst": "Trinidad en Tobago is de geboorteplek van de steelpan — het enige echt nieuwe muziekinstrument dat in de hele 20e eeuw is uitgevonden! Het ontstond toen mensen op het eiland, die geen geld hadden voor echte instrumenten, ontdekten dat je uit oude olievaten prachtige muzieknoten kon hameren als je precies de goede deukjes erin maakte. Tegenwoordig staan er hele orkesten van tientallen steelpans samen te spelen tijdens het jaarlijkse Carnaval, en het swingende geluid is inmiddels beroemd over de hele wereld."}, {"naam": "Argentinië", "bestand": "Argentinie", "continent": "ZA", "tekst": "In Argentinië ligt de Perito Moreno-gletsjer, een van de weinige gletsjers ter wereld die nog steeds groeit in plaats van smelt! Regelmatig breken er met een enorme knal stukken ijs van wel meerdere verdiepingen hoog af en storten ze met donderend geraas in het meer eronder. Bezoekers staan op speciale platforms vlakbij om dit spektakel te zien en horen — het klinkt als een kanonschot als er een groot stuk ijs afbreekt. De gletsjer is zo dik dat het ijs een blauwe gloed heeft, omdat zo dik ijs alle andere kleuren van het licht opslokt."}, {"naam": "Bolivia", "bestand": "Bolivia", "continent": "ZA", "tekst": "In Bolivia ligt de grootste spiegel ter wereld — al is het geen echte spiegel, maar een zoutvlakte: de Salar de Uyuni. Als er een dun laagje regenwater op het zoutoppervlak blijft liggen, verandert de hele vlakte in een perfecte spiegel die de lucht erboven weerkaatst, zo mooi dat je niet meer kunt zien waar de grond ophoudt en de lucht begint. Mensen die er foto's maken, lijken wel te zweven midden in de wolken! De zoutvlakte is zo groot — groter dan heel Zeeland en Noord-Brabant samen — dat je hem zelfs vanuit de ruimte kunt zien."}, {"naam": "Brazilië", "bestand": "Brazilie", "continent": "ZA", "tekst": "In het Amazoneregenwoud van Brazilië gebeurt iets wat je bijna nergens anders ter wereld ziet: twee rivieren die naast elkaar stromen zonder zich te mengen! Waar de donkere Rio Negro en de lichtbruine Amazone-rivier bij Manaus samenkomen, blijven de kleuren wel 6 kilometer lang gescheiden, als een zwart-bruine streep midden in het water. Dat komt doordat de twee rivieren een andere temperatuur, snelheid en dichtheid hebben, waardoor ze niet zomaar door elkaar heen willen stromen. Boottochtjes varen er speciaal naartoe zodat mensen met hun eigen ogen deze vreemde grens in het water kunnen zien."}, {"naam": "Chili", "bestand": "Chili", "continent": "ZA", "tekst": "Ver voor de kust van Chili, midden in de Grote Oceaan, ligt Paaseiland, met zijn beroemde reusachtige stenen hoofden: de Moai. Er staan er meer dan 900, sommige wel 10 meter hoog en tonnen zwaar, gemaakt door het Rapa Nui-volk zonder kranen of vrachtwagens. Niemand weet precies hoe ze deze enorme beelden over het eiland versleepten, al denken wetenschappers dat ze de beelden misschien met touwen heen en weer \"liepen\" alsof ze een kastje verschuiven. Paaseiland ligt zo geïsoleerd dat het dichtstbijzijnde bewoonde stukje land ruim 2000 kilometer verderop ligt!"}, {"naam": "Colombia", "bestand": "Colombia", "continent": "ZA", "tekst": "Colombia is het land waar de meeste vlindersoorten ter wereld voorkomen — meer dan 3.000 verschillende soorten fladderen er rond, meer dan in enig ander land! Dat komt doordat Colombia bijna alle klimaatzones binnen zijn grenzen heeft: van hete jungle en droge woestijn tot besneeuwde bergtoppen, allemaal in één land. Colombia is ook de bakermat van koffie zoals wij die kennen: de groene heuvels vol koffieplanten kleuren er letterlijk het landschap."}, {"naam": "Ecuador", "bestand": "Ecuador", "continent": "ZA", "tekst": "Voor de kust van Ecuador liggen de Galápagoseilanden, waar dieren leven die je nergens anders op aarde vindt — zoals reuzenschildpadden die wel 150 jaar oud kunnen worden en leguanen die in zee zwemmen om zeewier te eten! Toen de wetenschapper Charles Darwin deze eilanden bezocht, zag hij dat dezelfde diersoort er op elk eiland net iets anders uitzag, aangepast aan dat ene eilandje. Die ontdekking bracht hem op het spoor van een van de beroemdste ideeën uit de wetenschap: de evolutietheorie!"}, {"naam": "Frans-Guyana", "bestand": "Frans_Guyana", "continent": "ZA", "tekst": "Frans Guyana is eigenlijk helemaal geen \"eigen\" land — het is officieel gewoon een stukje Frankrijk, net zoals Parijs! Dat betekent dat je er met euro's kunt betalen, dat de kinderen er Frans leren op school, en dat het zelfs bij de Europese Unie hoort, terwijl het duizenden kilometers van Europa vandaan ligt, midden in Zuid-Amerika. Vanuit Frans Guyana schiet Europa ook zijn raketten de ruimte in: bij Kourou staat een lanceerbasis waar Ariane-raketten opstijgen, omdat de plek dicht bij de evenaar ligt — daar is een lancering extra krachtig door de draaiing van de aarde."}, {"naam": "Guyana", "bestand": "Guyana", "continent": "ZA", "tekst": "Guyana is het enige land van Zuid-Amerika waar de mensen vooral Engels spreken in plaats van Spaans of Portugees — dat komt doordat het vroeger een Britse kolonie was. Het land bestaat voor meer dan 80 procent uit ongerept regenwoud, een van de grootste ongerepte oerwoudgebieden ter wereld, met jaguars, reuzenotters en de grootste adelaars ter wereld: de harpij. Guyana heeft ook maar zo'n 800.000 inwoners, minder dan de stad Amsterdam, terwijl het land bijna vijf keer zo groot is."}, {"naam": "Paraguay", "bestand": "Paraguay", "continent": "ZA", "tekst": "In Paraguay spreekt bijna iedereen naast Spaans ook Guaraní, de taal van het inheemse volk dat er al woonde voordat de Spanjaarden kwamen — een van de weinige plekken in Zuid-Amerika waar een inheemse taal nog door bijna de hele bevolking gesproken wordt, ook door mensen zonder inheemse afkomst! Straatnaambordjes, liedjes en zelfs het nieuws zijn er soms in het Guaraní. Het is voor Paraguayanen een enorme bron van trots, en kinderen leren de taal al op de basisschool naast het Spaans."}, {"naam": "Peru", "bestand": "Peru", "continent": "ZA", "tekst": "Hoog in de bergen van Peru ligt Machu Picchu, een verloren stad van de Inca's, gebouwd zonder cement of moderne gereedschappen — de stenen passen zo precies op elkaar dat je er geen mesje tussen kunt schuiven! De stad lag eeuwenlang verstopt tussen de bergtoppen en begroeide struiken, tot een Amerikaanse ontdekkingsreiziger hem in 1911 bij toeval terugvond, met hulp van een lokale jongen die de weg wist. Niemand weet precies waarom de Inca's de stad ooit verlieten, wat het nog mysterieuzer maakt."}, {"naam": "Suriname", "bestand": "Suriname", "continent": "ZA", "tekst": "Suriname is het enige land in Zuid-Amerika waar Nederlands de officiële taal is — een direct gevolg van de tijd dat het een Nederlandse kolonie was. Nederland kreeg Suriname in 1667 in handen door een ruil met de Engelsen: Nederland gaf toen Nieuw-Amsterdam (het huidige New York!) aan Engeland, in ruil voor Suriname. Op straat hoor je naast Nederlands ook Sranantongo, Surinaams-Javaans, Sarnami en tientallen andere talen door elkaar, omdat er mensen wonen met roots over de hele wereld. Pas op 25 november 1975 werd Suriname officieel onafhankelijk van Nederland. In de rivieren van Suriname zwemmen piranha's en kaaimannen, en in het binnenland liggen dorpen die alleen per boot of vliegtuig te bereiken zijn — soms wel een dagreis van de dichtstbijzijnde weg vandaan."}, {"naam": "Uruguay", "bestand": "Uruguay", "continent": "ZA", "tekst": "In Uruguay lopen er meer koeien en schapen rond dan mensen — voor elke Uruguayaan zijn er ongeveer vier koeien! Het land is dan ook wereldberoemd om zijn rundvlees en de \"asado\", een barbecue die uren kan duren en waarbij hele families en vrienden samenkomen. Op het platteland van Uruguay vind je \"gaucho's\", stoere cowboys te paard die al eeuwenlang de kuddes vee hoeden, met een cultuur vol paardrijden, lasso's en gitaarmuziek rond het kampvuur."}, {"naam": "Venezuela", "bestand": "Venezuela", "continent": "ZA", "tekst": "In Venezuela stort het hoogste watervalwater ter wereld naar beneden: de Salto Angel, waar het water wel 979 meter valt — bijna 20 keer zo hoog als de Niagarawatervallen! Het water valt zo hoog en zo lang dat het onderweg soms helemaal uiteenspat in nevel en nooit eens de bodem bereikt als mist. De waterval ligt diep verstopt in de jungle en is zo moeilijk bereikbaar dat je er alleen per boot en te voet, of met een klein vliegtuigje, kunt komen."}, {"naam": "Falklandeilanden", "bestand": "Falklandeilanden", "continent": "ZA", "tekst": "De Falklandeilanden waren in 1982 het toneel van een korte maar felle oorlog tussen Groot-Brittannië en Argentinië, die beide het eilandje als hun eigen grondgebied claimden (in Argentinië heten ze de Islas Malvinas). De oorlog duurde maar 74 dagen en eindigde met een Britse overwinning, maar de eilanden worden nog steeds door Argentinië opgeëist. Ondanks de heftige geschiedenis is het nu een rustig plekje, waar verrassend genoeg meer pinguïns dan mensen wonen langs de ruige, winderige kusten."}, {"naam": "Australië", "bestand": "Australie", "continent": "OC", "tekst": "De Aboriginals wonen al minstens 65.000 jaar in Australië — dat maakt hen een van de oudste nog levende culturen ter wereld, ouder dan de piramides van Egypte, ouder zelfs dan het wiel! Ze navigeerden door de enorme, dorre woestijn zonder kaarten of kompas, met behulp van \"zangwegen\": eeuwenoude liederen die van generatie op generatie werden doorgegeven, waarin elke berg, waterbron en rots werd bezongen als een soort levend landkaart. Als een Aboriginal-kind het lied van zijn voorouders kende, kon hij honderden kilometers door de woestijn trekken en toch precies weten waar hij was — gewoon door te zingen."}, {"naam": "Nieuw-Zeeland", "bestand": "Nieuw-Zeeland", "continent": "OC", "tekst": "Nieuw-Zeeland was het allerlaatste grote stuk land op aarde dat mensen ontdekten en bewoonden — pas zo'n 700 jaar geleden voeren de Māori er met kano's naartoe, over duizenden kilometers open oceaan, terwijl andere delen van de wereld al duizenden jaren bewoond waren! Voordat de Māori aankwamen, hadden de eilanden totaal geen roofdieren op het land, waardoor er vreemde, kwetsbare vogels ontstonden zoals de kiwi: een vogel die niet kan vliegen, 's nachts actief is en eieren legt die verhoudingsgewijs de grootste van alle vogels ter wereld zijn — soms wel een vijfde van haar eigen lichaamsgewicht!"}, {"naam": "Papoea-Nieuw-Guinea", "bestand": "Papoea-Nieuw-Guinea", "continent": "OC", "tekst": "In de bergen van Papoea-Nieuw-Guinea leven paradijsvogels, met van de meest kleurrijke en vreemde veren ter wereld — sommige mannetjes hebben lange sluierveren of gekke kuifjes. Om een vrouwtje te versieren, doen ze bizarre dansjes: ze hangen ondersteboven, schudden wild met hun veren of veranderen hun hele lichaamsvorm om er indrukwekkend uit te zien. Iedere soort heeft zijn eigen unieke dans en geluid. Vroeger dachten Europese ontdekkingsreizigers zelfs dat deze vogels nooit landden, omdat hun poten in oude opgezette exemplaren per ongeluk waren verwijderd! Er leven tientallen verschillende soorten paradijsvogels, bijna allemaal alleen hier."}, {"naam": "Fiji", "bestand": "Fiji", "continent": "OC", "tekst": "Op Fiji zwem je door helder, warm water tussen ruim 300 verschillende eilanden — maar slechts een derde daarvan is bewoond! De eilanden zijn ontstaan uit oude vulkanen, en onder water is het net zo spectaculair: Fiji staat bekend als een van de mooiste duikplekken ter wereld, met kleurrijke koraalriffen vol tropische vissen. Fiji was ook lange tijd berucht als \"de Kannibalen-eilanden\", omdat er eeuwen geleden inderdaad mensen werden opgegeten na gevechten — tegenwoordig is Fiji juist een van de meest gastvrije en vredige plekken ter wereld, waar bezoekers met open armen worden ontvangen."}, {"naam": "Frans-Polynesië", "bestand": "Frans-Polynesie", "continent": "OC", "tekst": "Toen ontdekkingsreizigers voor het eerst op Tahiti aankwamen, zagen ze iets wat ze nog nooit hadden meegemaakt: mensen met prachtige patronen die voorgoed in hun huid waren geprikt. Het woord \"tatoeage\" komt zelfs rechtstreeks van het Polynesische woord tatau. Op de eilanden vertelde elk patroon een eigen verhaal, over familie, moed of een belangrijke gebeurtenis in iemands leven — en vanuit hier verspreidde het gebruik zich over de hele wereld."}, {"naam": "Micronesia", "bestand": "Micronesia", "continent": "OC", "tekst": "In de lagune van Chuuk, een van de eilandengroepen van Micronesia, ligt een compleet oorlogsvloot van Japan op de bodem van de zee — meer dan zestig schepen en talloze vliegtuigen, allemaal in één klap tot zinken gebracht tijdens de Tweede Wereldoorlog. De schepen liggen er nog steeds, compleet met tanks, motorfietsen en zelfs skeletten aan boord, overwoekerd door koraal. Het is nu een van de beroemdste duikplekken ter wereld."}, {"naam": "Nauru", "bestand": "Nauru", "continent": "OC", "tekst": "Nauru was ooit, per inwoner, een van de rijkste landen ter wereld. De hele grond van het eiland bleek namelijk te bestaan uit fosfaat, een grondstof die overal ter wereld nodig was voor kunstmest. Jarenlang werd er zoveel opgegraven dat inwoners auto's en zelfs privévliegtuigen konden kopen. Maar tegen de tijd dat het fosfaat op was, bleef er een kaal, uitgehold binnenland over — en het geld was net zo snel verdwenen als het gekomen was."}, {"naam": "Nieuw-Caledonië", "bestand": "Nieuw-Caledonie", "continent": "OC", "tekst": "Op Nieuw-Caledonië leeft de kagoe, een vogel die bijna niet kan vliegen en eruitziet als een grijze pluizenbol op lange poten. Omdat er op het eiland eeuwenlang geen roofdieren waren, had de kagoe zijn vliegvermogen niet meer nodig en verloor die geleidelijk. Nu honden en katten er wel zijn gekomen, is de kagoe juist daardoor extra kwetsbaar geworden, en wordt hij zorgvuldig beschermd."}, {"naam": "Palau", "bestand": "Palau", "continent": "OC", "tekst": "Op Palau ligt een compleet afgesloten meer, ooit verbonden met de zee, maar door de tijd heen ingesloten door land. Daarin zwemmen miljoenen kwallen rond die, omdat er geen vijanden meer zijn, hun angel bijna volledig kwijt zijn geraakt. Je kunt er middenin zwemmen en je laten omringen door duizenden gouden kwallen, zonder ook maar iets te voelen van een prik."}, {"naam": "Salomonseilanden", "bestand": "Salomonseilanden", "continent": "OC", "tekst": "Tijdens de Tweede Wereldoorlog werd er op de Salomonseilanden zo hevig gevochten tussen Japan en de Verenigde Staten, dat de zee errond nu \"Ironbottom Sound\" heet — de bodem van de oceaan ligt er vol gezonken oorlogsschepen en vliegtuigen. Maar ook op het land liggen nog altijd duizenden bommen en granaten verstopt in de jungle, meer dan tachtig jaar later. Er zijn speciale teams die niets anders doen dan die oude explosieven opsporen en onschadelijk maken, omdat ze soms nog steeds afgaan."}, {"naam": "Samoa", "bestand": "Samoa", "continent": "OC", "tekst": "Samoa lag heel lang aan de verkeerde kant van de datumgrens — de onzichtbare lijn waar de ene dag overgaat in de andere. Daardoor was het op Samoa altijd bijna een hele dag vroeger dan bij de buurlanden. In 2011 vond de regering dat zo onhandig worden voor handel, dat ze een hele dag gewoon overslogen: op 29 december ging iedereen slapen, en de volgende ochtend was het 31 december. Vrijdag 30 december heeft dat jaar dus nooit bestaan op Samoa."}, {"naam": "Tonga", "bestand": "Tonga", "continent": "OC", "tekst": "Vlak bij Tonga ligt een vulkaan die je niet kunt zien, want hij zit onder water. In 2022 barstte hij zo hard uit dat de knal tot in Alaska te horen was — duizenden kilometers verderop! De schokgolf raasde zelfs twee keer helemaal rond de aarde. De uitbarsting was zo krachtig dat hij tot in de ruimte te zien was, en veroorzaakte een grote vloedgolf die over de eilanden van Tonga rolde. Mensen op Tonga maakten iets mee wat bijna niemand ooit meemaakt: een vulkaanuitbarsting die de hele planeet voelde."}, {"naam": "Tuvalu", "bestand": "Tuvalu", "continent": "OC", "tekst": "Tuvalu kreeg ooit gewoon de internetlandcode .tv toegewezen, puur omdat die toevallig bij hun landnaam paste. Niemand had verwacht dat tv-zenders en videosites over de hele wereld dolgraag een adres wilden dat eindigt op .tv. Tuvalu verkocht de rechten op die landcode voor miljoenen dollars — geld waarmee het piepkleine eilandenrijk ineens wegen, scholen en een ziekenhuis kon bouwen."}, {"naam": "Vanuatu", "bestand": "Vanuatu", "continent": "OC", "tekst": "Op Vanuatu bestaat een eeuwenoude traditie waarbij mannen van een houten toren van soms wel dertig meter hoog springen, met alleen wat lianen om hun enkels gebonden. Dit ritueel, land diving genoemd, gebeurt al generaties lang om een goede oogst af te smeken. Toen westerse avonturiers dit voor het eerst zagen, namen ze het idee mee naar huis — en zo ontstond, met touwen in plaats van lianen, de moderne bungeejump."}, {"naam": "Antarctica", "bestand": "Antarctica", "continent": "OV", "tekst": "Onder het dikke ijs van Antarctica ligt een compleet verborgen wereld: honderden meren met vloeibaar water, al miljoenen jaren afgesloten van de buitenlucht door een ijslaag van soms wel 4 kilometer dik! Het grootste, het Vostokmeer, ligt zo diep verstopt dat wetenschappers pas na jaren van voorzichtig boren wisten te bevestigen dat er nog steeds leven in zit: piepkleine organismen die al miljoenen jaren compleet geïsoleerd hebben overleefd. Boven het ijs is het al even bijzonder: de laagste temperatuur ooit gemeten op aarde, bijna -90 graden Celsius, werd hier genoteerd, en toch is er geen enkel land dat officieel eigenaar is van Antarctica — een internationaal verdrag bepaalt dat het continent van niemand en tegelijk van iedereen is."}, {"naam": "Noordpool", "bestand": "Noordpool", "continent": "OV", "tekst": "Op de Noordpool wijst een kompas een beetje de mist in: de echte Noordpool (het draaipunt van de aarde) ligt namelijk niet precies op dezelfde plek als de magnetische Noordpool, waar een kompasnaald naartoe wijst. Sterker nog, die magnetische Noordpool verschuift jaar na jaar langzaam over de kaart, soms wel tientallen kilometers per jaar! 's Winters is het er maandenlang aardedonker, en dan kun je vanaf de Noordpool soms een spectaculair noorderlicht zien dansen boven het ijs, met niemand in de buurt om ernaar te kijken."}];

// ── Posities (in % van het #kader) van de 9 wereldbol-vakjes en de 7
// werelddeel-tabbladen, afgelezen uit de referentie-afbeelding
// (paspoort-boek-referentie.png, 640×512). Bij een andere/nieuwe
// achtergrondtekening moeten deze percentages opnieuw afgesteld worden. ──
// Per vakje het linker/rechter- en boven/onder-percentage, exact afgemeten
// op de scalloped stempelranden in de referentie-afbeelding (met een kleine
// beeldherkennings-check, niet enkel op het oog geschat).
const STEMPEL_KOLOMMEN = [
  {links:19.2, rechts:37.5},
  {links:42.2, rechts:60.5},
  {links:65.2, rechts:83.3},
];
const STEMPEL_RIJEN = [
  {boven:26.6, onder:44.0},
  {boven:48.4, onder:66.5},
  {boven:70.5, onder:88.0},
];
const STEMPEL_INZET = 1.2; // marge binnen elk vakje, zodat de gestempelde rand zichtbaar blijft

// Drie verschillende verificatiestempels, willekeurig (maar per land vast)
// verdeeld over de landenstempels.
const STEMPEL_AFBEELDINGEN = [
  'weet-ik-te-vinden-stempel.png',
  'ik-was-hier-stempel.png',
  'vlieg-ik-zo-naartoe-stempel.png',
];

// Zelfde sessionStorage-sleutel als index.html gebruikt: laat weten dat we
// via een menu-knop (hier: het stempelboek) terugkomen, zodat daar niet
// opnieuw het verplichte naamscherm wordt getoond - de naam is al bekend.
const VAN_MENU_NAVIGATIE_SLEUTEL = 'wonkywings_van_menu_navigatie';
function ganNaarStart(){
  sessionStorage.setItem(VAN_MENU_NAVIGATIE_SLEUTEL, '1');
  window.location.href = 'index.html';
}

// Simpele, stabiele tekst-hash: zelfde land geeft altijd hetzelfde getal,
// gebruikt om de verificatiestempel per land een eigen (vaste) kanteling
// en positie te geven zonder dat die bij elke herlaad verandert.
function tekstHash(str){
  let h = 0;
  for(let i=0; i<str.length; i++){
    h = (h*31 + str.charCodeAt(i)) >>> 0;
  }
  return h;
}

const TAB_LEFT = 90, TAB_WIDTH = 7.7;
const WERELDDELEN = [
  {code:"EU", label:"Europa",        top:8,  bottom:18},
  {code:"AF", label:"Afrika",        top:19, bottom:30},
  {code:"AS", label:"Azië",          top:31, bottom:42},
  {code:"NA", label:"Noord-Amerika", top:43, bottom:55},
  {code:"ZA", label:"Zuid-Amerika",  top:56, bottom:67},
  {code:"OC", label:"Oceanië",       top:68, bottom:79},
  {code:"OV", label:"Overig",        top:80, bottom:91},
];
const PER_PAGINA = 9;

// ── Landenpaspoort: welke stempels zijn er al verdiend? ──
// Zelfde localStorage-sleutel als index.html en raadspel.html: daar komen
// de stempels bij ("bestand" van het land), hier lezen we ze alleen uit.
const STEMPELS_SLEUTEL = 'wonkywings_verdiende_stempels';
function geefVerdiendeStempels(){
  try{ return JSON.parse(localStorage.getItem(STEMPELS_SLEUTEL)||'[]'); }catch(e){ return []; }
}
function isVerzameld(land){
  return geefVerdiendeStempels().includes(land.bestand);
}

let huidigWerelddeel = WERELDDELEN[0].code;
let huidigePagina = 0; // 0-based

function landenVoorWerelddeel(code){
  return PASPOORT_DATA.filter(l => l.continent === code);
}

// ── Onzichtbare klikvlakken over de al getekende tabbladen ──
function bouwTabs(){
  const laag = document.getElementById('tabs-laag');
  laag.innerHTML = '';
  WERELDDELEN.forEach(wd=>{
    const btn = document.createElement('button');
    btn.className = 'werelddeel-tab';
    btn.style.left = TAB_LEFT + '%';
    btn.style.width = TAB_WIDTH + '%';
    btn.style.top = wd.top + '%';
    btn.style.height = (wd.bottom - wd.top) + '%';
    btn.title = wd.label;
    btn.onclick = () => { huidigWerelddeel = wd.code; huidigePagina = 0; bouwTabs(); bouwStempels(); };
    laag.appendChild(btn);
  });
  const actief = WERELDDELEN.find(wd=>wd.code===huidigWerelddeel);
  const highlight = document.getElementById('tab-highlight');
  highlight.style.left = TAB_LEFT + '%';
  highlight.style.width = TAB_WIDTH + '%';
  highlight.style.top = actief.top + '%';
  highlight.style.height = (actief.bottom - actief.top) + '%';
}

function bouwStempels(){
  const landen = landenVoorWerelddeel(huidigWerelddeel);
  const totaalPaginas = Math.max(1, Math.ceil(landen.length / PER_PAGINA));
  if(huidigePagina >= totaalPaginas) huidigePagina = totaalPaginas - 1;
  if(huidigePagina < 0) huidigePagina = 0;

  const start = huidigePagina * PER_PAGINA;
  const paginaLanden = landen.slice(start, start + PER_PAGINA);

  const laag = document.getElementById('stempel-laag');
  laag.innerHTML = '';
  for(let i=0; i<PER_PAGINA; i++){
    const land = paginaLanden[i];
    if(!land) continue; // leeg vakje: laat het watermerk uit de tekening gewoon zichtbaar
    const rij = Math.floor(i/3), kol = i%3;
    const kaart = document.createElement('div');
    kaart.className = 'stempel-kaart';
    const kolInfo = STEMPEL_KOLOMMEN[kol], rijInfo = STEMPEL_RIJEN[rij];
    kaart.style.left   = (kolInfo.links + STEMPEL_INZET) + '%';
    kaart.style.top    = (rijInfo.boven + STEMPEL_INZET) + '%';
    kaart.style.width  = (kolInfo.rechts - kolInfo.links - 2*STEMPEL_INZET) + '%';
    kaart.style.height = (rijInfo.onder - rijInfo.boven - 2*STEMPEL_INZET) + '%';
    kaart.title = land.naam;

    // Nog niet verdiend: de illustratie blijft zichtbaar (leuk om vast te
    // zien wat er te winnen valt), maar dan vervaagd en zonder
    // verificatiestempel erop - die stempel is nu juist het bewijs dát je
    // 'm verdiend hebt. En niet aanklikbaar: de uitvergroting met het
    // weetje erbij zou anders stiekem al te zien zijn vóór het verdiend is.
    const verzameld = isVerzameld(land);
    if(!verzameld) kaart.classList.add('nog-niet-verzameld');
    if(verzameld) kaart.onclick = () => toonUitvergroting(land, landen, start + i);

    // Welke van de drie stempels, en de kanteling ervan, ligt per land vast
    // (dezelfde afbeelding geeft altijd dezelfde stempel + stand), zodat het
    // niet bij elke herlaad verspringt, maar wel per land verschilt: soms
    // "Weet ik te vinden!", soms "I was here!", soms "Vlieg ik zo naartoe!",
    // en soms flink meer gekanteld dan andere keren (zodat de tekst, die op
    // de stempel zelf ook al schuin staat, leesbaar wordt).
    const h = tekstHash(land.bestand);
    const afbeeldingIndex = h % STEMPEL_AFBEELDINGEN.length;
    const rotatie = ((h >>> 3) % 71) - 35;  // -35 tot +35 graden

    kaart.innerHTML = `<img class="stempel-foto" src="images/landenstempels/${land.bestand}.png" alt="${land.naam}"/>`
      + (verzameld
          ? `<img class="stempel-verificatie" src="images/${STEMPEL_AFBEELDINGEN[afbeeldingIndex]}" alt=""`
            + ` style="transform:translate(-50%, -50%) rotate(${rotatie}deg);">`
          : `<div class="stempel-slotje">🔒</div>`);
    laag.appendChild(kaart);

    // Naampje direct onder de stempel, in de smalle strook tussen dit vakje
    // en het volgende (of de onderrand van het boek bij de laatste rij).
    // De naam blijft altijd zichtbaar (ook nog-niet-verdiend) - het slotje
    // en de vervaagde illustratie maken al genoeg duidelijk dat 'm nog
    // verdiend moet worden.
    const naamEl = document.createElement('div');
    naamEl.className = 'stempel-naam' + (verzameld ? '' : ' nog-niet-verzameld');
    naamEl.textContent = land.naam;
    naamEl.style.left = kolInfo.links + '%';
    naamEl.style.width = (kolInfo.rechts - kolInfo.links) + '%';
    naamEl.style.top = (rijInfo.onder + 0.2) + '%';
    naamEl.style.height = '4.4%';
    laag.appendChild(naamEl);
  }

  const actiefWd = WERELDDELEN.find(wd => wd.code === huidigWerelddeel);
  const wdIndex = WERELDDELEN.indexOf(actiefWd);
  document.getElementById('pagina-label').textContent = `${actiefWd.label}: pagina ${huidigePagina+1} van ${totaalPaginas}`;
  // De pijlen blijven maar echt uitgeschakeld aan het begin van Europa en
  // het eind van Overig — daartussenin bladert "verder" op de laatste
  // pagina gewoon door naar het volgende werelddeel (en "terug" andersom).
  document.getElementById('pijl-terug').disabled = (huidigePagina<=0 && wdIndex<=0);
  document.getElementById('pijl-verder').disabled = (huidigePagina>=totaalPaginas-1 && wdIndex>=WERELDDELEN.length-1);
}

function ganNaarPagina(nieuw){
  const landen = landenVoorWerelddeel(huidigWerelddeel);
  const totaalPaginas = Math.max(1, Math.ceil(landen.length / PER_PAGINA));
  const wdIndex = WERELDDELEN.indexOf(WERELDDELEN.find(wd => wd.code === huidigWerelddeel));

  if(nieuw >= totaalPaginas){
    // Laatste pagina van dit werelddeel + nog een keer "verder": ga door
    // naar het eerstvolgende werelddeel, pagina 1. Bij Overig (het laatste)
    // kan dit niet — de knop staat dan al uit, dus hier gebeurt dan niets.
    if(wdIndex >= WERELDDELEN.length-1) return;
    huidigWerelddeel = WERELDDELEN[wdIndex+1].code;
    huidigePagina = 0;
    bouwTabs();
  } else if(nieuw < 0){
    // Eerste pagina + "terug": naar het vorige werelddeel, laatste pagina.
    // Bij Europa (het eerste) gebeurt er niets, de knop staat dan al uit.
    if(wdIndex <= 0) return;
    huidigWerelddeel = WERELDDELEN[wdIndex-1].code;
    const vorigeLanden = landenVoorWerelddeel(huidigWerelddeel);
    huidigePagina = Math.max(0, Math.ceil(vorigeLanden.length / PER_PAGINA) - 1);
    bouwTabs();
  } else {
    huidigePagina = nieuw;
  }
  bouwStempels();
}

// ── Uitvergroten: klik erop, klik nogmaals/Escape/klik op de achtergrond
// om terug te klein te maken — zelfde soort patroon als bij het raadspel.
// Binnen de uitvergroting kan met de pijlen (of de pijltjestoetsen) door
// alle landen van het huidige werelddeel gebladerd worden, ook over
// paginagrenzen heen — de onderliggende boekpagina schuift dan gewoon mee. ──
const ACHTERGROND_EL = document.getElementById('uitvergroot-achtergrond');
const UITVERGROOT_IMG_EL = document.getElementById('uitvergroot-img');
const UITVERGROOT_VORIGE_EL = document.getElementById('uitvergroot-vorige');
const UITVERGROOT_VOLGENDE_EL = document.getElementById('uitvergroot-volgende');

let huidigeLijst = [];
let huidigeIndex = -1;

function toonUitvergroting(land, lijst, index){
  huidigeLijst = lijst;
  huidigeIndex = index;
  vulUitvergroting(land);
  ACHTERGROND_EL.classList.add('actief');
}
function vulUitvergroting(land){
  UITVERGROOT_IMG_EL.src = `images/landenstempels/${land.bestand}.png`;
  UITVERGROOT_IMG_EL.alt = land.naam;
  document.getElementById('uitvergroot-naam').textContent = land.naam;
  document.getElementById('uitvergroot-feit').textContent = land.tekst || '';
  UITVERGROOT_VORIGE_EL.disabled = huidigeIndex <= 0;
  UITVERGROOT_VOLGENDE_EL.disabled = huidigeIndex >= huidigeLijst.length - 1;
}
function naarStempelIndex(nieuweIndex){
  if(nieuweIndex < 0 || nieuweIndex >= huidigeLijst.length) return;
  huidigeIndex = nieuweIndex;
  vulUitvergroting(huidigeLijst[huidigeIndex]);
  const nieuwePagina = Math.floor(huidigeIndex / PER_PAGINA);
  if(nieuwePagina !== huidigePagina){
    huidigePagina = nieuwePagina;
    bouwStempels();
  }
}
function sluitUitvergroting(){
  ACHTERGROND_EL.classList.remove('actief');
}
ACHTERGROND_EL.addEventListener('click', (e)=>{
  if(e.target === ACHTERGROND_EL) sluitUitvergroting();
});
UITVERGROOT_IMG_EL.addEventListener('click', sluitUitvergroting);
document.addEventListener('keydown', e => {
  if(!ACHTERGROND_EL.classList.contains('actief')) return;
  if(e.key === 'Escape') sluitUitvergroting();
  else if(e.key === 'ArrowLeft') naarStempelIndex(huidigeIndex-1);
  else if(e.key === 'ArrowRight') naarStempelIndex(huidigeIndex+1);
});

// ── Welkomstmelding bij een leeg paspoort ──
const LEEG_PASPOORT_EL = document.getElementById('leeg-paspoort-overlay');
function toonLeegPaspoortMeldingAlsNodig(){
  if(geefVerdiendeStempels().length === 0) LEEG_PASPOORT_EL.classList.add('actief');
}
LEEG_PASPOORT_EL.addEventListener('click', ()=> LEEG_PASPOORT_EL.classList.remove('actief'));

// ── Init ──
bouwTabs();
bouwStempels();
toonLeegPaspoortMeldingAlsNodig();
</script>
