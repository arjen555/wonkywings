// ── Constanten ──
const LS_AANTAL = 9;
// Cirkelposities als percentage van het speelveld (x=centrum, y=centrum).
// Rij 1 (boven): y≈19%, Rij 2 (midden): y≈50%, Rij 3 (onder): y≈81%
// Kolom 1: x≈13%, Kolom 2: x≈33%, Kolom 3: x≈53%
const LS_CIRKELS = [
  {x:19.0, y:26.0}, {x:35.0, y:26.0}, {x:51.5, y:26.0},
  {x:19.0, y:50.0}, {x:35.0, y:50.0}, {x:51.5, y:50.0},
  {x:19.0, y:74.0}, {x:35.0, y:74.0}, {x:52.0, y:74.0}
];
const LS_CIRKEL_GROOTTE = 17.5;   // diameter als % van speelveld-breedte
const LS_STEMPEL_GROOTTE = 14;    // stempel als % van speelveld-breedte
// Stempels worden willekeurig een beetje gedraaid (±15°) neergelegd. Een
// gedraaid vierkant heeft een grotere bounding box dan het vierkant zelf
// (bij 15° zo'n 22% hoger) — deze marge zorgt dat de verboden-zone-check
// ook bij de scheefste stand nog klopt.
const LS_STEMPEL_ROTATIE_MARGE = 1.25;
// Snap-drempel = halve stempelgrootte: de stempel moet dus met zijn eigen
// rand minstens het middelpunt van een cirkel raken voor hij vastklikt.
const LS_SNAP_DREMPEL = LS_STEMPEL_GROOTTE / 2;
// Grootte van de goed/fout-controlecirkel: bewust los van LS_CIRKEL_GROOTTE
// (dat is de onzichtbare tekstbox) en klein genoeg om niet over de
// buurcirkels heen te vallen, ook bij een krap gekalibreerd rooster.
const LS_RING_GROOTTE = 14;

// Verboden band onderin: hier staat de schelp-knop + de timer erboven
// (#ls-schelp-tijd-groep). Stempels mogen nooit op deze hoogte losstaan —
// ook niet links van de knop — zodat álle losse stempels boven de tijd
// blijven zweven en de knop nooit "in dezelfde rij" oogt. Vandaar dat dit
// een volledige horizontale band is (elke x, vanaf yMin) en geen rechthoek
// die alleen de rechterkant afschermt.
//
// yMin wordt LIVE gemeten aan #ls-schelp-tijd-groep (i.p.v. een vast
// percentage), want die groep heeft zelf ook een clamp() met een
// pixel-maximum — op een breed scherm valt die groep relatief kleiner uit
// en zakt hij dus verder omlaag. Een vast yMin klopte dan niet meer met
// waar de tijd/knop ECHT stonden, en bleef er onnodig veel zandruimte
// onbenut. Door 'm elke keer opnieuw op te meten, klopt de grens altijd,
// op elk schermformaat.
function lsMeetVerbodenYMin(veldRect){
  const groep = document.getElementById('ls-schelp-tijd-groep');
  const groepRect = groep.getBoundingClientRect();
  return (groepRect.top - veldRect.top) / veldRect.height * 100;
}
// hoogte is de eigen hoogte van het stempel, in % van de speelveld-hoogte —
// zonder dit meegewogen zou alleen de bovenkant van het stempel gecheckt
// worden, terwijl de onderkant (het stempel is zelf best hoog) alsnog ver
// het verboden gebied in kan steken. Vandaar: bovenkant + hoogte > yMin.
function lsInVerbodenZone(x, y, hoogte, yMin){
  return (y + (hoogte||0)) > yMin;
}

// ── State ──
let lsLanden = [];           // 9 gekozen PASPOORT_LANDEN-entries
let lsKoppeling = [];        // cirkelindex → stempelindex (-1 = leeg)
let lsStempelOpCirkel = [];  // stempelindex → cirkelindex (-1 = los)
let lsActief = false;
let lsKlaar = false;
let lsTijdVerstreken = 0;
let lsTijdStart = null;
let lsTimerInterval = null;
let lsSchelpStatus = 'groen'; // groen | paars | rood
let lsSleepIdx = -1;
let lsSleepOffset = {x:0, y:0};
let lsGekozenBonusLanden = [];   // bonus-landen, meteen bij winst bepaald en bijgeschreven
let lsEindAnimatieGestart = false; // voorkomt dat de klik-ergens-animatie 2x start

// ── Vergroten van stempels via dubbeltik/dubbelklik ──
let lsLaatsteTik = {};              // stempelindex → tijdstip laatste tik (ms)
let lsVergroteStempels = new Set(); // stempelindex-en die momenteel 3x vergroot zijn
const LS_DUBBELTIK_MS = 350;

// Zet de transform (rotatie + evt. 3x-schaal) van één stempel-element.
// Alle plekken die de rotatie van een stempel zetten gaan via deze functie,
// zodat een vergroot stempel zijn grootte houdt tijdens slepen/terugspringen.
function lsStempelTransform(stempelEl, idx, graden){
  if(!stempelEl) return;
  const schaal = lsVergroteStempels.has(idx) ? ' scale(3)' : '';
  stempelEl.style.transform = 'rotate('+graden+'deg)'+schaal;
}

// Wissel een stempel tussen normaal en 3x vergroot formaat (dubbeltik/-klik)
function lsToggleStempelVergroting(idx){
  const stempel = document.getElementById('ls-stempel-'+idx);
  if(!stempel) return;
  const huidige = stempel.style.transform || '';
  const match = huidige.match(/rotate\(([-\d.]+)deg\)/);
  const graden = match ? parseFloat(match[1]) : 0;

  if(lsVergroteStempels.has(idx)){
    lsVergroteStempels.delete(idx);
    stempel.classList.remove('vergroot');
  } else {
    lsVergroteStempels.add(idx);
    stempel.classList.add('vergroot');
  }
  lsStempelTransform(stempel, idx, graden);
}

// ── Continent-gebalanceerde landenselectie ──
// Verdeling: EU 2-3, AF 1-3, AS 1-3, AM(NA+ZA) 1-3, OC/OV 0-1
// Altijd precies 1 klein-maar-fijn land, nooit meer.
function kiesLsLanden(){
  // 1. Kies 1 klein-maar-fijn land
  const kmfPool = PASPOORT_LANDEN.filter(p => KLEIN_MAAR_FIJN_BESTANDEN.includes(p.bestand));
  const kmf = kmfPool[Math.floor(Math.random() * kmfPool.length)];

  // Welk continent telt het kmf-land voor?
  const contVan = c => (c==='NA'||c==='ZA') ? 'AM' : (c==='OC'||c==='OV') ? 'OC' : c;
  const kmfCont = contVan(kmf.continent);

  // 2. Verdeling: start met minimum (som=5), verdeel 4 extra willekeurig
  const doel = {EU:2, AF:1, AS:1, AM:1, OC:0};
  const maxTotaal = {EU:3, AF:3, AS:3, AM:3, OC:1};
  let rest = 4;
  const sloten = shuffle(['EU','AF','AS','AM','OC','EU','AF','AS','AM','OC']);
  for(const c of sloten){
    if(rest <= 0) break;
    if(doel[c] < maxTotaal[c]){ doel[c]++; rest--; }
  }

  // 3. Het kmf-land telt mee voor zijn continent
  doel[kmfCont] = Math.max(0, doel[kmfCont] - 1);

  // 4. Vul per continent aan (geen klein-maar-fijn, geen dubbelingen)
  const gekozen = [kmf];
  const gekozenBestanden = new Set([kmf.bestand]);

  for(const c of ['EU','AF','AS','AM','OC']){
    const codes = c==='AM' ? ['NA','ZA'] : c==='OC' ? ['OC','OV'] : [c];
    const pool = shuffle(PASPOORT_LANDEN.filter(p =>
      codes.includes(p.continent) &&
      !KLEIN_MAAR_FIJN_BESTANDEN.includes(p.bestand) &&
      !gekozenBestanden.has(p.bestand)
    ));
    for(let i=0; i<doel[c] && pool.length>0; i++){
      const land = pool.pop();
      gekozen.push(land);
      gekozenBestanden.add(land.bestand);
    }
  }

  return gekozen.slice(0, LS_AANTAL);
}

// ── Start een nieuw potje ──
function startLandjeSchuif(){
  lsLanden = kiesLsLanden();

  // Reset state
  lsKoppeling = new Array(LS_AANTAL).fill(-1);
  lsStempelOpCirkel = new Array(LS_AANTAL).fill(-1);
  lsActief = false;
  lsKlaar = false;
  lsTijdVerstreken = 0;
  lsTijdStart = null;
  lsSchelpStatus = 'groen';
  lsSleepIdx = -1;
  lsGekozenBonusLanden = [];
  lsEindAnimatieGestart = false;
  lsVergroteStempels.clear();
  lsLaatsteTik = {};

  // Verberg #kader, toon landjeschuif-veld
  document.getElementById('kader').style.display = 'none';
  const veld = document.getElementById('landjeschuif-veld');
  veld.classList.add('actief');

  // Speler-info
  document.getElementById('ls-speler-vak').textContent = huidigeSpelerNaam();
  document.getElementById('ls-timer-vak').textContent = '0:00.0';

  // Reset schelp — groot, gloeiend, met instructietekst
  document.getElementById('ls-schelp-img').src = 'images/schelp-groen.png';
  const schelpWrap = document.getElementById('ls-schelp-wrap');
  schelpWrap.style.display = '';
  schelpWrap.classList.add('gloed');
  const schelpTekst = document.getElementById('ls-schelp-tekst');
  if(schelpTekst) schelpTekst.style.opacity = '1';

  // Reset bordje
  const bordjeWrap = document.getElementById('ls-bordje-wrap');
  bordjeWrap.classList.remove('gevallen');
  bordjeWrap.style.top = '';
  document.getElementById('ls-bordje-tekst').textContent = '';

  // Reset de paspoort/boek-iconen en de octopus-herstartknop
  document.getElementById('ls-eind-iconen').classList.remove('actief');
  document.getElementById('ls-opnieuw-knop').classList.remove('actief');

  // Bouw cirkels en stempels
  bouwLsCirkels();
  bouwLsStempels();

  // Pijl + uitlegkader tonen — blijven nu staan tot de speler ergens
  // klikt/tikt (geen vaste tijd meer)
  lsToonIntroOverlay();
}

// ── Intro-overlay: pijl + uitlegkader bij start van het potje ──
// Blijven allebei zichtbaar (met de dim eronder) totdat de speler ergens
// op het speelveld klikt of tikt — niet meer na een vaste tijd.
function lsVerbergIntroOverlay(){
  const pijl = document.getElementById('ls-start-pijl');
  const veld = document.getElementById('ls-speelveld');
  const uitleg = document.getElementById('ls-uitleg-kader');
  if(pijl) pijl.classList.remove('zichtbaar');
  if(veld) veld.classList.remove('pijl-toont');
  if(uitleg) uitleg.classList.remove('zichtbaar');
}
function lsToonIntroOverlay(){
  const pijl = document.getElementById('ls-start-pijl');
  const veld = document.getElementById('ls-speelveld');
  const uitleg = document.getElementById('ls-uitleg-kader');
  if(!pijl || !veld) return;

  pijl.classList.remove('zichtbaar');
  veld.classList.remove('pijl-toont');
  if(uitleg) uitleg.classList.remove('zichtbaar');
  // Force reflow, zodat de fade-in/dim ook opnieuw start als een en ander
  // van een vorig potje nog (deels) zichtbaar was
  void pijl.offsetWidth;
  pijl.classList.add('zichtbaar');
  veld.classList.add('pijl-toont');
  if(uitleg) uitleg.classList.add('zichtbaar');

  // Capture + once: dit vuurt altijd bij de allereerste klik/tik ergens
  // op het speelveld — ook als het doelelement (bv. een stempel of de
  // schelp-knop) de klik daarna zelf nog verder afhandelt.
  veld.addEventListener('mousedown', lsVerbergIntroOverlay, { capture:true, once:true });
  veld.addEventListener('touchstart', lsVerbergIntroOverlay, { capture:true, once:true, passive:true });
}

// ── Bouw de 9 cirkels met landnaam ──
function bouwLsCirkels(){
  // Verwijder bestaande cirkels en ringen
  const veld = document.getElementById('ls-speelveld');
  veld.querySelectorAll('.ls-cirkel, .ls-ring').forEach(el=>el.remove());

  lsLanden.forEach((land, i)=>{
    const pos = LS_CIRKELS[i];

    // Feedback-ring (achter de cirkel)
    const ring = document.createElement('div');
    ring.className = 'ls-ring';
    ring.id = 'ls-ring-'+i;
    ring.style.width = LS_RING_GROOTTE+'%';
    ring.style.height = 'auto';
    ring.style.aspectRatio = '1';
    ring.style.left = pos.x+'%';
    ring.style.top = pos.y+'%';
    veld.appendChild(ring);

    // Cirkel met naam — left/top = middelpunt, CSS transform centreert
    const cirkel = document.createElement('div');
    cirkel.className = 'ls-cirkel';
    cirkel.id = 'ls-cirkel-'+i;
    cirkel.style.width = LS_CIRKEL_GROOTTE+'%';
    cirkel.style.height = 'auto';
    cirkel.style.aspectRatio = '1';
    cirkel.style.left = pos.x+'%';
    cirkel.style.top = pos.y+'%';
    cirkel.textContent = land.naam;

    veld.appendChild(cirkel);
  });
}

// ── Bouw de 9 stempels, willekeurig in het rechter zandgebied ──
function bouwLsStempels(){
  const veld = document.getElementById('ls-speelveld');
  veld.querySelectorAll('.ls-stempel').forEach(el=>el.remove());

  // Stempel-hoogte in % van de speelveld-hoogte (stempels zijn zelf
  // vierkant, dus breedte-% omrekenen naar hoogte-% via de veld-aspectratio)
  const veldRect = veld.getBoundingClientRect();
  const lsStempelHoogtePct = LS_STEMPEL_GROOTTE * veldRect.width / veldRect.height * LS_STEMPEL_ROTATIE_MARGE;
  const lsYMin = lsMeetVerbodenYMin(veldRect);

  // Schud de volgorde zodat de stempels niet in dezelfde volgorde als de
  // cirkels liggen (maakt het lastiger om de koppeling te raden)
  const indices = shuffle([...Array(LS_AANTAL).keys()]);

  indices.forEach((landIdx, i)=>{
    const land = lsLanden[landIdx];
    const stempel = document.createElement('div');
    stempel.className = 'ls-stempel';
    stempel.id = 'ls-stempel-'+landIdx;
    stempel.dataset.idx = landIdx;
    stempel.style.width = LS_STEMPEL_GROOTTE+'%';
    stempel.style.height = 'auto';

    // Willekeurige positie rechts (65-83% x, verspreid over de hoogte)
    // Vermijd het schelp+tijd-gebied rechtsonder
    let rx, ry;
    do {
      rx = 65 + Math.random()*18;
      ry = 8 + Math.random()*72;
    } while(lsInVerbodenZone(rx, ry, lsStempelHoogtePct, lsYMin));
    stempel.style.left = rx+'%';
    stempel.style.top = ry+'%';
    lsStempelTransform(stempel, landIdx, Math.random()*30-15);

    const img = document.createElement('img');
    img.src = 'images/landenstempels/'+land.bestand+'.png';
    img.alt = land.naam;
    img.draggable = false;
    stempel.appendChild(img);

    // Events
    stempel.addEventListener('mousedown', lsStartSleep);
    stempel.addEventListener('touchstart', lsStartSleep, {passive:false});

    veld.appendChild(stempel);
  });

  // lsMeetVerbodenYMin() hierboven leunt op de ECHTE, actuele afmeting van
  // #ls-schelp-tijd-groep. Vlak bij de allereerste ronde (net na het laden
  // van de pagina) kan het zijn dat de schelp-afbeelding of het lettertype
  // nog niet klaar is — dan oogt die groep tijdelijk kleiner dan straks, en
  // schat lsYMin de grens te ruim in. Zodra alles écht geladen is,
  // controleren we daarom nog één keer of alle stempels boven de
  // (dan pas definitieve) grens staan, en schuiven we de uitzonderingen bij.
  lsHerstelStempelsNaLaden(veld);
}

function lsHerstelStempelsNaLaden(veld){
  const schelpImg = document.getElementById('ls-schelp-img');
  const imgKlaar = (schelpImg && !schelpImg.complete)
    ? new Promise(res => {
        schelpImg.addEventListener('load', res, {once:true});
        schelpImg.addEventListener('error', res, {once:true});
      })
    : Promise.resolve();
  const fontsKlaar = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

  Promise.all([imgKlaar, fontsKlaar]).then(() => {
    // Nog één frame wachten: direct na het load/ready-event is de layout
    // soms nog niet helemaal bijgewerkt.
    requestAnimationFrame(() => {
      const veldRect = veld.getBoundingClientRect();
      const hoogte = LS_STEMPEL_GROOTTE * veldRect.width / veldRect.height * LS_STEMPEL_ROTATIE_MARGE;
      const yMin = lsMeetVerbodenYMin(veldRect);
      veld.querySelectorAll('.ls-stempel').forEach(st => {
        // Niet aankomen als de speler 'm al beet heeft of al heeft neergelegd
        if(st.classList.contains('gesnapt') || st.classList.contains('slepen')) return;
        const curLeft = parseFloat(st.style.left);
        const curTop = parseFloat(st.style.top);
        if(lsInVerbodenZone(curLeft, curTop, hoogte, yMin)){
          let rx, ry;
          do {
            rx = 65 + Math.random()*18;
            ry = 8 + Math.random()*72;
          } while(lsInVerbodenZone(rx, ry, hoogte, yMin));
          st.style.left = rx+'%';
          st.style.top = ry+'%';
        }
      });
    });
  });
}

// ── Drag & drop ──
function lsGetPointerPos(e){
  const t = e.touches ? e.touches[0] : e;
  return {clientX:t.clientX, clientY:t.clientY};
}
function lsStartSleep(e){
  if(lsKlaar) return;
  // Alleen slepen als het spel actief is (paars/rood status) of als de
  // speler al een keer op de schelp heeft gedrukt
  if(!lsActief) return;

  e.preventDefault();
  const idx = parseInt(e.currentTarget.dataset.idx);

  // Dubbeltik/dubbelklik op een stempel: 3x vergroten, of weer terug naar
  // normaal formaat. Vervangt dan het slepen voor deze aanraking/klik.
  const nu = Date.now();
  const vorigeTik = lsLaatsteTik[idx] || 0;
  lsLaatsteTik[idx] = nu;
  if(nu - vorigeTik < LS_DUBBELTIK_MS){
    lsLaatsteTik[idx] = 0;
    lsToggleStempelVergroting(idx);
    return;
  }

  lsSleepIdx = idx;

  const stempel = e.currentTarget;
  const veld = document.getElementById('ls-speelveld');
  const veldRect = veld.getBoundingClientRect();
  const pos = lsGetPointerPos(e);

  // Als dit stempel op een cirkel lag, maak die cirkel vrij
  const oudeCirckel = lsStempelOpCirkel[idx];
  if(oudeCirckel >= 0){
    lsKoppeling[oudeCirckel] = -1;
    lsStempelOpCirkel[idx] = -1;
  }

  // Bereken offset t.o.v. stempel-linkerbovenhoek
  const stempelRect = stempel.getBoundingClientRect();
  lsSleepOffset.x = pos.clientX - stempelRect.left;
  lsSleepOffset.y = pos.clientY - stempelRect.top;

  stempel.classList.add('slepen');
  stempel.classList.remove('gesnapt');

  // Globale listeners
  document.addEventListener('mousemove', lsBeweegSleep);
  document.addEventListener('mouseup', lsStopSleep);
  document.addEventListener('touchmove', lsBeweegSleep, {passive:false});
  document.addEventListener('touchend', lsStopSleep);
}

function lsBeweegSleep(e){
  if(lsSleepIdx < 0) return;
  e.preventDefault();
  const pos = lsGetPointerPos(e);
  const veld = document.getElementById('ls-speelveld');
  const veldRect = veld.getBoundingClientRect();

  const stempel = document.getElementById('ls-stempel-'+lsSleepIdx);
  const nieuwLeft = ((pos.clientX - lsSleepOffset.x - veldRect.left) / veldRect.width) * 100;
  const nieuwTop = ((pos.clientY - lsSleepOffset.y - veldRect.top) / veldRect.height) * 100;
  stempel.style.left = nieuwLeft+'%';
  stempel.style.top = nieuwTop+'%';
  lsStempelTransform(stempel, lsSleepIdx, 0);
}

function lsStopSleep(e){
  if(lsSleepIdx < 0) return;

  const idx = lsSleepIdx;
  lsSleepIdx = -1;

  document.removeEventListener('mousemove', lsBeweegSleep);
  document.removeEventListener('mouseup', lsStopSleep);
  document.removeEventListener('touchmove', lsBeweegSleep);
  document.removeEventListener('touchend', lsStopSleep);

  const stempel = document.getElementById('ls-stempel-'+idx);
  stempel.classList.remove('slepen');

  // Check of we dicht genoeg bij een cirkel zijn om te snappen
  const veld = document.getElementById('ls-speelveld');
  const veldRect = veld.getBoundingClientRect();
  const stempelRect = stempel.getBoundingClientRect();
  const stempelCX = ((stempelRect.left + stempelRect.width/2 - veldRect.left) / veldRect.width) * 100;
  const stempelCY = ((stempelRect.top + stempelRect.height/2 - veldRect.top) / veldRect.height) * 100;
  // Eigen hoogte van een (normaal formaat) stempel in % van de speelveld-hoogte,
  // voor de verboden-zone-check hieronder (zie lsInVerbodenZone)
  const lsStempelHoogtePct = LS_STEMPEL_GROOTTE * veldRect.width / veldRect.height * LS_STEMPEL_ROTATIE_MARGE;
  const lsYMin = lsMeetVerbodenYMin(veldRect);

  let dichtstbijIdx = -1;
  let dichtstbijAfst = Infinity;

  for(let ci = 0; ci < LS_AANTAL; ci++){
    const cp = LS_CIRKELS[ci];
    // Y-positie corrigeren: cirkelposities zijn in % van breedte-equivalent,
    // maar het speelveld heeft aspect-ratio 3:2, dus y in % hoogte =
    // y_breedte% * (breedte/hoogte) = y * 1.5... maar we vergelijken hier
    // al in viewport-%, dus laten we gewoon het centrum van de cirkel-div pakken
    const cirkelEl = document.getElementById('ls-cirkel-'+ci);
    const cirkelRect = cirkelEl.getBoundingClientRect();
    const cirkelCX = ((cirkelRect.left + cirkelRect.width/2 - veldRect.left) / veldRect.width) * 100;
    const cirkelCY = ((cirkelRect.top + cirkelRect.height/2 - veldRect.top) / veldRect.height) * 100;

    // Afstand in pixels (nauwkeurig, ongeacht aspect-ratio)
    const dxPx = (stempelRect.left + stempelRect.width/2) - (cirkelRect.left + cirkelRect.width/2);
    const dyPx = (stempelRect.top + stempelRect.height/2) - (cirkelRect.top + cirkelRect.height/2);
    // Omrekenen naar % van speelveld-breedte voor vergelijking met snap-drempel
    const afst = Math.sqrt(dxPx*dxPx + dyPx*dyPx) / veldRect.width * 100;

    if(afst < dichtstbijAfst){
      dichtstbijAfst = afst;
      dichtstbijIdx = ci;
    }
  }

  if(dichtstbijIdx >= 0 && dichtstbijAfst < LS_SNAP_DREMPEL){
    // Snap naar deze cirkel
    // Als er al een ander stempel op deze cirkel lag, duw dat terug
    const bestaand = lsKoppeling[dichtstbijIdx];
    if(bestaand >= 0 && bestaand !== idx){
      // Duw bestaand stempel terug naar een willekeurige plek rechts
      const oudeStempel = document.getElementById('ls-stempel-'+bestaand);
      oudeStempel.classList.remove('gesnapt');
      // Vermijd het schelp+tijd-gebied bij terugplaatsen
      let terugX, terugY;
      do { terugX = 65+Math.random()*18; terugY = 8+Math.random()*72; } while(lsInVerbodenZone(terugX, terugY, lsStempelHoogtePct, lsYMin));
      oudeStempel.style.left = terugX+'%';
      oudeStempel.style.top = terugY+'%';
      lsStempelTransform(oudeStempel, bestaand, Math.random()*30-15);
      lsStempelOpCirkel[bestaand] = -1;
    }

    // Plaats dit stempel op de cirkel
    lsKoppeling[dichtstbijIdx] = idx;
    lsStempelOpCirkel[idx] = dichtstbijIdx;

    // Positioneer gecentreerd op de cirkel
    const cirkelEl = document.getElementById('ls-cirkel-'+dichtstbijIdx);
    const cirkelRect = cirkelEl.getBoundingClientRect();
    const snapLeft = ((cirkelRect.left + cirkelRect.width/2 - veldRect.left) / veldRect.width * 100) - LS_STEMPEL_GROOTTE/2;
    const snapTop = ((cirkelRect.top + cirkelRect.height/2 - veldRect.top) / veldRect.height * 100) - (LS_STEMPEL_GROOTTE/2 * veldRect.width / veldRect.height);
    stempel.style.left = snapLeft+'%';
    stempel.style.top = snapTop+'%';
    lsStempelTransform(stempel, idx, 0);
    stempel.classList.add('gesnapt');
  } else {
    // Niet gesnapt — check of stempel in het schelp+tijd-gebied terecht is gekomen
    const dropLeft = parseFloat(stempel.style.left);
    const dropTop = parseFloat(stempel.style.top);
    if(lsInVerbodenZone(dropLeft, dropTop, lsStempelHoogtePct, lsYMin)){
      // Duw terug naar veilige zone
      let rx2, ry2;
      do { rx2=65+Math.random()*18; ry2=8+Math.random()*72; } while(lsInVerbodenZone(rx2, ry2, lsStempelHoogtePct, lsYMin));
      stempel.style.left = rx2+'%';
      stempel.style.top = ry2+'%';
      lsStempelTransform(stempel, idx, Math.random()*30-15);
    }
  }
}

// ── Schelp-knop: statusmachine ──
function lsSchelpKlik(){
  if(lsKlaar) return;

  if(lsSchelpStatus === 'groen'){
    // Groen → kort ingedrukt → paars (start spel)
    document.getElementById('ls-schelp-img').src = 'images/schelp-groen-ingedrukt.png';
    // Glow en instructietekst uitzetten
    document.getElementById('ls-schelp-wrap').classList.remove('gloed');
    const schelpTekst = document.getElementById('ls-schelp-tekst');
    if(schelpTekst) schelpTekst.style.opacity = '0';
    // Pijl/uitlegkader/dim zijn al weggevaagd door de mousedown-capture-
    // listener in lsToonIntroOverlay() (die vuurt eerder dan deze klik)
    setTimeout(()=>{
      lsSchelpStatus = 'paars';
      document.getElementById('ls-schelp-img').src = 'images/schelp-paars.png';
      lsActief = true;
      lsStartTimer();
    }, 200);
    return;
  }

  if(lsSchelpStatus === 'paars'){
    // Paars → check antwoorden
    lsCheckAntwoorden();
    return;
  }

  // Rood: klik wordt genegeerd (2 seconden wachttijd loopt)
}

// ── Antwoorden checken ──
function lsCheckAntwoorden(){
  let alleGoed = true;

  for(let ci = 0; ci < LS_AANTAL; ci++){
    const ring = document.getElementById('ls-ring-'+ci);
    const stempelIdx = lsKoppeling[ci];

    if(stempelIdx >= 0 && lsLanden[stempelIdx].bestand === lsLanden[ci].bestand){
      ring.className = 'ls-ring goed';
    } else {
      ring.className = 'ls-ring fout';
      alleGoed = false;
    }
  }

  if(alleGoed){
    // Gewonnen!
    lsKlaar = true;
    lsStopTimer();
    lsSchelpStatus = 'groen';
    document.getElementById('ls-schelp-wrap').style.display = 'none';
    // Paspoort + Boek der Groten nemen meteen de plek van de schelp-knop in
    // (zelfde vak in #ls-schelp-tijd-groep), zodat de timer erboven niet
    // verspringt.
    document.getElementById('ls-eind-iconen').classList.add('actief');
    document.getElementById('ls-opnieuw-knop').classList.add('actief');

    // Score opslaan
    lsOpslaanScore(huidigeSpelerNaam(), lsTijdVerstreken);

    // Bonus-landenstempels: hoe sneller, hoe meer. Ze worden nu al écht
    // toegekend (aan het paspoort toegevoegd) - alleen het "vliegen" ernaartoe
    // wachten we uit, tot de speler ergens klikt (zie lsStartEindAnimatie()).
    const aantalStempels =
      lsTijdVerstreken < 60000  ? 3 :
      lsTijdVerstreken < 90000  ? 2 :
      lsTijdVerstreken < 180000 ? 1 : 0;
    lsGekozenBonusLanden = kiesBonusLanden(aantalStempels);

    // Bordje laten vallen, met de tijd in een eigen <span> zodat die er
    // straks precies vanaf kan "wegvliegen" (zie lsVliegTijdNaarBoek())
    document.getElementById('ls-bordje-tekst').innerHTML =
      huidigeSpelerNaam() + '<br/><span id="ls-bordje-tijd">' + formatTijdMs(lsTijdVerstreken) + '</span>';
    setTimeout(()=>{
      document.getElementById('ls-bordje-wrap').classList.add('gevallen');
    }, 100);

    // Ringen na 4 sec verbergen
    setTimeout(()=>{
      for(let i=0;i<LS_AANTAL;i++){
        document.getElementById('ls-ring-'+i).className = 'ls-ring';
      }
    }, 4000);

  } else {
    // Fout: schelp wordt rood, na 2 seconden weer paars
    lsSchelpStatus = 'rood';
    document.getElementById('ls-schelp-img').src = 'images/schelp-rood.png';

    setTimeout(()=>{
      // Ringen weghalen
      for(let i=0;i<LS_AANTAL;i++){
        document.getElementById('ls-ring-'+i).className = 'ls-ring';
      }
      // Terug naar paars
      lsSchelpStatus = 'paars';
      document.getElementById('ls-schelp-img').src = 'images/schelp-paars.png';
    }, 2000);
  }
}

// ── Klik-ergens-na-afloop: de tijd vliegt van het bordje naar het Boek
// der Groten-icoon, en (als er bonus-landenstempels gewonnen zijn) die
// vliegen daarna naar het paspoort-icoon. Precies 1x per potje. ──
function lsStartEindAnimatie(){
  if(!lsKlaar || lsEindAnimatieGestart) return;
  lsEindAnimatieGestart = true;

  lsVliegTijdNaarBoek(
    document.getElementById('ls-bordje-tijd'),
    document.getElementById('ls-boek-icoon')
  );

  if(lsGekozenBonusLanden.length){
    toonVliegendeStempels(lsGekozenBonusLanden, document.getElementById('ls-paspoort-icoon'));
  }
}
document.getElementById('ls-speelveld').addEventListener('click', lsStartEindAnimatie);

// Laat een kopie van de tijd wegvliegen vanaf het bordje naar het Boek der
// Groten-icoon toe, kleiner wordend en vervagend - zelfde soort vlucht als
// toonVliegendeStempels() hierboven, maar dan voor tekst i.p.v. een plaatje.
function lsVliegTijdNaarBoek(startEl, doelEl){
  if(!startEl || !doelEl) return;
  const startRect = startEl.getBoundingClientRect();
  const vlieg = document.createElement('div');
  vlieg.className = 'ls-tijd-vlieg';
  vlieg.textContent = startEl.textContent;
  vlieg.style.left = startRect.left+'px';
  vlieg.style.top = startRect.top+'px';
  vlieg.style.width = startRect.width+'px';
  document.body.appendChild(vlieg);
  void vlieg.offsetWidth; // forceert reflow, zodat de transitie echt vanaf hier start

  const doelRect = doelEl.getBoundingClientRect();
  const doelX = doelRect.left + doelRect.width*0.5;
  const doelY = doelRect.top + doelRect.height*0.5;
  vlieg.style.transition = 'left 900ms cubic-bezier(.4,0,.6,1), top 900ms cubic-bezier(.4,0,.6,1), '
    + 'font-size 900ms ease-in, opacity 900ms ease-in';
  vlieg.style.left = (doelX-9)+'px';
  vlieg.style.top = (doelY-9)+'px';
  vlieg.style.fontSize = '8px';
  vlieg.style.opacity = '0.15';
  setTimeout(()=>{ vlieg.remove(); }, 960);
}

// ── Timer ──
function lsStartTimer(){
  lsTijdStart = performance.now() - lsTijdVerstreken;
  lsTimerInterval = setInterval(lsUpdateTimer, 100);
}
function lsStopTimer(){
  if(lsTimerInterval){ clearInterval(lsTimerInterval); lsTimerInterval = null; }
  lsTijdVerstreken = performance.now() - lsTijdStart;
  lsUpdateTimer();
}
function lsUpdateTimer(){
  if(lsTijdStart !== null) lsTijdVerstreken = performance.now() - lsTijdStart;
  document.getElementById('ls-timer-vak').textContent = formatTijdMs(lsTijdVerstreken);
}

// ── Score opslaan ──
function lsOpslaanScore(naam, tijdMs){
  fsOpslaan('scores_landjeschuif', {naam, tijdMs, datum:Date.now()});
}

// ── Navigatie ──
function lsNaarMenu(){
  lsStopTimer();
  document.getElementById('landjeschuif-veld').classList.remove('actief');
  document.getElementById('kader').style.display = '';
  sessionStorage.setItem(VAN_MENU_NAVIGATIE_SLEUTEL, '1');
  window.location.href = 'index.html';
}
function lsNaarSpelkeuze(){
  lsStopTimer();
  document.getElementById('landjeschuif-veld').classList.remove('actief');
  toonSpelkeuze();
}

// ── Init ──
// Zelfde naam-sleutel als index.html: als de speler daar al een naam heeft
// ingevuld (het normale pad), slaan we dit eigen naam-scherm gewoon over.
// Alleen wie via een directe link hier terechtkomt zonder ooit index.html
// bezocht te hebben, ziet dit scherm nog als vangnet.
ladenSpelerNaam();
document.getElementById('speler-waarde').textContent = huidigeSpelerNaam();
bouwKiesScherm();
if((localStorage.getItem(NAAM_SLEUTEL)||'').trim()){
  toonSpelkeuze();
}
</script>
