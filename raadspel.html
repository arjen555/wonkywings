<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Raad het land bij het plaatje — Wereld van Wonderen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Berkshire+Swash&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing:border-box; }
  html, body { width:100vw; height:100vh; margin:0; overflow:hidden; background:#020d1a; font-family:"Segoe UI",sans-serif; user-select:none; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #0a2338 0%, #020d1a 75%);
  }
  /* Alleen tijdens het kiezen van een werelddeel, het spelen van Raad je
     Plaatje en het evalueren achteraf: zie toonScherm() in de JS. */
  body.wereldkaart-achtergrond {
    background:#0a2338 url('images/wereldkaart-achtergrond.jpg') center center / cover no-repeat;
  }

  #kader {
    position:relative;
    width:min(96vw, 96vh*1.2475);
    aspect-ratio:1401/1123;
    background:url('images/interface.jpg') center/contain no-repeat;
    filter:drop-shadow(0 10px 40px rgba(0,0,0,0.6));
  }

  /* ── Linksboven-groep op het "Klaar!"-scherm: de terug-naar-startmenu-knop
     (zelfde afbeelding/grootte als #terug-knop in paspoort.html) met daaronder
     de "nog een ronde"-knop, netjes gestapeld. Staat buiten #kader (zie de
     notitie bij #klaar-paspoort-icoon hieronder voor waarom - #kader's
     drop-shadow-filter breekt position:fixed erbinnen). ── */
  #klaar-linksboven-knoppen {
    display:none; position:fixed; left:14px; top:14px; z-index:150;
    flex-direction:column; align-items:flex-start; gap:10px;
  }
  #klaar-terug-knop, #klaar-nogeenronde-knop {
    width:clamp(150px, 15vw, 260px); border:none; background:none; padding:0;
    cursor:pointer; opacity:0.92; transition:opacity 0.15s, transform 0.15s;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  #klaar-terug-knop img, #klaar-nogeenronde-knop img { width:100%; display:block; }
  #klaar-terug-knop:hover, #klaar-nogeenronde-knop:hover { opacity:1; transform:scale(1.03); }

  /* ── Vaste labels/knoppen bovenin het kader ── */
  #menu-knop {
    position:absolute; left:4%; top:6.5%; width:14%; height:8.5%;
    background:none; border:none; cursor:pointer;
  }

  /* "MENU", "WERELDDEEL:" en "SPELER:" staan al getekend in de achtergrond-
     afbeelding zelf - hier komt dus alleen de WAARDE overheen, netjes op de
     onderstrepingslijn/het vakje eronder, zonder de labeltekst te herhalen. */
  #werelddeel-waarde { position:absolute; left:22.7%; top:14.5%; width:20%; text-align:left; font-family:'Baloo 2',sans-serif; font-weight:700; color:#3b2a18; font-size:clamp(0.75rem, 1.55vw, 1.25rem); }
  #speler-waarde { position:absolute; left:65.1%; top:14%; width:20%; text-align:left; font-family:'Baloo 2',sans-serif; font-weight:700; color:#3b2a18; font-size:clamp(0.75rem, 1.55vw, 1.2rem); }
  #goed-waarde {
    position:absolute; left:72.5%; top:12.5%; width:14.5%; height:6.5%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:800; color:#ffe9a8;
    font-size:clamp(0.9rem, 1.9vw, 1.5rem); text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }

  /* ── Timer: bij de globe rechtsonder ── */
  #timer-vak {
    position:absolute; left:79%; top:69%; width:15%; height:14%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:800; color:#ffe9a8;
    font-size:clamp(1.05rem, 1.9vw, 1.6rem); text-shadow:0 1px 3px rgba(0,0,0,0.7);
    pointer-events:none;
  }
  #timer-vak.gepauzeerd { color:#ff9b4a; }
  #pauze-icoon { position:absolute; left:79%; top:62%; width:15%; text-align:center; font-size:clamp(0.7rem,1.4vw,1.1rem); opacity:0; transition:opacity 0.15s; }
  #pauze-icoon.zichtbaar { opacity:1; }

  /* ── Perkament-inhoudsvak (voor naam/kies/klaar-schermen) ── */
  #perkament-vak {
    position:absolute; left:19.6%; top:27.2%; width:59.3%; height:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:1.5% 3%;
    overflow:hidden;
  }

  /* ── Spelscherm: los van het perkament, groter (tot waar voorheen de
     rode pijl wees) en met een blokkentoren links van de illustratie. ── */
  #scherm-spel {
    position:absolute; left:19.6%; top:24%; width:59.3%; height:60%;
    gap:3%;
  }
  #scherm-spel.actief { display:flex; flex-direction:row; align-items:stretch; justify-content:center; }
  #blokkentoren { width:8%; height:100%; display:flex; flex-direction:column-reverse; gap:2%; flex-shrink:0; }
  .blok-img { width:100%; flex:1; min-height:0; object-fit:contain; }

  .scherm { display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:center; }
  .scherm.actief { display:flex; }

  /* — Naam-scherm (allereerste scherm) — */
  .naam-titel {
    font-family:'Baloo 2',sans-serif; font-weight:800; color:#3b2a18;
    font-size:clamp(1rem,2.2vw,1.7rem); text-align:center; margin-bottom:5%;
    max-width:90%; line-height:1.3;
  }
  #scherm-naam input, #scherm-woord input {
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(0.85rem,1.8vw,1.3rem);
    border:2px solid #8a6a3a; border-radius:10px; padding:8px 16px; background:#fffaf0; color:#3b2a18;
    width:60%; max-width:20em; text-align:center; margin-bottom:4%;
  }
  /* — Geheim-woordje-scherm: voorkomt dat iemand een bestaande naam kan
     "stelen" door 'm gewoon in te typen. Zelfde opzet als #scherm-naam. — */
  .woord-fout {
    font-family:'Baloo 2',sans-serif; font-weight:700; color:#b03a2a;
    font-size:clamp(0.7rem,1.4vw,0.95rem); text-align:center;
    max-width:90%; min-height:1.3em; margin:-2% 0 4%; opacity:0; transition:opacity 0.2s;
  }
  .woord-fout.zichtbaar { opacity:1; }
  #scherm-woord .actie-btn.secundair { margin-top:3%; }

  /* — Categorie-kiesscherm — */
  #scherm-kies { justify-content:flex-start; overflow-y:auto; }
  .kies-titel { font-family:'Baloo 2',sans-serif; font-weight:800; color:#3b2a18; font-size:clamp(0.95rem,2vw,1.55rem); margin:0 0 2.5%; text-align:center; }
  .kies-groep-kop { font-family:'Baloo 2',sans-serif; font-weight:800; color:#5a3a1a; font-size:clamp(0.8rem,1.6vw,1.25rem);
    margin:2% 0 1%; width:100%; border-bottom:2px solid rgba(90,58,26,0.3); padding-bottom:2px; }
  .kies-lijst { display:flex; flex-direction:column; gap:3px; width:100%; margin-bottom:2%; }
  .kies-rij {
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:rgba(90,58,26,0.08); border:1px solid rgba(90,58,26,0.25); border-radius:8px;
    padding:4px 8px; cursor:pointer; transition:background 0.15s;
  }
  .kies-rij:hover { background:rgba(90,58,26,0.18); }
  .kies-naam { font-family:'Baloo 2',sans-serif; font-weight:700; color:#3b2a18; font-size:clamp(0.7rem,1.5vw,1.1rem); }
  .kies-aantal { font-size:clamp(0.5rem,0.9vw,0.7rem); color:#7a5a30; margin-left:6px; }
  .kies-scores-btn { background:none; border:none; cursor:pointer; font-size:clamp(0.7rem,1.3vw,1rem); }

  /* — Spelscherm — */
  #land-illustratie-kolom { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0; min-height:0; height:100%; }
  #plek-naam-label { display:none; font-family:'Baloo 2',sans-serif; font-weight:800; color:#3b2a18; font-size:clamp(0.85rem,1.9vw,1.4rem); text-align:center; margin-top:3%; margin-bottom:1.5%; text-shadow:0 1px 2px rgba(255,255,255,0.4); }
  #land-illustratie-wrap { flex:1; display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; width:100%; }
  #land-illustratie {
    max-width:96%; max-height:100%; object-fit:contain; border-radius:10px;
    box-shadow:0 4px 16px rgba(0,0,0,0.35); transition:box-shadow 0.15s;
    cursor:url('images/vergrootglas.png') 32 32, zoom-in;
  }
  #land-illustratie:hover { box-shadow:0 4px 20px rgba(0,0,0,0.5); }
  #land-illustratie.antwoord-goed {
    box-shadow:0 0 0 6px #4caf50, 0 4px 20px rgba(0,0,0,0.5);
    transition:box-shadow 0.2s;
  }
  #land-illustratie.antwoord-fout {
    box-shadow:0 0 0 6px #e05353, 0 4px 20px rgba(0,0,0,0.5);
    transition:box-shadow 0.2s;
  }
  /* Uitvergrote illustratie: los van het perkament, over het hele kader,
     de kaderrand én de antwoordbalken heen — vult het scherm van boven naar
     onder. Nogmaals klikken of Escape brengt 'm terug naar normaal. */
  #illustratie-achtergrond {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:999; cursor:url('images/vergrootglas.png') 32 32, zoom-out;
  }
  #illustratie-achtergrond.actief { display:block; }
  #land-illustratie.uitvergroot {
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    max-width:100vw; max-height:100vh; object-fit:contain;
    z-index:1000; cursor:url('images/vergrootglas.png') 32 32, zoom-out;
    box-shadow:0 10px 50px rgba(0,0,0,0.7); border-radius:0;
  }

  /* ── Antwoordknoppen: los van het perkament, exact over de 4 getekende
     balken in de achtergrondafbeelding (2 boven, 2 onder, links en rechts
     van het kompas-ornament). Een zachte, halfdoorzichtige tint (altijd
     zichtbaar, niet alleen bij hover) laat duidelijker zien dat dit de 4
     te kiezen opties zijn, zonder de getekende balk te overschreeuwen. ── */
  #antwoorden-grid { position:absolute; inset:0; pointer-events:none; display:none; }
  #antwoorden-grid.actief { display:block; }
  .antwoord-btn {
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(0.85rem,1.9vw,1.5rem);
    color:#3b2a18; background:rgba(255,244,214,0.32);
    box-shadow:inset 0 0 0 1.5px rgba(90,58,26,0.4);
    border:none; border-radius:8px;
    padding:0 4%; pointer-events:auto; overflow:hidden;
    cursor:pointer; transition:background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .antwoord-btn.plek-0 { left:20.4%; top:87.4%; width:19.4%; height:3.3%; }
  .antwoord-btn.plek-1 { left:58.5%; top:87.4%; width:19.4%; height:3.3%; }
  .antwoord-btn.plek-2 { left:20.4%; top:93.0%; width:19.4%; height:3.1%; }
  .antwoord-btn.plek-3 { left:58.5%; top:93.0%; width:19.4%; height:3.1%; }
  .antwoord-btn:hover:not(:disabled) { background:rgba(255,244,214,0.55); box-shadow:inset 0 0 0 2px rgba(90,58,26,0.6); }
  .antwoord-btn:disabled { cursor:default; }
  .antwoord-btn.goed { background:rgba(143,199,102,0.55); color:#1e3a0e; box-shadow:inset 0 0 0 1.5px rgba(30,58,14,0.5); }
  .antwoord-btn.fout { background:rgba(217,105,92,0.55); color:#4a0f08; box-shadow:inset 0 0 0 1.5px rgba(74,15,8,0.5); }

  /* — Resultaatscherm — */
  /* Dit scherm laat de inhoud (i.p.v. de standaard verticale centrering van
     .scherm) bovenaan beginnen, zodat "Klaar!" en de score meteen zichtbaar
     zijn - en er onderin ruimte overblijft voor de gewonnen stempels en de
     scorelijst, zonder dat alles in het midden van de kaart samenklontert. */
  #scherm-klaar { justify-content:flex-start; padding-top:1.5%; }
  #klaar-titel { font-family:'Baloo 2',sans-serif; font-weight:800; color:#3b2a18; font-size:clamp(1.3rem,2.6vw,2rem); margin:0 0 1%; text-align:center; }
  #klaar-resultaat { font-family:'Baloo 2',sans-serif; font-weight:700; color:#5a3a1a; font-size:clamp(1rem,2vw,1.5rem); margin-bottom:2%; text-align:center; }
  #klaar-stempel { font-family:'Baloo 2',sans-serif; font-weight:800; color:#8a4a10; font-size:clamp(0.95rem,1.9vw,1.4rem); margin-bottom:1%; text-align:center; line-height:1.35; min-height:1.3em; white-space:pre-line; }
  /* Rij met net-gewonnen stempels: staat nu IN de kaart zelf (i.p.v. los
     bovenaan het hele scherm), zodat je 'm meteen ziet voordat hij na
     STEMPEL_VLIEG_PAUZE_MS naar het paspoort-icoontje wegvliegt. */
  #klaar-stempel-rij { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; min-height:0; }
  #klaar-stempel-rij:not(:empty) { margin-bottom:2%; }
  #scorebord-lijst { width:100%; max-height:55%; overflow-y:auto; margin-bottom:2%; }
  .score-rij { display:flex; align-items:center; gap:8px; padding:2px 6px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(0.85rem,1.7vw,1.25rem); color:#3b2a18; }
  .score-rij.eigen { background:rgba(255,215,0,0.25); border-radius:6px; }
  .score-plek { width:1.6em; text-align:right; color:#7a5a30; }
  .score-naam { flex:1; }
  .score-goed { width:3.2em; text-align:right; }
  .score-tijd { width:3.6em; text-align:right; }
  .score-leeg { font-family:'Baloo 2',sans-serif; font-weight:700; color:#7a5a30; font-size:clamp(0.9rem,1.7vw,1.3rem); font-style:italic; }
  .actie-btn {
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(0.55rem,1.1vw,0.9rem);
    color:#fff6d8; background:linear-gradient(180deg,#3a6a4a,#1e4a2e);
    border:1.5px solid rgba(255,215,0,0.5); border-radius:10px; padding:6px 14px; cursor:pointer;
  }
  .actie-btn:hover { filter:brightness(1.15); }
  .actie-btn.secundair { background:linear-gradient(180deg,#5a4a30,#3a2e1a); }

  /* ── Landenpaspoort-icoontje bij het "Klaar!"-scherm: los van het kader
     gepositioneerd (position:fixed, rechtsonder in het hele scherm), zelfde
     opzet en grootte als in index.html, zodat het overal consistent is. ── */
  #klaar-paspoort-icoon {
    display:none; position:fixed; right:clamp(16px, 3vw, 40px); bottom:clamp(16px, 3vw, 40px);
    width:min(252px, 24vw); cursor:pointer; z-index:150;
    filter:drop-shadow(0 6px 20px rgba(0,0,0,0.55));
    transition:transform 0.15s;
  }
  #klaar-paspoort-icoon:hover { transform:scale(1.06); }

  /* ── Landenpaspoort: rijtje met net verdiende stempels, bovenaan het
     scherm, dat na een korte pauze naar het paspoort-icoontje toe vliegt
     (zie toonVliegendeStempels()). Zelfde opzet als in index.html. ── */
  .stempel-vlieg-rij {
    position:fixed; top:4vh; left:50%; transform:translateX(-50%);
    z-index:900; display:flex; flex-wrap:wrap; justify-content:center;
    gap:14px; max-width:80vw;
    opacity:0; transition:opacity 0.35s ease;
    pointer-events:none;
  }
  /* Op het Klaar-scherm van Raad je plaatje staat de rij IN de kaart zelf
     (zie #klaar-stempel-rij hierboven) i.p.v. los boven het hele scherm -
     de positionering hierboven wordt dan ongedaan gemaakt. De losse
     plaatjes worden ook wat kleiner, passend bij de kleinere kaart. */
  .stempel-vlieg-rij.inline {
    position:static; top:auto; left:auto; transform:none; max-width:100%;
  }
  .stempel-vlieg-rij.inline .stempel-vlieg-plaatje { width:min(9vw, 60px); }
  .stempel-vlieg-rij.zichtbaar { opacity:1; }
  .stempel-vlieg-plaatje {
    width:min(15vw, 96px); aspect-ratio:1/1; object-fit:cover;
    border-radius:50%; z-index:900;
    box-shadow:0 0 0 4px rgba(255,246,200,0.92), 0 8px 22px rgba(0,0,0,0.55);
  }

  ::-webkit-scrollbar { width:12px; }
  ::-webkit-scrollbar-thumb { background:rgba(90,58,26,0.55); border-radius:6px; }

  /* ── Spelkeuze-scherm (Raad je Plaatje / Landje Schuif) ── */
  /* ── Spelkeuze-scherm: fullscreen, buiten #kader ── */
  #spelkeuze-veld {
    display:none; position:fixed; inset:0; z-index:200;
    background:#020d1a;
    align-items:center; justify-content:center;
  }
  #spelkeuze-veld.actief { display:flex; }
  #spelkeuze-wrap {
    position:relative;
    width:min(96vw, 96vh * 1.5);
    aspect-ratio:3/2;
    background:url('images/keuzescherm.jpg') center/contain no-repeat;
  }
  .spelkeuze-knop {
    position:absolute; top:23%; height:46%; border:none; background:none;
    cursor:pointer; border-radius:16px;
    transition:background 0.15s;
  }
  .spelkeuze-knop:hover { background:rgba(255,255,255,0.12); }
  #btn-keuze-raadjeplaatje { left:21%; width:28%; }
  #btn-keuze-landjeschuif  { left:51%; width:28%; }

  /* Menu-knop linksboven op het keuzescherm — zelfde stijl en grootte als #ls-menu-knop */
  #spelkeuze-menu-knop {
    position:absolute; left:3%; top:3%;
    width:clamp(120px, 15%, 220px);
    border:none; background:none; padding:0; cursor:pointer;
    z-index:60; opacity:0.92;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    transition:opacity 0.15s, transform 0.15s;
  }
  #spelkeuze-menu-knop:hover { opacity:1; transform:scale(1.03); }
  #spelkeuze-menu-knop img { width:100%; display:block; }

  /* ── Landje Schuif ── */
  #landjeschuif-veld {
    display:none; position:fixed; inset:0; z-index:200;
    background:#020d1a;
    align-items:center; justify-content:center;
  }
  #landjeschuif-veld.actief { display:flex; }
  #ls-speelveld {
    position:relative;
    width:min(96vw, 96vh * 1.5);
    aspect-ratio:3/2;
    background:url('images/landjeschuif-achtergrond.jpg') center/contain no-repeat;
    overflow:hidden;
    transition:filter 0.6s ease;
  }
  /* Tijdens het tonen van de start-pijl: de rest van het speelveld (incl.
     achtergrond) even laag contrast/helderheid, zodat de pijl er extra
     uitspringt. De pijl zelf compenseert dit met een tegengesteld filter
     (zie #ls-start-pijl / de ls-pijl-oplichten animatie), zodat híj als
     enige gewoon normaal blijft ogen. */
  #ls-speelveld.pijl-toont { filter:contrast(0.55) brightness(0.7); }

  /* Cirkels met landnaam — gecentreerd via transform */
  .ls-cirkel {
    position:absolute; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    text-align:center; pointer-events:none;
    font-family:'Baloo 2',sans-serif; font-weight:700;
    color:#3b2a18; font-size:clamp(0.7rem,1.7vw,1.15rem);
    line-height:1.15; padding:0.35em;
    word-break:break-word;
    transform:translate(-50%,-50%);
  }
  /* Feedback-ringen (goed/fout) — gecentreerd via transform.
     z-index MOET hoger zijn dan alle .ls-stempel-varianten (max 50),
     anders zit de ring altijd verstopt ónder het stempel. */
  .ls-ring {
    position:absolute; border-radius:50%; pointer-events:none;
    z-index:55;
    border:clamp(20px, 3.6vw, 44px) solid transparent; opacity:0;
    box-shadow:0 0 0 4px rgba(255,255,255,0.9);
    transition:opacity 0.25s;
    transform:translate(-50%,-50%);
  }
  .ls-ring.goed { border-color:#4caf50; opacity:1; }
  .ls-ring.fout { border-color:#e05353; opacity:1; }

  /* Stempels (sleepbaar) */
  .ls-stempel {
    position:absolute; touch-action:none;
    cursor:grab; z-index:10;
    transition:transform 0.15s;
  }
  .ls-stempel.vergroot { z-index:45; }
  .ls-stempel.slepen { cursor:grabbing; z-index:50; transition:none; }
  .ls-stempel.gesnapt {
    cursor:grab; z-index:5;
    transition:left 0.2s, top 0.2s, transform 0.15s;
  }
  .ls-stempel img {
    width:100%; height:100%; object-fit:contain;
    pointer-events:none; border-radius:50%;
    box-shadow:0 3px 10px rgba(0,0,0,0.4);
  }

  /* Grote pijl die bij start van het spel even naar de groene knop wijst,
     en één keer oplicht om extra op te vallen tegen de drukke achtergrond */
  #ls-start-pijl {
    position:absolute;
    right:19%; bottom:5.5%;
    width:clamp(210px, 51vw, 580px);
    aspect-ratio:640/431;
    z-index:70;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.6s ease;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  #ls-start-pijl.zichtbaar {
    opacity:1;
    animation:ls-pijl-oplichten 1.6s ease-out;
    animation-fill-mode:forwards;
  }
  /* De contrast(1.818)/brightness(1.43)-factoren heffen precies op wat
     #ls-speelveld.pijl-toont eronder dimt (contrast 0.55 x 1.818 = 1,
     brightness 0.7 x 1.43 = 1) — zo blijft de pijl zelf normaal ogen
     terwijl de rest van het speelveld gedimd is. animation-fill-mode:
     forwards houdt dat vast na de eerste oplicht-flits (0-1,6s), voor de
     hele periode dat de pijl daarna nog in beeld blijft. */
  @keyframes ls-pijl-oplichten {
    0%   { filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5)) contrast(1.818) brightness(1.43); }
    35%  { filter:drop-shadow(0 0 45px rgba(255,241,150,0.95)) contrast(1.818) brightness(2.43); }
    100% { filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5)) contrast(1.818) brightness(1.43); }
  }

  /* Uitlegkader linksboven de cirkels — zelfde intro-overlay als de pijl:
     verschijnt bij start, blijft staan tot de eerste klik/tik. Nu een kant-
     en-klare illustratie (tekst zit in het plaatje gebakken), i.p.v. een
     los CSS-vlak met een <ul>. Krijgt dezelfde contrast/brightness-
     compensatie als de pijl, anders wordt het plaatje door
     #ls-speelveld.pijl-toont zelf ook gedimd en minder leesbaar. */
  #ls-uitleg-kader {
    position:absolute;
    left:6.5%; top:50%;
    transform:translateY(-50%);
    width:clamp(300px, 58%, 980px);
    aspect-ratio:640/420;
    z-index:69;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.6s ease;
    filter:contrast(1.818) brightness(1.43);
  }
  #ls-uitleg-kader.zichtbaar { opacity:1; }

  /* Schelp + timer samen, rechtsonder — timer als platte tekst boven de schelp */
  #ls-schelp-tijd-groep {
    position:absolute; right:3%; bottom:3%;
    width:clamp(180px, 30%, 300px);
    display:flex; flex-direction:column; align-items:center; gap:4%;
    z-index:65;
  }
  #ls-timer-vak {
    font-family:'Baloo 2',sans-serif; font-weight:800;
    color:#ffffff; font-size:clamp(2rem,4vw,3.2rem);
    text-shadow:
      -2px -2px 0 #1a1005, 2px -2px 0 #1a1005,
      -2px 2px 0 #1a1005, 2px 2px 0 #1a1005,
      0 4px 12px rgba(0,0,0,0.55);
    pointer-events:none;
  }
  #ls-schelp-wrap {
    position:relative;
    width:100%; cursor:pointer;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    transition:transform 0.12s;
  }
  #ls-schelp-wrap:hover { transform:scale(1.06); }
  #ls-schelp-wrap:active { transform:scale(0.95); }
  #ls-schelp-img { width:100%; display:block; }
  /* Glow-animatie bij start */
  @keyframes ls-schelp-puls {
    0%, 100% { filter:drop-shadow(0 0 10px rgba(255,220,80,0.5)) drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
    50% { filter:drop-shadow(0 0 28px rgba(255,220,80,0.95)) drop-shadow(0 0 50px rgba(255,180,0,0.35)) drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
  }
  #ls-schelp-wrap.gloed { animation:ls-schelp-puls 1.4s ease-in-out infinite; }
  /* Instructietekst onder de schelp */
  #ls-schelp-tekst {
    position:absolute; top:110%; left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    font-family:'Baloo 2',sans-serif; font-weight:700;
    color:#fffbe6; font-size:clamp(0.55rem,1.1vw,0.85rem);
    text-shadow:0 2px 8px rgba(0,0,0,0.85);
    text-align:center; pointer-events:none;
    transition:opacity 0.3s;
  }

  /* Spelernaam rechts op het zand, groot en zwierig */
  #ls-speler-vak {
    position:absolute; right:5%; top:38%;
    transform:rotate(-5deg);
    font-family:'Berkshire Swash',serif; font-weight:400;
    color:#5a3d1a; font-size:clamp(2.8rem,7vw,5.5rem);
    text-shadow:0 2px 4px rgba(0,0,0,0.2), 0 0 12px rgba(255,240,180,0.3);
    z-index:3; pointer-events:none;
    letter-spacing:0.03em;
    max-width:30%;
    text-align:center;
    word-break:break-word;
  }

  /* Menu-knop linksboven (terug-naar-start-knop) +, pas zichtbaar zodra
     een potje klaar is, de octopus-knop eronder om meteen opnieuw te
     spelen (nieuwe 9 landen, geen paginaherlaad) */
  #ls-menu-groep {
    position:absolute; left:3%; top:3%;
    /* Breedte hier vast zetten (i.p.v. op de knoppen zelf) — anders heeft
       de 15% hieronder niets om tegenaan te schalen (deze groep zelf had
       geen breedte), en valt de knop terug op een te kleine maat. */
    width:clamp(120px, 15%, 220px);
    display:flex; flex-direction:column; gap:10px;
    z-index:60;
  }
  #ls-menu-knop, #ls-opnieuw-knop {
    width:100%;
    border:none; background:none; padding:0; cursor:pointer;
    opacity:0.92;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    transition:opacity 0.15s, transform 0.15s;
  }
  #ls-menu-knop:hover, #ls-opnieuw-knop:hover { opacity:1; transform:scale(1.03); }
  #ls-menu-knop img, #ls-opnieuw-knop img { width:100%; display:block; }
  #ls-opnieuw-knop { display:none; }
  #ls-opnieuw-knop.actief { display:block; }

  /* Bordje (valt naar beneden) */
  #ls-bordje-wrap {
    position:absolute; left:50%; top:-100%;
    transform:translateX(-50%);
    width:clamp(312px, 57.6%, 576px);
    z-index:80; pointer-events:none;
    transition:top 0.8s cubic-bezier(0.22,1,0.36,1);
  }
  #ls-bordje-wrap.gevallen { top:24%; }
  #ls-bordje-wrap img { width:100%; display:block; }
  /* Positie is afgestemd op het plankje in het nieuwe bordje.png (langere
     touwen, plankje zelf staat rond 70-88% van de hoogte van de afbeelding) */
  #ls-bordje-tekst {
    position:absolute; left:50%; top:79%;
    transform:translate(-50%,-50%) rotate(-3deg);

  }
  /* Tijd los en veel groter dan de naam erboven */
  #ls-bordje-tijd {

  /* Paspoort + Boek der Groten naast elkaar, in de plek waar de schelp-
     knop stond zodra het potje klaar is (zelfde rij als de timer erboven,

  #ls-eind-iconen {

  /* Tekstkopie van de tijd die na een klik vanaf het bordje naar het
     Boek der Groten-icoon vliegt (zie lsVliegTijdNaarBoek()) */
  .ls-tijd-vlieg {

</style>

<script>
// ── Categorieën: exacte kopie van de landenlijsten uit index.html (MENU).
// Let op bij toekomstige aanpassingen aan categorieën in index.html: deze
// lijst hier moet dan handmatig mee worden bijgewerkt (zie ook de notitie
// in index.html zelf bij de MENU-definitie).
// Plekken-data voor de categorie 'Iconische plekken': exacte kopie van de
// PLEKKEN-array in index.html (naam/bestand/land). Bij toekomstige nieuwe
// iconische plekken moet deze lijst hier handmatig worden bijgewerkt.
const PLEKKEN_DATA = [{"naam": "Eiffeltoren", "bestand": "Eiffeltoren", "land": "Frankrijk"}, {"naam": "Colosseum", "bestand": "Colosseum", "land": "Italië"}, {"naam": "Stonehenge", "bestand": "Stonehenge", "land": "Verenigd Koninkrijk"}, {"naam": "Akropolis", "bestand": "Akropolis", "land": "Griekenland"}, {"naam": "Sagrada Família", "bestand": "Sagrada_Familia", "land": "Spanje"}, {"naam": "Scheve toren van Pisa", "bestand": "Toren_van_Pisa", "land": "Italië"}, {"naam": "Geysir", "bestand": "Geysir", "land": "IJsland"}, {"naam": "Geirangerfjord", "bestand": "Geirangerfjord", "land": "Noorwegen"}, {"naam": "Pompeii", "bestand": "Pompeii", "land": "Italië"}, {"naam": "Neuschwanstein", "bestand": "Neuschwanstein", "land": "Duitsland"}, {"naam": "Loch Ness", "bestand": "Loch_Ness", "land": "Verenigd Koninkrijk"}, {"naam": "Tower Bridge", "bestand": "Tower_Bridge", "land": "Verenigd Koninkrijk"}, {"naam": "Kinderdijk", "bestand": "Kinderdijk", "land": "Nederland"}, {"naam": "Atomium", "bestand": "Atomium", "land": "België"}, {"naam": "Efteling", "bestand": "Efteling", "land": "Nederland"}, {"naam": "Disneyland Paris", "bestand": "Disneyland_Paris", "land": "Frankrijk"}, {"naam": "Legoland Billund", "bestand": "Legoland_Billund", "land": "Denemarken"}, {"naam": "Walt Disney World", "bestand": "Walt_Disney_World", "land": "Verenigde Staten"}, {"naam": "Piramides van Gizeh", "bestand": "Piramides_van_Gizeh", "land": "Egypte"}, {"naam": "Victoriawatervallen", "bestand": "Victoriawatervallen", "land": "Zimbabwe"}, {"naam": "Kilimanjaro", "bestand": "Kilimanjaro", "land": "Tanzania"}, {"naam": "Tafelberg", "bestand": "Tafelberg", "land": "Zuid-Afrika"}, {"naam": "Taj Mahal", "bestand": "Taj_Mahal", "land": "India"}, {"naam": "Grote Muur van China", "bestand": "Grote_Muur", "land": "China"}, {"naam": "Mount Everest", "bestand": "Mount_Everest", "land": "Nepal"}, {"naam": "Angkor Wat", "bestand": "Angkor_Wat", "land": "Cambodja"}, {"naam": "Petra", "bestand": "Petra", "land": "Jordanië"}, {"naam": "Fuji", "bestand": "Fuji", "land": "Japan"}, {"naam": "Burj Khalifa", "bestand": "Burj_Khalifa", "land": "Verenigde Arabische Emiraten"}, {"naam": "Terracottaleger", "bestand": "Terracottaleger", "land": "China"}, {"naam": "Plein van de Hemelse Vrede", "bestand": "Plein_van_de_Hemelse_Vrede", "land": "China"}, {"naam": "Kremlin", "bestand": "Kremlin", "land": "Rusland"}, {"naam": "Dode Zee", "bestand": "Dode_Zee", "land": "Jordanië"}, {"naam": "Vrijheidsbeeld", "bestand": "Vrijheidsbeeld", "land": "Verenigde Staten"}, {"naam": "Grand Canyon", "bestand": "Grand_Canyon", "land": "Verenigde Staten"}, {"naam": "Chichén Itzá", "bestand": "Chichen_Itza", "land": "Mexico"}, {"naam": "Niagarawatervallen", "bestand": "Niagarawatervallen", "land": "Canada"}, {"naam": "Golden Gate Bridge", "bestand": "Golden_Gate_Bridge", "land": "Verenigde Staten"}, {"naam": "Mount Rushmore", "bestand": "Mount_Rushmore", "land": "Verenigde Staten"}, {"naam": "Machu Picchu", "bestand": "Machu_Picchu", "land": "Peru"}, {"naam": "Christus de Verlosser", "bestand": "Christus_de_Verlosser", "land": "Brazilië"}, {"naam": "Nazca-lijnen", "bestand": "Nazca-lijnen", "land": "Peru"}, {"naam": "Sydney Opera House", "bestand": "Sydney_Opera_House", "land": "Australië"}, {"naam": "Uluru", "bestand": "Uluru", "land": "Australië"}, {"naam": "Moai (Paaseiland)", "bestand": "Moai_Paaseiland", "land": "Chili"}, {"naam": "Great Barrier Reef", "bestand": "Great_Barrier_Reef", "land": "Australië"}];
const PLEKKEN_BIJ_NAAM = {};
for(const p of PLEKKEN_DATA) PLEKKEN_BIJ_NAAM[p.naam] = p;

// Testaccounts: scores worden gewoon opgeslagen maar nooit getoond.
const TEST_NAMEN = ['test1','test2'];
function isTestNaam(n){ return TEST_NAMEN.includes((n||'').toLowerCase().trim()); }

// ── Online scorebord (Firestore) — gedeelde helpers ─────────────────────
// Zelfde opzet als in index.html, zie de toelichting daar. fsOpslaan() is
// "fire-and-forget" (de speler wacht niet op de server); fsTopN() haalt de
// beste 'aantal' runs op uit één collectie, gefilterd/gesorteerd, en
// plakt de zojuist gespeelde ronde er lokaal bij als die er nog niet in
// zit - zo is je eigen resultaat altijd meteen zichtbaar.
async function fsOpslaan(collectieNaam, data){
  try{
    const fb = await window.wvwFirebaseGereed;
    await fb.addDoc(fb.collection(fb.db, collectieNaam), data);
  }catch(e){
    console.warn('Kon score niet online opslaan ('+collectieNaam+'):', e);
  }
}
async function fsTopN(collectieNaam, gelijkVeld, gelijkWaarde, orderVelden, vergelijker, aantal, nieuweRun){
  let lijst = [];
  try{
    const fb = await window.wvwFirebaseGereed;
    const orderClauses = orderVelden.map(([veld,richting])=>fb.orderBy(veld, richting));
    const q = fb.query(fb.collection(fb.db, collectieNaam),
      fb.where(gelijkVeld, '==', gelijkWaarde), ...orderClauses, fb.limit(aantal));
    const snap = await fb.getDocs(q);
    snap.forEach(doc=>lijst.push(doc.data()));
  }catch(e){
    console.warn('Kon scores niet online ophalen ('+collectieNaam+'):', e);
  }
  if(nieuweRun && !lijst.some(r=>r.naam===nieuweRun.naam && r.datum===nieuweRun.datum)){
    lijst.push(nieuweRun);
  }
  lijst.sort(vergelijker);
  return lijst;
}
// Aanvraag-ID: voorkomt dat een trage/oude scorebord-aanvraag een
// inmiddels alweer nieuwer geopend scorebord overschrijft.
let scorebordAanvraagId = 0;

// ── Filter tegen kwetsende/aanstootgevende namen ────────────────────────
// Geen waterdicht systeem (dat bestaat niet écht), maar houdt het gros
// tegen. Normaliseert eerst (kleine letters, accenten weg, spaties/
// leestekens weg, een paar bekende cijfer-voor-letter-trucjes zoals
// "k4nker") en checkt daarna op een lijst met veelvoorkomende Nederlandse

const ONGEPASTE_WOORDEN = [
  'kanker','kut','klote','klootzak','lul','hoer','hoertje','slet',
  'trut','tering','teringlijer','tyfus','pleuris','flikker','mongool',
  'mongo','achterlijk','debiel','spast','spasti','nikker','neger',
  'poepchinees','kutmarokkaan','kankerlijer','hitler','nazi','terrorist',
  'fuck','shit','bitch','whore','slut','nigger','nigga','faggot','retard',
  'cunt','asshole','bastard','penis','vagina','porno',
];
function normaliseerVoorFilter(tekst){
  return (tekst||'')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'') // accenten weg (bv. ë → e)
    .replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/7/g,'t')
    .replace(/[^a-z]/g,''); // spaties, cijfers, leestekens etc. weg
}
function bevatOngepasteTaal(naam){
  const genormaliseerd = normaliseerVoorFilter(naam);
  if(!genormaliseerd) return false;
  return ONGEPASTE_WOORDEN.some(woord => genormaliseerd.includes(woord));
}

// De "klein maar fijn"-landen (unie van de Europa- en Wereld-lijst - de
// Wereld-lijst bevat toevallig al alle 7 Europese) als bestandsnamen, de
// prioriteitspool voor verrassingsstempels bij Hoofdsteden/Plekken/Raadspel.
const KLEIN_MAAR_FIJN_BESTANDEN = ["Tonga", "Samoa", "Salomonseilanden", "Tuvalu", "Nauru", "Micronesia", "Palau", "Vanuatu", "Nieuw-Caledonie", "Frans-Polynesie", "Trinidad_en_Tobago", "Grenada", "Barbados", "Saint_Lucia", "Dominica", "Antigua_en_Barbuda", "Saint_Kitts_en_Nevis", "Seychellen", "Comoren", "Sao_Tome_en_Principe", "Kaapverdie", "Mauritius", "Maldiven", "San_Marino", "Vaticaanstad", "Monaco", "Andorra", "Liechtenstein", "Malta", "Faroer", "Brunei", "Falklandeilanden"];

// Stempels horen bij de speler die nu is ingelogd (de naam uit het
// naamscherm) - anders deelt iedereen die op dit apparaat speelt hetzelfde
// paspoort, ongeacht welke naam er is ingevuld. De opslag-sleutel wordt
// daarom per naam opgebouwd, met dezelfde sleutel als het naamscherm zelf
// gebruikt (NAAM_SLEUTEL, verderop in dit bestand).
function stempelsSleutelVoorSpeler(){
  const naam = localStorage.getItem(NAAM_SLEUTEL) || 'Speler';
  return 'wonkywings_verdiende_stempels::' + naam;
}
function geefVerdiendeStempels(){
  try{ return JSON.parse(localStorage.getItem(stempelsSleutelVoorSpeler())||'[]'); }catch(e){ return []; }
}
// Zoekt de paspoort-ingang bij een landnaam zoals die in het spel gebruikt
// wordt. Eerst op exacte naam (dekt verreweg de meeste landen), dan op
// bestandsnaam via landNaarBestand (dekt een handjevol landen waar de
// spelnaam net anders gespeld is dan de paspoort-naam, zoals
// "Bosnië-Herzegovina" hier tegenover "Bosnië en Herzegovina" in het
// paspoort). Geeft null als het land nog geen eigen paspoortpagina heeft.
function paspoortEntryVoorLand(naam){
  let entry = PASPOORT_LANDEN.find(p=>p.naam===naam);
  if(entry) return entry;
  const b = landNaarBestand(naam);
  return PASPOORT_LANDEN.find(p=>p.bestand===b) || null;
}
// Registreert een stempel voor het land met deze spelnaam (Europa/Wereld:
// direct bij een juiste vlaggetje-drop). Bestaat het land niet in het
// paspoort, of was de stempel al verdiend: geen actie, geeft dan null terug.
function verdienStempelVoorLand(naam){
  const entry = paspoortEntryVoorLand(naam);
  if(!entry) return null;
  const lijst = geefVerdiendeStempels();
  if(lijst.includes(entry.bestand)) return null;
  lijst.push(entry.bestand);
  localStorage.setItem(stempelsSleutelVoorSpeler(), JSON.stringify(lijst));
  return entry;
}
// Kiest 'aantal' nieuwe verrassingslanden (nog niet verdiend) als beloning
// bij Hoofdsteden/Plekken/Raadspel: eerst uit de klein-maar-fijn-pool,
// pas als die leeg is uit de rest van het paspoort, willekeurig binnen elke
// pool. Voegt ze meteen toe aan de verdiende stempels en geeft de gekozen
// paspoort-entries terug (minder dan 'aantal', of leeg, als het paspoort al
// (bijna) helemaal vol zit).
function kiesBonusLanden(aantal){
  const lijst = geefVerdiendeStempels();
  const nogNiet = (bestanden) => shuffle(bestanden.filter(b=>!lijst.includes(b)));
  const overigeBestanden = PASPOORT_LANDEN.map(p=>p.bestand).filter(b=>!KLEIN_MAAR_FIJN_BESTANDEN.includes(b));
  const volgorde = [...nogNiet(KLEIN_MAAR_FIJN_BESTANDEN), ...nogNiet(overigeBestanden)];
  const gekozenBestanden = volgorde.slice(0, aantal);
  gekozenBestanden.forEach(b=>lijst.push(b));
  if(gekozenBestanden.length) localStorage.setItem(stempelsSleutelVoorSpeler(), JSON.stringify(lijst));
  return gekozenBestanden.map(b=>PASPOORT_LANDEN.find(p=>p.bestand===b));
}
// Bouwt de tekst voor een eindscherm op basis van de daadwerkelijk gekozen
// bonuslanden (kan minder zijn dan bedoeld, als het paspoort bijna vol is).
// 'drempelBereikt' = de speler haalde genoeg goed voor minstens 1 stempel;
// 'bijnaTekst' is de tekst als de drempel niet gehaald werd.
function stempelMeldingTekst(drempelBereikt, gekozenLanden, bijnaTekst){
  if(gekozenLanden.length >= 2){
    return 'Wat een score!\nJe wint zelfs 2 landenstempels voor '+gekozenLanden[0].naam+' en '+gekozenLanden[1].naam+'!';
  }
  if(gekozenLanden.length === 1){
    return 'Goed gedaan! Als prijs krijg je een landenstempel voor '+gekozenLanden[0].naam+'!';
  }
  if(drempelBereikt){
    return 'Je paspoort zit al helemaal vol - knap hoor! 🏆';
  }
  return bijnaTekst;
}
// ── Landenpaspoort: verdiende stempels laten "vliegen" naar het paspoort-
// icoon ── zelfde functie als in index.html, zie de toelichting daar.
const STEMPEL_VLIEG_PAUZE_MS = 3000;
const STEMPEL_VLIEG_DUUR_MS = 850;
// containerEl (optioneel): als gegeven, verschijnt de rij daarin (in de
// normale tekstflow, bijv. midden in de Klaar-kaart) i.p.v. los boven het
// hele scherm - alleen het Klaar-scherm van Raad je plaatje gebruikt dit.
function toonVliegendeStempels(gekozenLanden, paspoortIconEl, containerEl){
  if(!gekozenLanden || !gekozenLanden.length || !paspoortIconEl) return;
  const rij = document.createElement('div');
  rij.className = 'stempel-vlieg-rij' + (containerEl ? ' inline' : '');
  gekozenLanden.forEach(land=>{
    const img = document.createElement('img');
    img.className = 'stempel-vlieg-plaatje';
    img.src = 'images/landenstempels/'+land.bestand+'.png';
    img.alt = land.naam;
    rij.appendChild(img);
  });
  (containerEl || document.body).appendChild(rij);
  void rij.offsetWidth; // forceert reflow, zodat de intro-transitie echt start vanaf onzichtbaar
  rij.classList.add('zichtbaar');

  setTimeout(()=>{
    if(!document.body.contains(paspoortIconEl)) return; // scherm inmiddels weg
    const doelRect = paspoortIconEl.getBoundingClientRect();
    const doelX = doelRect.left + doelRect.width*0.5;
    const doelY = doelRect.top + doelRect.height*0.5;
    const plaatjes = Array.from(rij.children);
    plaatjes.forEach((img, i)=>{
      setTimeout(()=>{
        const startRect = img.getBoundingClientRect();
        document.body.appendChild(img);
        img.style.position = 'fixed';
        img.style.margin = '0';
        img.style.left = startRect.left+'px';
        img.style.top = startRect.top+'px';
        img.style.width = startRect.width+'px';
        void img.offsetWidth;
        img.style.transition = 'left '+STEMPEL_VLIEG_DUUR_MS+'ms cubic-bezier(.4,0,.6,1), '
          +'top '+STEMPEL_VLIEG_DUUR_MS+'ms cubic-bezier(.4,0,.6,1), '
          +'width '+STEMPEL_VLIEG_DUUR_MS+'ms ease-in, opacity '+STEMPEL_VLIEG_DUUR_MS+'ms ease-in';
        img.style.left = (doelX-9)+'px';
        img.style.top = (doelY-9)+'px';
        img.style.width = '18px';
        img.style.opacity = '0.15';
        setTimeout(()=>{ img.remove(); }, STEMPEL_VLIEG_DUUR_MS+60);
      }, i*220);
    });
    setTimeout(()=>{ rij.remove(); }, plaatjes.length*220 + STEMPEL_VLIEG_DUUR_MS + 150);
  }, STEMPEL_VLIEG_PAUZE_MS);
}

// Eerste scherm dat de speler ziet: verplicht (een niet-lege) naam invullen
// voordat er een categorie gekozen kan worden - dat voorkomt dat spelers
// vergeten hun naam in te vullen en daardoor niet op het scorebord komen.
// Rondt zelf nog niet af: eerst moet het geheime woordje van deze naam
// gecontroleerd (of net gekozen) worden, zie toonGeheimwoordScherm().
function bevestigNaam(){
  const input = document.getElementById('naam-input');
  const naam = input.value.trim();
  if(!naam){
    input.style.borderColor = '#b03a2a';
    input.placeholder = 'Vul eerst je naam in...';
    input.focus();
    return;
  }
  if(bevatOngepasteTaal(naam)){
    input.style.borderColor = '#b03a2a';
    input.value = '';
    input.placeholder = 'Kies een andere naam...';
    input.focus();
    return;
  }
  input.style.borderColor = '';
  toonGeheimwoordScherm(naam);
}
// Rondt het inloggen daadwerkelijk af - wordt pas aangeroepen nadat het
// geheime woordje van 'naam' gecontroleerd (of net gekozen) is.

// ── Geheim woordje: voorkomt dat iemand een bestaande naam kan "stelen" ──
// Zelfde sleutels en logica als index.html (dat heeft een eigen,
// onafhankelijk naamscherm en moet dus apart even goed beschermd worden).
const GEHEIMWOORD_PREFIX = 'wonkywings_geheimwoord::';
function geheimwoordVoorNaam(naam){ return localStorage.getItem(GEHEIMWOORD_PREFIX+naam); }
function zetGeheimwoordVoorNaam(naam,woord){ localStorage.setItem(GEHEIMWOORD_PREFIX+naam, woord.trim().toLowerCase()); }
function woordKlopt(naam,ingevoerd){ return geheimwoordVoorNaam(naam)===ingevoerd.trim().toLowerCase(); }
let geheimwoordKandidaatNaam = '';
function toonGeheimwoordScherm(naam){
  geheimwoordKandidaatNaam = naam;
  const titelEl = document.getElementById('woord-titel');
  const foutEl = document.getElementById('woord-fout');
  const input = document.getElementById('woord-input');
  foutEl.classList.remove('zichtbaar');
  input.value = '';
  if(geheimwoordVoorNaam(naam)){
    titelEl.textContent = 'Wat is het geheime woordje van ' + naam + '?';
  } else {
    titelEl.textContent = 'Kies een geheim woord en onthoud dit nou, dan blijft jouw naam bewaard voor jou.';
  }
  toonScherm('scherm-woord');
  input.focus();
}
// Eén stapje terug naar het naam-scherm, bijvoorbeeld bij een typefout.
function terugNaarNaamScherm(){
  toonScherm('scherm-naam');
  document.getElementById('naam-input').focus();
}
function bevestigGeheimwoord(){
  const input = document.getElementById('woord-input');
  const foutEl = document.getElementById('woord-fout');
  const woord = input.value.trim();
  if(!woord){
    foutEl.textContent = 'Vul een geheim woordje in!';
    foutEl.classList.add('zichtbaar');
    input.focus();
    return;
  }
  if(geheimwoordVoorNaam(geheimwoordKandidaatNaam)){
    if(!woordKlopt(geheimwoordKandidaatNaam, woord)){
      foutEl.textContent = 'Dat is niet het juiste geheime woordje.';
      foutEl.classList.add('zichtbaar');
      input.value='';
      input.focus();
      return;
    }
  } else {
    zetGeheimwoordVoorNaam(geheimwoordKandidaatNaam, woord);
  }
  foutEl.classList.remove('zichtbaar');
  rondNaamAfMet(geheimwoordKandidaatNaam);
}
document.getElementById('woord-input').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); bevestigGeheimwoord(); }
  else if(e.key==='Escape'){ e.preventDefault(); terugNaarNaamScherm(); }
});

// ── Schermwissel ──
function toonScherm(id){
  document.querySelectorAll('.scherm').forEach(el=>el.classList.remove('actief'));
  document.getElementById(id).classList.add('actief');
  document.getElementById('antwoorden-grid').classList.toggle('actief', id==='scherm-spel');
  // Wereldkaart-achtergrond alleen bij het kiezen van een werelddeel, tijdens
  // het spel zelf, en bij het evalueren achteraf — niet bij naam/woordje.
  document.body.classList.toggle('wereldkaart-achtergrond', id==='scherm-kies' || id==='scherm-spel' || id==='scherm-klaar');
  // #klaar-paspoort-icoon en #klaar-linksboven-knoppen staan buiten #kader
  // (zie de notitie bij hun HTML) en volgen dus niet vanzelf de
  // .scherm-cascade - hier expliciet meesturen.
  document.getElementById('klaar-paspoort-icoon').style.display = (id==='scherm-klaar') ? 'block' : 'none';
  document.getElementById('klaar-linksboven-knoppen').style.display = (id==='scherm-klaar') ? 'flex' : 'none';
  // Spelkeuze en Landje Schuif hebben eigen fullscreen containers buiten
  // #kader; bij elke "normale" schermwissel moeten die dicht en #kader
  // weer zichtbaar worden.
  document.getElementById('spelkeuze-veld').classList.remove('actief');
  document.getElementById('landjeschuif-veld').classList.remove('actief');
  document.getElementById('kader').style.display = '';
  sluitUitvergroting();
}

// ── Landillustratie uitvergroten: klik erop om 'm groot over het hele
// scherm heen te tonen, nogmaals klikken (op de illustratie of de
// verduisterde achtergrond) of Escape brengt 'm terug naar normaal.
// De illustratie zelf verhuist tijdelijk naar <body>, buiten #kader: zolang
// hij binnen #kader bleef, werd 'position:fixed' door #kader's eigen
// drop-shadow-filter opeens relatief aan #kader in plaats van aan het hele
// scherm - vandaar dat de uitvergroting eerder scheef/naar rechts geschoven
// stond in plaats van gecentreerd. ──
const ILLUSTRATIE_EL = document.getElementById('land-illustratie');
const ILLUSTRATIE_WRAP_EL = document.getElementById('land-illustratie-wrap');
const ILLUSTRATIE_ACHTERGROND_EL = document.getElementById('illustratie-achtergrond');
function toonUitvergroting(){
  if(!ILLUSTRATIE_EL.src) return; // niets te tonen zolang er nog geen illustratie geladen is
  document.body.appendChild(ILLUSTRATIE_EL);
  ILLUSTRATIE_EL.classList.add('uitvergroot');
  ILLUSTRATIE_ACHTERGROND_EL.classList.add('actief');
}
function sluitUitvergroting(){
  ILLUSTRATIE_EL.classList.remove('uitvergroot');
  ILLUSTRATIE_ACHTERGROND_EL.classList.remove('actief');
  ILLUSTRATIE_WRAP_EL.appendChild(ILLUSTRATIE_EL); // terug naar zijn normale plek in het perkament
}
ILLUSTRATIE_EL.addEventListener('click', () => {
  if(ILLUSTRATIE_EL.classList.contains('uitvergroot')) sluitUitvergroting();
  else toonUitvergroting();
});
ILLUSTRATIE_ACHTERGROND_EL.addEventListener('click', sluitUitvergroting);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') sluitUitvergroting();
});

// ── Categorie-kiesscherm opbouwen ──
function bouwKiesScherm(){
  const wrap = document.getElementById('kies-inhoud');
  wrap.innerHTML = '';
  for(const groepNaam of ['Europa','Wereld','Iconische plekken']){
    const kop = document.createElement('div');
    kop.className = 'kies-groep-kop';
    kop.textContent = groepNaam;
    wrap.appendChild(kop);
    const lijst = document.createElement('div');
    lijst.className = 'kies-lijst';
    for(const cat of CATEGORIEEN.filter(c=>c.groep===groepNaam)){
      const rij = document.createElement('div');
      rij.className = 'kies-rij';
      rij.innerHTML = '<span class="kies-naam">'+cat.naam+'</span>\n        <button class="kies-scores-btn" title="Scores bekijken">🏆</button>';
      rij.querySelector('.kies-naam').onclick = () => startCategorie(cat.id);
      rij.querySelector('.kies-scores-btn').onclick = (e) => { e.stopPropagation(); toonScorebordAlleen(cat.id); };
      lijst.appendChild(rij);
    }
    wrap.appendChild(lijst);
  }
}

// ── Ronde starten ──
function startCategorie(catId){
  huidigeCategorie = CATEGORIEEN.find(c=>c.id===catId);
  if(!huidigeCategorie) return;
  const aantal = Math.min(AANTAL_VRAGEN_MAX, huidigeCategorie.landen.length);
  vraagLijst = shuffle([...huidigeCategorie.landen]).slice(0, aantal);
  vraagIdx = 0;
  aantalGoed = 0;
  tijdVerstreken = 0;
  zetWerelddeelLabel(huidigeCategorie.naam);
  document.getElementById('speler-waarde').textContent = huidigeSpelerNaam();
  updateGoedWeergave();
  toonScherm('scherm-spel');
  startTimer();
  toonVraag();
}
function updateGoedWeergave(){
  document.getElementById('goed-waarde').textContent = aantalGoed+' van de '+vraagLijst.length;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// ── Eén vraag tonen ──
function toonVraag(){
  vraagAfgehandeld = false;
  bouwBlokkentoren();

  const img = document.getElementById('land-illustratie');
  const plekLabel = document.getElementById('plek-naam-label');

  if(huidigeCategorie.plekken){
    // Iconische plekken: het plaatje toont een specifieke plek (met naam
    // erbij als onderschrift), en het antwoord is het LAND waar die plek
    // ligt - niet de plek zelf. De 3 foute opties zijn andere landen die
    // ook bij een (andere) iconische plek horen.
    const plek = PLEKKEN_BIJ_NAAM[vraagLijst[vraagIdx]];
    const correct = plek.land;
    plekLabel.textContent = plek.naam;
    plekLabel.style.display = 'block';
    img.onerror = null; // deze bestanden horen altijd te bestaan; geen vervang-fallback nodig
    img.src = 'images/plekken/' + plek.bestand + '.jpg';
    const anderenLanden = [...new Set(PLEKKEN_DATA.map(p=>p.land))].filter(l=>l!==correct);
    const fouteOpties = shuffle(anderenLanden).slice(0, 3);
    bouwAntwoordKnoppen(shuffle([correct, ...fouteOpties]), correct);
  } else {
    plekLabel.style.display = 'none';
    const correct = vraagLijst[vraagIdx];
    // 3 foute opties uit dezelfde categorie, nooit de goede zelf
    const anderen = huidigeCategorie.landen.filter(n=>n!==correct);
    const fouteOpties = shuffle([...anderen]).slice(0, 3);
    laadIllustratieMetFallback(correct, img);
    bouwAntwoordKnoppen(shuffle([correct, ...fouteOpties]), correct);
  }
}

// Bouwt de 4 antwoordknoppen op hun vaste plek (plek-0 t/m plek-3, exact op
// de 4 getekende balken in de achtergrondafbeelding) en past per knop de
// tekstgrootte aan: de balken hebben een vaste hoogte (ze moeten precies op
// de tekening passen), dus lange namen (bijv. 'Equatoriaal-Guinea',
// 'Centraal-Afrikaanse Republiek') mogen niet omslaan naar 2 regels - dat
// liep er zonder deze aanpassing gewoon bovenuit, de illustratie in.
function bouwAntwoordKnoppen(opties, correct){
  const grid = document.getElementById('antwoorden-grid');
  grid.innerHTML = '';
  opties.forEach((optie, i)=>{
    const btn = document.createElement('button');
    btn.className = 'antwoord-btn plek-'+i;
    btn.textContent = optie;
    btn.onclick = () => beantwoord(optie, correct, btn);
    grid.appendChild(btn);
    pasKnopTekstAan(btn);
  });
}
function zetWerelddeelLabel(tekst){
  const el = document.getElementById('werelddeel-waarde');
  el.textContent = tekst;
  const basis = 1.25, minimum = 0.6; // rem - basis is dezelfde max-waarde als in de CSS clamp()
  let grootte = basis;
  el.style.whiteSpace = 'nowrap';
  el.style.fontSize = grootte + 'rem';
  while(el.scrollWidth > el.clientWidth && grootte > minimum){
    grootte -= 0.05;
    el.style.fontSize = grootte + 'rem';
  }
}
function pasKnopTekstAan(btn){
  const basis = 1.5, minimum = 0.55; // rem - basis is dezelfde max-waarde als in de CSS clamp()
  let grootte = basis;
  btn.style.whiteSpace = 'nowrap';
  btn.style.fontSize = grootte + 'rem';
  while(btn.scrollWidth > btn.clientWidth && grootte > minimum){
    grootte -= 0.05;
    btn.style.fontSize = grootte + 'rem';
  }
}

// ── Blokkentoren: 10 bouwblokjes links van de illustratie, van onder naar
// boven ingevuld naarmate je verder komt (bij vraag 1 is het onderste blok
// al vol, bij vraag 2 de onderste twee, enz. — vraagIdx is 0-based). ──
function bouwBlokkentoren(){
  const toren = document.getElementById('blokkentoren');
  toren.innerHTML = '';
  for(let i=0; i<vraagLijst.length; i++){
    const blok = document.createElement('img');
    blok.className = 'blok-img';
    blok.src = i <= vraagIdx ? 'images/blokvol.png' : 'images/blokleeg.png';
    blok.alt = '';
    toren.appendChild(blok);
  }
}

// Als een illustratie onverhoopt ontbreekt: vervang deze vraag stilletjes
// door een ander, nog niet gebruikt land uit dezelfde categorie, in plaats
// van de speler op een kapotte afbeelding te laten stuiten.
function laadIllustratieMetFallback(naam, imgEl, pogingen){
  pogingen = pogingen || 0;
  imgEl.onerror = () => {
    if(pogingen >= 5) return; // geef het op, toon liever iets dan oneindig door te proberen
    const gebruikt = new Set(vraagLijst);
    const alternatieven = huidigeCategorie.landen.filter(n=>!gebruikt.has(n));
    if(alternatieven.length===0) return;
    const nieuw = alternatieven[Math.floor(Math.random()*alternatieven.length)];
    vraagLijst[vraagIdx] = nieuw;
    toonVraag(); // bouwt ook de antwoordknoppen opnieuw op met het nieuwe land
  };
  imgEl.src = 'images/landen/' + landNaarBestand(naam) + '.png';
}

// ── Antwoord verwerken ──
function beantwoord(gekozen, correct, btnEl){
  if(vraagAfgehandeld) return;
  vraagAfgehandeld = true;
  pauzeTimer();

  const alleKnoppen = document.querySelectorAll('#antwoorden-grid .antwoord-btn');
  alleKnoppen.forEach(b=>{
    b.disabled = true;
    if(b.textContent===correct) b.classList.add('goed');
    else if(b===btnEl) b.classList.add('fout');
  });

  // Ook een kader om de illustratie zelf, zodat goed/fout ook meteen visueel
  // gekoppeld is aan de afbeelding, niet alleen aan de antwoordknoppen.
  const img = document.getElementById('land-illustratie');
  img.classList.remove('antwoord-goed', 'antwoord-fout');
  img.classList.add(gekozen===correct ? 'antwoord-goed' : 'antwoord-fout');

  if(gekozen===correct){
    aantalGoed++;
    updateGoedWeergave();
  }

  setTimeout(()=>{
    document.getElementById('land-illustratie').classList.remove('antwoord-goed', 'antwoord-fout');
    vraagIdx++;
    if(vraagIdx >= vraagLijst.length){
      rondeKlaar();
    } else {
      hervatTimer();
      toonVraag();
    }
  }, 2400);
}

// ── Timer ──
function startTimer(){
  tijdRondeStart = performance.now() - tijdVerstreken;
  updateTimerWeergave();
  timerInterval = setInterval(updateTimerWeergave, 100);
  document.getElementById('timer-vak').classList.remove('gepauzeerd');
  document.getElementById('pauze-icoon').classList.remove('zichtbaar');
}
function pauzeTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  tijdVerstreken = performance.now() - tijdRondeStart;
  updateTimerWeergave();
  document.getElementById('timer-vak').classList.add('gepauzeerd');
  document.getElementById('pauze-icoon').classList.add('zichtbaar');
}
function hervatTimer(){ startTimer(); }
function updateTimerWeergave(){
  if(timerInterval) tijdVerstreken = performance.now() - tijdRondeStart;
  document.getElementById('timer-vak').textContent = formatTijdMs(tijdVerstreken);
}
function formatTijdMs(ms){
  const totaalSec = ms/1000;
  const m = Math.floor(totaalSec/60);
  const s = totaalSec - m*60;
  return m+':'+s.toFixed(1).padStart(4,'0');
}

// ── Ronde klaar: opslaan + scorebord ──
// 'totaal' = het werkelijke aantal vragen van déze ronde (vraagLijst.length),
// zodat het scorebord (hier én in highscores.html) altijd "x van de y" kan
// tonen zonder te hoeven gokken - eerder ontbrak dit veld, waardoor oudere
// scores altijd op een noodgreep-schatting terugvielen.
function opslaanRaadspelScoreOnline(catId, naam, goed, tijdMs, totaal){
  const nieuweRun = {naam, goed, tijdMs, totaal, datum:Date.now()};
  fsOpslaan('scores_raadspel', {catId, naam:nieuweRun.naam, goed:nieuweRun.goed, totaal:nieuweRun.totaal, tijdMs:nieuweRun.tijdMs, datum:nieuweRun.datum});
  return nieuweRun;
}
function laadRaadspelScoresOnline(catId, aantal, nieuweRun){
  return fsTopN('scores_raadspel', 'catId', catId, [['goed','desc'],['tijdMs','asc']],
    (a,b)=> (b.goed-a.goed) || (a.tijdMs-b.tijdMs), aantal, nieuweRun);
}

async function rondeKlaar(){
  pauzeTimer();
  const nieuweRun = opslaanRaadspelScoreOnline(huidigeCategorie.id, huidigeSpelerNaam(), aantalGoed, tijdVerstreken, vraagLijst.length);
  document.getElementById('klaar-titel').textContent = 'Klaar!';
  document.getElementById('klaar-resultaat').textContent =
    huidigeCategorie.naam+': '+aantalGoed+' van de '+vraagLijst.length+' goed, in '+formatTijdMs(tijdVerstreken);

  // ── Landenpaspoort: 6,7 of 8 goed = 1 verrassingsstempel, 9 of 10 goed = 2 ──
  let aantalStempels = 0;
  if(aantalGoed >= 9) aantalStempels = 2;
  else if(aantalGoed >= 6) aantalStempels = 1;
  const drempelBereikt = aantalStempels > 0;
  const gekozenLanden = drempelBereikt ? kiesBonusLanden(aantalStempels) : [];
  document.getElementById('klaar-stempel').textContent =
    stempelMeldingTekst(drempelBereikt, gekozenLanden, 'Bijna! Vanaf 6 landen goed krijg je een landenstempel.');
  document.getElementById('klaar-stempel-rij').innerHTML = '';

  document.getElementById('scorebord-lijst').innerHTML = '<div class="score-leeg">Scores laden…</div>';
  toonScherm('scherm-klaar');
  toonVliegendeStempels(gekozenLanden, document.getElementById('klaar-paspoort-icoon'), document.getElementById('klaar-stempel-rij'));

  const aanvraagId = ++scorebordAanvraagId;
  const lijst = await laadRaadspelScoresOnline(huidigeCategorie.id, 100, nieuweRun);
  if(aanvraagId !== scorebordAanvraagId) return; // ondertussen een ander scorebord geopend
  bouwScorebordLijst(lijst, nieuweRun);
}

// Scores bekijken vanuit het kies-scherm, zonder een ronde te spelen
async function toonScorebordAlleen(catId){
  const cat = CATEGORIEEN.find(c=>c.id===catId);
  if(!cat) return;
  huidigeCategorie = cat; // zodat 'Nog een keer' vanaf hier ook meteen die categorie start
  zetWerelddeelLabel(cat.naam);
  document.getElementById('speler-waarde').textContent = huidigeSpelerNaam();
  document.getElementById('klaar-titel').textContent = 'Scores — '+cat.naam;
  document.getElementById('klaar-resultaat').textContent = '';
  document.getElementById('klaar-stempel').textContent = '';
  document.getElementById('klaar-stempel-rij').innerHTML = '';
  document.getElementById('scorebord-lijst').innerHTML = '<div class="score-leeg">Scores laden…</div>';
  toonScherm('scherm-klaar');

  const aanvraagId = ++scorebordAanvraagId;
  const lijst = await laadRaadspelScoresOnline(catId, 100, null);
  if(aanvraagId !== scorebordAanvraagId) return;
  bouwScorebordLijst(lijst, null);
}

function bouwScorebordLijst(lijst, nieuweRun){
  const el = document.getElementById('scorebord-lijst');
  el.innerHTML = '';
  lijst = lijst.filter(r=>!isTestNaam(r.naam)); // testaccounts uitsluiten
  if(lijst.length===0){
    el.innerHTML = '<div class="score-leeg">Nog geen scores in deze categorie</div>';
    return;
  }
  lijst.slice(0,20).forEach((run, i)=>{
    const isEigen = nieuweRun && run.datum===nieuweRun.datum && run.naam===nieuweRun.naam;
    const rij = document.createElement('div');
    rij.className = 'score-rij' + (isEigen ? ' eigen' : '');
    rij.innerHTML = '<span class="score-plek">'+(i+1)+'</span><span class="score-naam">'+run.naam+'</span><span class="score-goed">'+run.goed+'/'+vraagAantalVoorWeergave(run)+'</span><span class="score-tijd">'+formatTijdMs(run.tijdMs)+'</span>';
    el.appendChild(rij);
  });
}
// Oudere scores kennen het totaal-aantal-vragen niet expliciet; val terug op
// het huidige categorie-aantal (nette weergave, geen harde eis).
function vraagAantalVoorWeergave(run){
  return run.totaal || (huidigeCategorie ? Math.min(AANTAL_VRAGEN_MAX, huidigeCategorie.landen.length) : AANTAL_VRAGEN_MAX);
}

function opnieuwSpelen(){
  if(!huidigeCategorie) return;
  startCategorie(huidigeCategorie.id);
}
function terugNaarKiezen(){
  zetWerelddeelLabel('—');
  document.getElementById('speler-waarde').textContent = '—';
  document.getElementById('goed-waarde').textContent = '0 van de 10';
  document.getElementById('timer-vak').textContent = '0:00.0';
  toonScherm('scherm-kies');
}
